<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Manager</title>
<style>
:root{--g:#0f766e;--g2:#115e59;--bg:#eef3f2;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--r:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);-webkit-tap-highlight-color:transparent}
.bar{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bar b{font-size:18px}.bar small{opacity:.85;display:block;font-size:12px}
.bar button{background:#ffffff26;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px}
#load{display:none;position:fixed;inset:0;background:#0f172a40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;align-items:center;justify-content:center}
#load .box{background:#fff;border-radius:20px;padding:22px 28px 20px;text-align:center;box-shadow:0 10px 40px #0003;width:250px;animation:pop .2s ease-out}
#load .emo{font-size:46px;line-height:1;display:inline-block;animation:hop .55s ease-in-out infinite alternate}
#load .sh{width:34px;height:6px;border-radius:50%;background:#0f172a1f;margin:6px auto 12px;animation:shd .55s ease-in-out infinite alternate}
#load b{display:block;font-size:17px}
#load .fun{display:block;color:var(--g);margin-top:4px;font-size:13px;font-weight:600;min-height:18px}
#load .tr{height:4px;border-radius:4px;background:#ccfbf1;margin:14px 0 0;overflow:hidden}
#load .tr i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--g),#5eead4);animation:sl 1s ease-in-out infinite}
#load small{display:block;color:var(--m);margin-top:10px;font-size:12px;min-height:14px}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes shd{from{transform:scaleX(1);opacity:1}to{transform:scaleX(.6);opacity:.5}}
@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
#tabs button{white-space:nowrap;border:1px solid var(--b);background:#f8fafc;color:#334155;border-radius:20px;padding:8px 14px;font-size:14px}
#tabs button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0f172a14}
h2{margin:0 0 4px;font-size:19px}h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--m);font-size:13px;margin:0 0 8px}
label{display:block;margin:12px 0 5px;font-size:13px;font-weight:600;color:#334155}
.hint{font-weight:400;color:var(--m);font-size:12px;margin-top:3px}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
input:focus,select:focus{outline:2px solid #5eead4;border-color:var(--g)}
.btn{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;margin-top:16px}
.btn.sec{background:#e2e8f0;color:#1e293b}.btn.red{background:var(--r)}.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0}
.link{background:none;border:0;color:var(--g);font-size:14px;margin-top:14px;width:100%;padding:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#f1f5f9;border-radius:12px;padding:12px}.tile span{font-size:12px;color:var(--m)}.tile b{display:block;font-size:20px;margin-top:2px}
.banner{border-radius:12px;padding:14px;margin:12px 0;font-weight:600}
.banner.pos{background:#dcfce7;color:#166534}.banner.neg{background:#fee2e2;color:#991b1b}.banner b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{color:var(--m);font-weight:600;font-size:12px}td:last-child,th:last-child{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--b);cursor:pointer}
.row:last-child{border:0}.row small{color:var(--m);display:block}
.badge{border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.pos{background:#dcfce7;color:#166534}.badge.neg{background:#fee2e2;color:#991b1b}
.flex{display:flex;gap:8px;align-items:center}.flex>*{flex:1}
.empty{text-align:center;color:var(--m);padding:26px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:10;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--r)}
.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;font-weight:600;line-height:1.4}
.alert.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}.alert.info{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}.alert.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert a{text-decoration:underline;font-weight:700;cursor:pointer}.alert .x{background:none;border:0;font-size:22px;line-height:1;color:inherit;padding:0 2px;opacity:.7}
.badge.warn{background:#fef3c7;color:#92400e}.badge.gray{background:#f1f5f9;color:#475569}
#modal{display:none;position:fixed;inset:0;background:#0f172a8c;z-index:30;align-items:center;justify-content:center;padding:16px}
#mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px #0004}
.bar .ic{position:relative;font-size:16px;padding:6px 10px}#bc{position:absolute;top:-7px;right:-7px;background:#dc2626;color:#fff;border-radius:10px;font:700 11px/1 system-ui;padding:3px 6px;font-style:normal}
@media print{#tabs,.bar,button,#toast,#al,#modal{display:none!important}}
</style></head><body>
<div id="load"><div class="box"><span class="emo" id="lemo">🍛</span><div class="sh"></div><b id="lmsg">Loading...</b><span class="fun" id="lfun"></span><div class="tr"><i></i></div><small id="lsub"></small></div></div>
<div class="bar"><div><b id="title">Mess Manager</b><small id="me"></small></div><div style="display:flex;gap:8px;align-items:center"><button id="bell" class="ic" title="Requests" style="display:none" onclick="go('req')">🔔<i id="bc" style="display:none"></i></button><button id="out" style="display:none" onclick="location.reload()">Log out</button></div></div>
<div id="tabs" style="display:none"></div>
<div class="wrap" id="al" style="padding-top:0;padding-bottom:0"></div>
<div class="wrap" id="v"><div class="empty">Loading...</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw_7rSc5kXsMjST6UexZniTrtwUeBWr_XBin1j_DrAP4Z6m33zbu_4kTcOoMVgTynVcjQ/exec';
const $ = s => document.querySelector(s);
let busy = 0, slow, fun, shown = 0;
const FUN = [['🍚', 'Cooking the rice...'], ['🛒', 'Visiting the bazar...'], ['🧮', 'Counting the meals...'], ['🐟', 'Frying the fish...'], ['🥘', 'Stirring the curry...'], ['🧾', 'Checking the bills...']];
const load = (d, msg) => {
  busy += d; const el = $('#load');
  if (busy > 0) {
    if (msg) $('#lmsg').textContent = msg;
    if (shown) return; shown = 1; $('#lsub').textContent = '';
    let k = Math.floor(Math.random() * FUN.length);
    const tick = () => { $('#lemo').textContent = FUN[k][0]; $('#lfun').textContent = FUN[k][1]; k = (k + 1) % FUN.length; };
    tick(); clearInterval(fun); fun = setInterval(tick, 1500); el.style.display = 'flex';
    clearTimeout(slow); slow = setTimeout(() => $('#lsub').textContent = 'Still working, please wait...', 4000);
  } else { busy = 0; shown = 0; clearInterval(fun); clearTimeout(slow); el.style.display = 'none'; }
};
const MSG = {save: 'Saving...', signup: 'Sending request...', login: 'Logging in...', setReturn: 'Saving...', request: 'Sending request...', boot: 'Logging in...'};
const call = (fn, a) => fetch(API + '?fn=' + fn + '&a=' + encodeURIComponent(JSON.stringify(a))).then(r => r.json())
  .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
  .catch(e => { throw new Error(/fetch/i.test(e.message) ? 'No internet connection. Please try again.' : e.message); });
const run = (fn, ...a) => { if (!RO[fn] && !(fn === 'mgr' && (a[2] === 'lists' || a[2] === 'reqs'))) VC = {}; load(1, MSG[fn] || (fn === 'mgr' && ['lists', 'reqs'].indexOf(a[2]) < 0 ? 'Saving...' : 'Loading...')); return call(fn, a).finally(() => load(-1)); };
const runQ = (fn, ...a) => call(fn, a);
const toast = (m, bad) => { const t = $('#toast'); t.textContent = m; t.className = (bad ? 'bad ' : '') + 'show'; clearTimeout(window._t); window._t = setTimeout(() => t.className = bad ? 'bad' : '', 3200); };
const err = e => toast(e.message, 1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f = x => (Math.round(x * 100) / 100).toLocaleString('en-US');
const tk = x => '৳' + f(x);
const SH = {L: 'Lunch', D: 'Dinner'};
const wrap = h => { $('#v').innerHTML = h; window.scrollTo(0, 0); };
let U, P, ROLE, I, NAMES = [], D, LM;

// ---------- start / login / sign up ----------
function start() {
  run('init').then(d => { I = d; $('#title').textContent = d.mess; showLogin(); })
    .catch(e => wrap(`<div class="card empty">${esc(e.message)}<button class="btn" onclick="start()">Try again</button></div>`));
}
function showLogin() {
  wrap(`<div class="card"><h2>Welcome</h2><p class="sub">Log in to continue</p>
  <label>Your name</label><select id="u"><option value="__manager">Manager</option>${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
  <label>4-digit PIN</label><input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="login()">Log in</button>
  <button class="link" onclick="showSignup()">New member? Create an account</button></div>`);
}
function login() {
  U = $('#u').value; P = $('#p').value;
  if (!/^\d{4}$/.test(P)) return toast('Please enter your 4-digit PIN', 1);
  run('boot', U, P).then(b => {
    ROLE = b.role; I = b.init; ME = b.me; VC = {};
    VC['me' + JSON.stringify([U, P])] = b.me; VC['report' + JSON.stringify([U, P])] = b.rep;
    $('#me').textContent = ROLE === 'M' ? 'Manager' : U; $('#out').style.display = '';
    buildTabs(); afterLogin(); go('rep');
  }).catch(err);
}
function showSignup() {
  wrap(`<div class="card"><h2>Create account</h2><p class="sub">The manager will approve your request.</p>
  <label>Full name</label><input id="sn" placeholder="e.g. Rahim Uddin">
  <label>Choose a 4-digit PIN<div class="hint">এই PIN দিয়ে আপনি লগইন করবেন। যেমন: 4821</div></label><input id="sp" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="signReview()">Continue</button><button class="link" onclick="showLogin()">Back to log in</button></div>`);
}
function signReview() {
  const n = $('#sn').value.trim(), p = $('#sp').value;
  if (n.length < 2) return toast('Please enter your name', 1);
  if (!/^\d{4}$/.test(p)) return toast('PIN must be 4 digits', 1);
  wrap(`<div class="card"><h3>Please check your details</h3><table><tr><td>Name</td><td><b>${esc(n)}</b></td></tr><tr><td>PIN</td><td><b>${esc(p)}</b></td></tr></table>
  <button class="btn" id="sc">Confirm and send request</button><button class="btn sec" onclick="showSignup()">Edit</button></div>`);
  $('#sc').onclick = () => run('signup', n, p).then(() => wrap(`<div class="card empty"><h2>Request sent ✅</h2><p>Please wait for the manager to approve you. After approval, log in with your name and PIN.</p><button class="btn" onclick="start()">Back to log in</button></div>`)).catch(err);
}

// ---------- navigation ----------
function buildTabs() {
  const t = [['rep','Report'],['day','Today'],['off','Meal Off'],['guest','Guest Meal'],['baz','Bazar'],['duty','Bazar Duty']];
  if (ROLE === 'M') t.splice(1, 0, ['req','Requests'], ['dep','Deposit']), t.push(['mem','Members'],['bill','Bills'],['mess','Mess'],['ent','Entries']); else t.splice(5, 0, ['pay','Payments']);
  $('#tabs').style.display = ''; $('#tabs').innerHTML = t.map(x => `<button id="t_${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.id === 't_' + t));
  CUR = t; VIEWS[t]();
}

// ---------- entry forms ----------
const FORMS = {
  off: ['Meal Off', 'Stop your meals while you are away. বাইরে থাকলে মিল বন্ধ রাখুন।', [
    ['offDate','Meal off from (date)','date'],['offShift','Starting from','shift'],
    ['onDate','Meal on again from (date)','date?','ফিরে আসার তারিখ জানা না থাকলে খালি রাখুন, পরে দিতে পারবেন।'],['onShift','Starting from','shift']]],
  guest: ['Guest Meal', 'Add guest meals eaten by your guests. অতিথি খেলে এখানে লিখুন।', [
    ['date','Date','date'],['shift','Meal','shift'],['count','Number of guests','number','যেমন: ২']]],
  baz: ['Bazar Entry', 'Record the bazar you bought. বাজারের খরচ এখানে লিখুন।', [
    ['date','Date','date'],['amount','Amount (৳)','number','যেমন: ৫০০'],['items','Items bought (optional)','text','যেমন: চাল, ডাল, মাছ']]],
  dep: ['Deposit Entry', 'Record money deposited by a member. সদস্যের জমা টাকা লিখুন।', [
    ['date','Date','date'],['amount','Amount (৳)','number','যেমন: ৩০০০'],['note','Note (optional)','text']]]
};
function inp(k, l, t, h) {
  const ty = t.startsWith('date') ? 'date' : t === 'number' ? 'number' : 'text';
  const hint = h ? `<div class="hint">${h}</div>` : '';
  if (t === 'shift') return `<label>${l}</label><select id="f_${k}"><option value="L">Lunch</option><option value="D">Dinner</option></select>`;
  return `<label>${l}${hint}</label><input id="f_${k}" type="${ty}" ${t === 'date' ? `value="${I.today}"` : ''} ${ty === 'number' ? 'inputmode="decimal" min="0"' : ''}>`;
}
async function form(type) {
  const [title, sub, fs] = FORMS[type];
  const mem = ROLE === 'M' ? `<label>Member</label><select id="f_member">${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>` : '';
  wrap(`<div class="card"><h2>${title}</h2><p class="sub">${sub}</p>${mem}${fs.map(x => inp(...x)).join('')}<button class="btn" onclick="review('${type}')">Continue</button></div><div id="offl"></div>`);
  if (type === 'off' && ROLE === 'U') offList();
}
function review(type) {
  const fs = FORMS[type][2], d = {};
  if (ROLE === 'M') d.member = $('#f_member').value;
  fs.forEach(x => d[x[0]] = $('#f_' + x[0]).value);
  const need = fs.filter(x => x[2] === 'date' || x[2] === 'number');
  if (need.some(x => !d[x[0]] || (x[2] === 'number' && !(Number(d[x[0]]) > 0)))) return toast('Please fill in all required fields', 1);
  const rows = [['Member', d.member || U]].concat(fs.filter(x => !(x[0] === 'onShift' && !d.onDate)).map(x => [x[1].replace(/ \(.*\)/, ''), x[2] === 'shift' ? SH[d[x[0]]] : (d[x[0]] || '-')]));
  wrap(`<div class="card"><h3>Please check your details</h3><table>${rows.map(r => `<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}</table>
  <button class="btn" id="cf">Confirm</button><button class="btn sec" onclick="go('${type}')">Edit</button></div>`);
  $('#cf').onclick = () => run('save', U, P, type, d).then(() => { toast('Saved successfully'); go(type); }).catch(err);
}
function offHtml(l) {
  const open = l.filter(r => !r[5]);
  return `<div class="card"><h3>My meal-off history</h3>${l.length ? `<table><tr><th>Off from</th><th>On again</th></tr>${l.slice(0, 12).map(r => `<tr><td>${r[3]} · ${SH[r[4]]}</td><td>${r[5] ? r[5] + ' · ' + SH[r[6]] : 'Not set'}</td></tr>`).join('')}</table>` : '<div class="empty">No entries yet</div>'}</div>
  ${open.map(r => `<div class="card"><h3>Back from ${r[3]}?</h3><p class="sub">Turn your meal on again. ফিরে এলে মিল চালু করুন।</p><div class="flex"><input type="date" id="r_${r[0]}" value="${I.today}"><select id="s_${r[0]}"><option value="L">Lunch</option><option value="D">Dinner</option></select></div><button class="btn" onclick="ret('${r[0]}')">Turn meal on</button></div>`).join('')}`;
}
function offList() {
  const k = 'myOffs' + U, draw = l => { const e = $('#offl'); if (e) e.innerHTML = offHtml(l); };
  if (VC[k]) draw(VC[k]);
  call('myOffs', [U, P]).then(l => { VC[k] = l; if (!typing()) draw(l); }).catch(err);
}
function ret(id) {
  run('setReturn', U, P, id, $('#r_' + id).value, $('#s_' + id).value).then(() => { toast('Meal is on again'); go('off'); }).catch(err);
}

// ---------- reports ----------
function vDay() {
  wrap(`<div class="card"><h2>Today's Meals</h2><p class="sub">See who is eating. কে কে খাবে দেখুন।</p><label>Date</label><input type="date" id="dd" value="${I.today}" onchange="loadDay()"><div id="dr"></div></div>`); loadDay();
}
function drawDay(d) {
  $('#dr').innerHTML = !d.ok ? '<div class="empty">The mess has not started yet.</div>' : ['L', 'D'].map(s => { const g = d['g' + s.toLowerCase()];
    return `<h3 style="margin-top:16px">${SH[s]} · ${d[s].length + g} meals</h3><div>${d[s].map(n => `<span class="badge pos" style="display:inline-block;margin:0 6px 6px 0">${esc(n)}</span>`).join('') || '<span class="sub">Nobody</span>'}${g ? `<span class="badge" style="background:#e0e7ff;color:#3730a3">+${g} guest</span>` : ''}</div>`; }).join('') + (d.fz && d.fz.length ? `<h3 style="margin-top:16px">Frozen (unpaid dues)</h3><div>${d.fz.map(n => `<span class="badge neg" style="display:inline-block;margin:0 6px 6px 0">${esc(n)}</span>`).join('')}</div>` : '');
}
function loadDay() {
  const dt = $('#dd').value, k = 'daily' + dt, hit = VC[k], ok = () => $('#dr') && $('#dd') && $('#dd').value === dt;
  if (hit) drawDay(hit); else load(1, 'Loading...');
  call('daily', [dt]).then(d => { VC[k] = d; if (!hit) load(-1); if (ok()) drawDay(d); }).catch(e => { if (!hit) load(-1); err(e); });
}
async function vRep() {
  let d; try { d = await rc('report', U, P); } catch (e) { return err(e); }
  D = d;
  if (!d.ok) return wrap('<div class="card empty"><h2>Mess not started</h2><p>The manager has not started the mess yet.</p></div>');
  NAMES = Object.keys(d.m);
  const sum = `<div class="card"><h2>Month Summary</h2><p class="sub">${d.cfg.Start} to ${d.cfg.End || 'today (running)'} · ${d.days} days</p><div class="tiles">
  <div class="tile"><span>Total bazar</span><b>${tk(d.tb)}</b></div><div class="tile"><span>Total meals</span><b>${d.tm}</b></div>
  <div class="tile"><span>Meal rate</span><b>${tk(d.rate)}</b></div><div class="tile"><span>Fixed bills</span><b>${tk(d.fixed)}</b></div>
  <div class="tile"><span>Total deposit</span><b>${tk(d.td)}</b></div><div class="tile"><span>Members</span><b>${d.cnt}</b></div></div></div>`;
  if (ROLE !== 'M') return wrap(sum + detail(0));
  wrap(sum + `<div class="card"><h3>Member Reports</h3><p class="sub">Tap a name to open the full report.</p>${NAMES.map((n, i) => { const x = d.m[n], p = x.bal >= 0;
    return `<div class="row" onclick="openMember(${i})"><div><b>${esc(n)}</b><small>${x.meals + x.guest} meals · cost ${tk(x.cost)}${x.blocked ? ' · <span style="color:#dc2626">Frozen</span>' : ''}</small></div><span class="badge ${p ? 'pos' : 'neg'}">${p ? 'Gets' : 'Pays'} ${tk(Math.abs(x.bal))}</span></div>`; }).join('') || '<div class="empty">No members yet</div>'}</div>`);
}
function openMember(i) { wrap(`<button class="btn sec sm" style="margin-bottom:12px" onclick="vRep()">← All members</button>` + detail(i)); }
function detail(i) {
  const n = NAMES[i], x = D.m[n], p = x.bal >= 0;
  return `<div class="card"><h2>${esc(n)}</h2><p class="sub">${D.cfg.Start} to ${D.cfg.End || 'today'}</p>

// ---------- notices, payments, requests, bazar duty ----------
const fmt = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'}) : '-';
const dayGap = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
let ME = {duties: []}, DIS = {}, pollT, lastPend = null, lastSt = null, MIDS = [], RQ = {reqs: [], signups: []};
const seenKey = () => 'mess_seen_' + U;
const getSeen = () => { try { return JSON.parse(localStorage.getItem(seenKey()) || '[]'); } catch (e) { return []; } };
const addSeen = ids => { try { localStorage.setItem(seenKey(), JSON.stringify(getSeen().concat(ids).slice(-100))); } catch (e) {} };
const stMap = m => { const o = {}; (m.mine || []).forEach(r => o[r[0]] = r[8]); return o; };
const reqText = r => r[3] === 'pay' ? 'Your payment request of ' + tk(r[4]) : 'Your grace period request';

function afterLogin() {
  lastPend = ROLE === 'M' ? ME.pending : null; lastSt = ROLE === 'U' ? stMap(ME) : null;
  setBell(); renderAlerts(); showModal(); startPoll();
}
function setBell() {
  if (ROLE !== 'M') return;
  const n = ME.pending || 0;
  $('#bell').style.display = ''; $('#bc').textContent = n; $('#bc').style.display = n ? '' : 'none';
  const t = $('#t_req'); if (t) t.textContent = 'Requests' + (n ? ' (' + n + ')' : '');
  document.title = (n ? '(' + n + ') ' : '') + 'Mess Manager';
}
function startPoll() {
  clearInterval(pollT);
  pollT = setInterval(async () => {
    if (document.hidden) return;
    try {
      const m = await runQ('me', U, P);
      if (ROLE === 'M') { if (lastPend !== null && m.pending > lastPend) toast('🔔 New request received'); lastPend = m.pending; }
      else { const s = stMap(m); Object.keys(s).forEach(id => { if (lastSt && lastSt[id] === 'Pending' && s[id] !== 'Pending') toast('Your request was ' + s[id].toLowerCase()); }); lastSt = s; }
      ME = m; VC['me' + JSON.stringify([U, P])] = m; setBell(); renderAlerts();
    } catch (e) {}
  }, 45000);
}

// Notices (shown as a window after login, then as a small strip at the top)
function notices() {
  const n = [], t = ME.today || I.today;
  if (ROLE !== 'U') return n;
  if (ME.blocked) n.push({k: 'blk', lvl: 'red', act: 1, txt: `Your account is frozen. You have ${tk(ME.due)} unpaid dues, so your meals are off. Please pay and send the payment, or ask the manager for a grace period.`});
  else if (ME.due > 0 && ME.graceUntil) n.push({k: 'gr', lvl: dayGap(t, ME.graceUntil) <= 0 ? 'red' : 'warn', act: 1, txt: `Warning: please pay ${tk(ME.due)} by ${fmt(ME.graceUntil)}. After that your account will be frozen.`});
  (ME.duties || []).filter(d => d[1] === U).forEach(d => {
    const a = dayGap(t, d[2]), range = fmt(d[2]) + ' to ' + fmt(d[3]); let lvl = 'info', txt = `Upcoming bazar duty: ${range}.`;
    if (a < 0) { lvl = 'red'; txt = `Your bazar duty is running now (${range}). Please do the bazar.`; }
    else if (a === 0) { lvl = 'red'; txt = `Your bazar duty starts today (${range}).`; }
    else if (a === 1) { lvl = 'red'; txt = `Your bazar duty starts tomorrow (${range}).`; }
    else if (a === 2) { lvl = 'warn'; txt = `Your bazar duty starts in 2 days (${range}).`; }
    n.push({k: 'duty' + d[0], lvl: lvl, txt: txt, dis: 1});
  });
  const o = {red: 0, warn: 1, info: 2};
  return n.sort((a, b) => o[a.lvl] - o[b.lvl]);
}
function renderAlerts() {
  $('#al').innerHTML = notices().filter(x => !DIS[x.k]).map(x => `<div class="alert ${x.lvl}"><div>${esc(x.txt)}${x.act ? ` <a onclick="go('pay')">Pay now</a>` : ''}</div>${x.dis ? `<button class="x" title="Hide" onclick="dis('${x.k}')">×</button>` : ''}</div>`).join('');
}
const dis = k => { DIS[k] = 1; renderAlerts(); };
function showModal() {
  const items = notices().filter(x => x.lvl !== 'info').map(x => ({lvl: x.lvl, txt: x.txt}));
  let goReq = false; MIDS = [];
  if (ROLE === 'U') {
    const seen = getSeen();
    (ME.mine || []).filter(r => r[8] !== 'Pending' && seen.indexOf(r[0]) < 0).forEach(r => {
      MIDS.push(r[0]); const ok = r[8] === 'Approved';
      items.push({lvl: ok ? 'ok' : 'red', txt: reqText(r) + ' was ' + r[8].toLowerCase() + '.' + (ok && r[9] ? ' ' + r[9] + '.' : '')});
    });
  } else if (ME.pending > 0) { items.push({lvl: 'warn', txt: `You have ${ME.pending} request${ME.pending > 1 ? 's' : ''} waiting for your decision.`}); goReq = true; }
  if (!items.length) return;
  $('#mbox').innerHTML = `<h3>${ROLE === 'M' ? 'Waiting for you' : 'Important notices'}</h3>${items.map(x => `<div class="alert ${x.lvl}" style="margin:0 0 10px"><div>${esc(x.txt)}</div></div>`).join('')}<button class="btn" onclick="closeModal(${goReq})">${goReq ? 'Open requests' : 'OK, got it'}</button>`;
  $('#modal').style.display = 'flex';
}
function closeModal(goReq) {
  $('#modal').style.display = 'none'; if (MIDS.length) addSeen(MIDS); MIDS = [];
  if (goReq) go('req');
}

  <div class="card"><h2>Bazar Schedule</h2><p class="sub">Who does the bazar and when.</p>${l.length ? l.map(d => { const b = bd(d), me = d[1] === U; return `<div class="row" style="cursor:default${me ? ';background:#f0fdfa;border-radius:10px' : ''}"><div><b>${esc(d[1])}${me ? ' (you)' : ''}</b><small>${fmt(d[2])} to ${fmt(d[3])}</small></div><div class="flex" style="flex:0 0 auto"><span class="badge ${b[0]}">${b[1]}</span>${ROLE === 'M' ? `<button class="btn sm red" onclick="dutyDel('${d[0]}')">Remove</button>` : ''}</div></div>`; }).join('') : '<div class="empty">No bazar duty planned</div>'}</div>`);
}
const dutyAdd = () => { const d = {member: $('#dm').value, from: $('#df').value, to: $('#dt').value}; if (!d.from || !d.to || d.to < d.from) return toast('Please choose valid dates', 1); M('dutyAdd', d).then(() => { toast('Added to schedule'); vDuty(); }).catch(err); };
const dutyDel = id => confirm('Remove this duty?') && M('dutyDel', {id: id}).then(() => { toast('Removed'); vDuty(); }).catch(err);

// ---------- speed: instant tabs (show saved data first, refresh quietly) ----------
let VC = {}, CUR = '';
const RO = {init: 1, boot: 1, login: 1, me: 1, report: 1, daily: 1, myOffs: 1};
const VIEWS = {off: () => form('off'), guest: () => form('guest'), baz: () => form('baz'), dep: () => form('dep'), req: vReq, pay: vPay, duty: vDuty, rep: vRep, day: vDay, mem: vMem, bill: vBill, mess: vMess, ent: vEnt};
const typing = () => { const e = document.activeElement; return !!(e && /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && $('#v').contains(e)); };
const rc = (fn, ...a) => {
  const k = fn + JSON.stringify(a), hit = VC[k], tab = CUR, get = () => call(fn, a).then(d => (VC[k] = d));
  if (hit === undefined) { load(1, 'Loading...'); return get().finally(() => load(-1)); }
  get().then(d => { if (JSON.stringify(d) !== JSON.stringify(hit) && CUR === tab && !typing() && VIEWS[tab]) VIEWS[tab](); }).catch(() => {});
  return Promise.resolve(hit);
};

start();
</script></body></html>
