<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Manager</title>
<style>
:root{--g:#0f766e;--g2:#115e59;--bg:#f1f5f9;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--r:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--t);-webkit-tap-highlight-color:transparent;line-height:1.5}
.bar{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bar b{font-size:18px;letter-spacing:-.2px}.bar small{opacity:.85;display:block;font-size:12px}
.bar button{background:#ffffff24;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
#load{display:none;position:fixed;inset:0;background:#0f172a45;backdrop-filter:blur(3px);z-index:20;align-items:center;justify-content:center}
#load .box{background:#fff;border-radius:18px;padding:20px 26px;text-align:center;box-shadow:0 10px 35px #0003;width:250px}
#load .emo{font-size:40px;display:inline-block;animation:hop .55s ease-in-out infinite alternate}
#load b{display:block;font-size:16px;margin-top:8px}
#load .fun{display:block;color:var(--g);margin-top:4px;font-size:13px;font-weight:600}
#load small{display:block;color:var(--m);margin-top:8px;font-size:12px}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
#tabs button{white-space:nowrap;border:1px solid var(--b);background:#f8fafc;color:#334155;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer}
#tabs button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.wrap{max-width:600px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0f172a12;border:1px solid #e2e8f080}
h2{margin:0 0 4px;font-size:18px;font-weight:700}h3{margin:0 0 10px;font-size:15px;font-weight:700}
.sub{color:var(--m);font-size:13px;margin:0 0 10px}
label{display:block;margin:12px 0 5px;font-size:13px;font-weight:600;color:#334155}
.hint{font-weight:400;color:var(--m);font-size:12px;margin-top:2px}
input,select,textarea{width:100%;padding:10px 12px;font-size:15px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--g)}
.btn{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;margin-top:14px;cursor:pointer}
.btn.sec{background:#e2e8f0;color:#1e293b}.btn.red{background:var(--r)}.btn.sm{width:auto;padding:7px 12px;font-size:13px;margin:0}
.link{background:none;border:0;color:var(--g);font-size:14px;margin-top:12px;width:100%;padding:6px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:11px 12px}.tile span{font-size:12px;color:var(--m);display:block}.tile b{display:block;font-size:19px;margin-top:2px;color:var(--t)}
.banner{border-radius:12px;padding:14px 16px;margin:12px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.banner.pos{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}.banner.neg{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.banner b{font-size:22px}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:8px 6px;border-bottom:1px solid var(--b);text-align:left;vertical-align:middle}th{color:var(--m);font-weight:600;font-size:12px;background:#f8fafc}td:last-child,th:last-child{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--b);cursor:pointer;gap:8px}
.row:last-child{border:0}.row small{color:var(--m);display:block;font-size:12.5px}
.badge{border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.pos{background:#dcfce7;color:#166534}.badge.neg{background:#fee2e2;color:#991b1b}.badge.warn{background:#fef3c7;color:#92400e}.badge.gray{background:#f1f5f9;color:#475569}
.flex{display:flex;gap:8px;align-items:center}.flex>*{flex:1}
.empty{text-align:center;color:var(--m);padding:24px 10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:40;max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--r)}
.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13.5px;font-weight:500;line-height:1.45}
.alert.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}.alert.info{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}.alert.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert a{text-decoration:underline;font-weight:700;cursor:pointer}.alert .x{background:none;border:0;font-size:20px;line-height:1;color:inherit;padding:0 2px;opacity:.7;cursor:pointer}
.bn-sub{display:block;font-size:12.5px;color:inherit;opacity:.88;margin-top:4px;font-weight:400}
#modal{display:none;position:fixed;inset:0;background:#0f172a8c;z-index:30;align-items:center;justify-content:center;padding:16px}
#mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:430px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px #0004}
.bar .ic{position:relative;font-size:16px;padding:6px 10px}#bc{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:10px;font:700 11px/1 system-ui;padding:3px 6px;font-style:normal}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:8px 0;font-size:14px}.chk input{width:auto;transform:scale(1.2)}
.call-btn{display:inline-flex;align-items:center;gap:4px;background:var(--g);color:#fff;text-decoration:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.rep-sec{margin-top:16px;border:1px solid var(--b);border-radius:10px;overflow:hidden}
.rep-sec h4{margin:0;padding:8px 12px;background:#f8fafc;font-size:13px;color:#334155;border-bottom:1px solid var(--b)}
.rep-sec table td,.rep-sec table th{padding:8px 12px}
@media print{#tabs,.bar,button,#toast,#al,#modal,.no-print{display:none!important}.card{box-shadow:none;border:1px solid #cbd5e1}}
</style></head><body>
<div id="load"><div class="box"><span class="emo" id="lemo">🍛</span><b id="lmsg">Loading...</b><span class="fun" id="lfun"></span><small id="lsub"></small></div></div>
<div class="bar"><div><b id="title">Mess Manager</b><small id="me"></small></div><div style="display:flex;gap:8px;align-items:center"><button id="bell" class="ic" title="Requests" style="display:none" onclick="go('req')">🔔<i id="bc" style="display:none"></i></button><button id="out" style="display:none" onclick="logout()">Log out</button></div></div>
<div id="tabs" style="display:none"></div>
<div class="wrap" id="al" style="padding-top:0;padding-bottom:0"></div>
<div class="wrap" id="v"><div class="empty">Loading...</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw_7rSc5kXsMjST6UexZniTrtwUeBWr_XBin1j_DrAP4Z6m33zbu_4kTcOoMVgTynVcjQ/exec';
const $ = s => document.querySelector(s);

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmt = d => { if (!d) return '-'; const p = String(d).split('-'); return p.length < 3 ? d : (+p[2]) + ' ' + MON[+p[1] - 1] + ' ' + p[0]; };
const f = x => (Math.round(x * 100) / 100).toLocaleString('en-US');
const tk = x => '৳' + f(x);
function enTime(t) {
  const h = +t.slice(0, 2), m = t.slice(3), h12 = h % 12 || 12;
  return h12 + (m === '00' ? '' : ':' + m) + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function bnTime(t) {
  const h = +t.slice(0, 2), m = t.slice(3), h12 = h % 12 || 12;
  const per = h < 4 ? 'রাত' : h < 6 ? 'ভোর' : h < 12 ? 'সকাল' : h < 16 ? 'দুপুর' : h < 18 ? 'বিকেল' : h < 20 ? 'সন্ধ্যা' : 'রাত';
  return per + ' ' + h12 + (m === '00' ? '' : ':' + m) + 'টা';
}
const SH = {L: 'Lunch', D: 'Dinner'};
const STL = {Pending: 'Pending', Approved: 'Approved', Rejected: 'Rejected'};

// ---------- Loading ----------
let busy = 0, slow, fun, shown = 0;
const FUN = [['🍚', 'Preparing meals...'], ['🛒', 'Checking bazar...'], ['🧮', 'Calculating bills...'], ['🧾', 'Syncing data...']];
const load = (d, msg) => {
  busy += d; const el = $('#load');
  if (busy > 0) {
    if (msg) $('#lmsg').textContent = msg;
    if (shown) return; shown = 1; $('#lsub').textContent = '';
    let k = Math.floor(Math.random() * FUN.length);
    const tick = () => { $('#lemo').textContent = FUN[k][0]; $('#lfun').textContent = FUN[k][1]; k = (k + 1) % FUN.length; };
    tick(); clearInterval(fun); fun = setInterval(tick, 1400); el.style.display = 'flex';
    clearTimeout(slow); slow = setTimeout(() => $('#lsub').textContent = 'Taking a moment, please wait...', 4000);
  } else { busy = 0; shown = 0; clearInterval(fun); clearTimeout(slow); el.style.display = 'none'; }
};
const MSG = {save: 'Saving...', signup: 'Sending request...', login: 'Logging in...', setReturn: 'Saving...', request: 'Sending request...', boot: 'Logging in...'};
const READ_ACTS = ['lists', 'reqs', 'adv', 'mo', 'nt'];
const call = (fn, a) => fetch(API + '?fn=' + fn + '&a=' + encodeURIComponent(JSON.stringify(a))).then(r => r.json())
  .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
  .catch(e => { throw new Error(/fetch|network/i.test(e.message) ? 'No internet connection. Please try again.' : e.message); });
const run = (fn, ...a) => {
  if (!RO[fn] && !(fn === 'mgr' && READ_ACTS.indexOf(a[2]) >= 0)) VC = {};
  load(1, MSG[fn] || (fn === 'mgr' && READ_ACTS.indexOf(a[2]) < 0 ? 'Saving...' : 'Loading...'));
  return call(fn, a).finally(() => load(-1));
};
const runQ = (fn, ...a) => call(fn, a);
const toast = (m, bad) => { const t = $('#toast'); t.textContent = m; t.className = (bad ? 'bad ' : '') + 'show'; clearTimeout(window._t); window._t = setTimeout(() => t.className = bad ? 'bad' : '', 3600); };
const err = e => toast(e.message, 1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const wrap = h => { $('#v').innerHTML = h; window.scrollTo(0, 0); };
const stamp = d => (d.t0 = Date.now(), d);
let U, P, TOK, ROLE, I, NAMES = [], D, LM;

// ---------- Auth & Session Security (sessionStorage + Server Signed Token) ----------
// Using sessionStorage ensures copying the URL/link to another tab/device NEVER bypasses login
const SK = 'mess_sess_v2';
try { localStorage.removeItem('mess_session'); } catch (e) {}
const loadSess = () => { try { const s = JSON.parse(sessionStorage.getItem(SK)); return s && s.U && /^\d{4}$/.test(s.P) && s.TOK ? s : null; } catch (e) { return null; } };
const saveSess = () => { try { sessionStorage.setItem(SK, JSON.stringify({U, P, TOK})); } catch (e) {} };
const clearSess = () => { try { sessionStorage.removeItem(SK); } catch (e) {} };
const logout = () => { clearSess(); location.reload(); };

function start() {
  run('init').then(d => {
    I = stamp(d);
    $('#title').textContent = d.mess;
    const s = loadSess();
    if (s) return doLogin(s.U, s.P, s.TOK, true);
    showLogin();
  }).catch(e => wrap(`<div class="card empty">${esc(e.message)}<button class="btn" onclick="start()">Try again</button></div>`));
}

function showLogin() {
  wrap(`<div class="card"><h2>Welcome</h2><p class="sub">Log in with your name and 4-digit PIN</p>
  <label>Select Account</label><select id="u"><option value="__manager">Mess Manager</option>${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
  <label>4-Digit PIN</label><input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="login()">Log in</button>
  <button class="link" onclick="showSignup()">New member? Create an account</button></div>`);
}

function login() {
  const u = $('#u').value, p = $('#p').value;
  if (!/^\d{4}$/.test(p)) return toast('Please enter your 4-digit PIN', 1);
  run('login', u, p).then(res => doLogin(u, p, res.token, false)).catch(err);
}

function doLogin(u, p, tok, silent) {
  U = u; P = p; TOK = tok;
  return run('boot', U, P, TOK).then(b => {
    ROLE = b.role; TOK = b.token || TOK; I = stamp(b.init); ME = b.me; VC = {};
    VC['me' + JSON.stringify([U, P, TOK])] = b.me;
    VC['report' + JSON.stringify([U, P, TOK])] = b.rep;
    $('#me').textContent = ROLE === 'M' ? 'Mess Manager' : U;
    $('#out').style.display = '';
    saveSess(); buildTabs(); afterLogin(); go('rep');
  }).catch(e => {
    clearSess();
    if (!silent) return err(e);
    showLogin();
  });
}

function showSignup() {
  wrap(`<div class="card"><h2>Create Account</h2><p class="sub">The manager will approve your request before you can log in.</p>
  <label>Full Name</label><input id="sn" placeholder="e.g. Rahim Uddin">
  <label>Mobile Number<div class="hint">11-digit Bangladeshi number (e.g. 017XXXXXXXX)</div></label><input id="sph" type="tel" inputmode="tel" maxlength="14" placeholder="017XXXXXXXX">
  <label>Choose a 4-Digit PIN<div class="hint">You will use this PIN to log in.</div></label><input id="sp" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="signReview()">Continue</button><button class="link" onclick="showLogin()">Back to log in</button></div>`);
}

function signReview() {
  const n = $('#sn').value.trim(), ph = $('#sph').value.trim(), p = $('#sp').value;
  if (n.length < 2) return toast('Please enter your full name', 1);
  if (!/^01[3-9]\d{8}$/.test(ph.replace(/[\s\-+]/g, '').replace(/^88/, ''))) return toast('Please enter a valid 11-digit mobile number', 1);
  if (!/^\d{4}$/.test(p)) return toast('PIN must be 4 digits', 1);
  wrap(`<div class="card"><h3>Review Your Details</h3><table><tr><td>Name</td><td><b>${esc(n)}</b></td></tr><tr><td>Mobile</td><td><b>${esc(ph)}</b></td></tr><tr><td>PIN</td><td><b>${esc(p)}</b></td></tr></table>
  <button class="btn" id="sc">Submit Request</button><button class="btn sec" onclick="showSignup()">Edit</button></div>`);
  $('#sc').onclick = () => run('signup', n, p, ph).then(() => wrap(`<div class="card empty"><h2>Request Sent ✅</h2><p>Please wait for the manager to approve your account. Once approved, log in with your name and PIN.</p><button class="btn" onclick="start()">Back to Log in</button></div>`)).catch(err);
}

// ---------- Organized Navigation ----------
function buildTabs() {
  let t;
  if (ROLE === 'M') {
    t = [
      ['rep', 'Report'],
      ['req', 'Requests'],
      ['adv', 'Advance'],
      ['ann', 'Notices'],
      ['dep', 'Deposits'],
      ['day', "Today's Meals"],
      ['off', 'Meal Off'],
      ['guest', 'Guest Meal'],
      ['baz', 'Bazar'],
      ['duty', 'Duty'],
      ['mem', 'Members'],
      ['bill', 'Bills'],
      ['mess', 'Settings'],
      ['ent', 'Entries'],
      ['dir', 'Contacts']
    ];
  } else {
    t = [
      ['rep', 'Report'],
      ['day', "Today's Meals"],
      ['off', 'Meal Off'],
      ['guest', 'Guest Meal'],
      ['baz', 'Bazar'],
      ['duty', 'Duty'],
      ['pay', 'Requests'],
      ['dir', 'Contacts']
    ];
  }
  $('#tabs').style.display = '';
  $('#tabs').innerHTML = t.map(x => `<button id="t_${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.id === 't_' + t));
  CUR = t; if (t !== 'pay') PRE = null; VIEWS[t]();
}

// ---------- Forms (Meal Off, Guest, Bazar, Deposit) ----------
const FORMS = {
  off: ['Meal Off', 'Turn off your meals when away. Duplicate meal-off for the same meal is blocked.', [
    ['offDate', 'Meal Off From (Date)', 'date'], ['offShift', 'Starting Shift', 'shift'],
    ['onDate', 'Meal On Again (Date - Optional)', 'date?', 'Leave blank if return date is unknown; you can turn it on later.'], ['onShift', 'Starting Shift', 'shift']]],
  guest: ['Guest Meal', 'Record meals eaten by your guests.', [
    ['date', 'Date', 'date'], ['shift', 'Shift', 'shift'], ['count', 'Number of Guests', 'number', 'e.g. 2']]],
  baz: ['Bazar Expense', 'Record bazar you purchased for the mess.', [
    ['date', 'Date', 'date'], ['amount', 'Amount (৳)', 'number', 'e.g. 500'], ['items', 'Items Bought (Optional)', 'text', 'e.g. Rice, Fish, Vegetables']]],
  dep: ['Deposit Entry', 'Record cash/mobile deposit received from a member.', [
    ['date', 'Date', 'date'], ['amount', 'Amount (৳)', 'number', 'e.g. 3000'], ['note', 'Note (Optional)', 'text']]]
};
function inp(k, l, t, h) {
  const ty = t.startsWith('date') ? 'date' : t === 'number' ? 'number' : 'text';
  const hint = h ? `<div class="hint">${h}</div>` : '';
  const minAttr = (k === 'offDate' || k === 'onDate') ? `min="${I.today}"` : '';
  if (t === 'shift') return `<label>${l}</label><select id="f_${k}"><option value="L">${SH.L}</option><option value="D">${SH.D}</option></select>`;
  return `<label>${l}${hint}</label><input id="f_${k}" type="${ty}" ${t === 'date' ? `value="${I.today}"` : ''} ${minAttr} ${ty === 'number' ? 'inputmode="decimal" min="0"' : ''}>`;
}

// Rule Box (English + Bangla for Meal-Off Deadlines)
const hm = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
function ruleBox() {
  const k = I.rules, n = hm(k.now) + Math.floor((Date.now() - I.t0) / 60000);
  let statusEn = '', statusBn = '';
  if (n < hm(k.lunch)) {
    statusEn = "Status: You can turn off today's Lunch, today's Dinner, or future meals.";
    statusBn = 'বর্তমান অবস্থা: এখন আজকের লাঞ্চ, আজকের ডিনার এবং আগামী দিনের মিল বন্ধ করতে পারবেন।';
  } else if (n < hm(k.dinner)) {
    statusEn = "Status: Today's Lunch deadline has passed. You can turn off today's Dinner and future meals.";
    statusBn = 'বর্তমান অবস্থা: আজকের লাঞ্চ বন্ধের সময় শেষ। এখন আজকের ডিনার এবং আগামী দিনের মিল বন্ধ করতে পারবেন।';
  } else if (n < hm(k.nextLunch)) {
    statusEn = "Status: Today's meals are locked. You can turn off tomorrow's Lunch (before " + enTime(k.nextLunch) + " tonight) and future meals.";
    statusBn = 'বর্তমান অবস্থা: আজকের মিল বন্ধের সময় শেষ। আগামীকালের লাঞ্চ আজ ' + bnTime(k.nextLunch) + '-এর মধ্যে বন্ধ করতে পারবেন।';
  } else {
    statusEn = "Status: Today's meals and tomorrow's Lunch are locked. You can turn off meals starting from tomorrow's Dinner.";
    statusBn = 'বর্তমান অবস্থা: আজকের মিল এবং আগামীকালের লাঞ্চ বন্ধের সময় শেষ। আগামীকালের ডিনার থেকে বন্ধ করতে পারবেন।';
  }
  return `<div class="alert info" style="margin:0 0 8px"><div>
    <b>Meal-Off Deadlines & Rules:</b><br>
    • Today's Lunch: before <b>${enTime(k.lunch)}</b> | Today's Dinner: before <b>${enTime(k.dinner)}</b><br>
    • Tomorrow's Lunch: before <b>${enTime(k.nextLunch)}</b> tonight (cook prepares based on night count)<br>
    • Past dates cannot be turned off or on.<br>
    <b>${statusEn}</b>

  wrap(`<div id="off_ok_box"></div><div class="card"><h2>${title}</h2><p class="sub">${sub}</p>${type === 'off' && ROLE === 'U' ? ruleBox() : ''}${mem}${fs.map(x => inp(...x)).join('')}<button class="btn" onclick="review('${type}')">Continue</button></div><div id="offl"></div>`);

function review(type) {
  const fs = FORMS[type][2], d = {};

  fs.forEach(x => d[x[0]] = $('#f_' + x[0]).value);

  if (need.some(x => !d[x[0]] || (x[2] === 'number' && !(Number(d[x[0]]) > 0)))) return toast('Please fill in all required fields', 1);
  const val = x => x[2] === 'shift' ? SH[d[x[0]]] : x[2].startsWith('date') ? (d[x[0]] ? fmt(d[x[0]]) : '-') : x[2] === 'number' && x[0] === 'amount' ? tk(d[x[0]]) : (d[x[0]] || '-');
  const rows = [['Member', d.member || U]].concat(fs.filter(x => !(x[0] === 'onShift' && !d.onDate)).map(x => [x[1].replace(/\s*\(.*\)/, ''), val(x)]));
  wrap(`<div class="card"><h3>Please Confirm Details</h3><table>${rows.map(r => `<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}</table>

            Please call the cook to inform immediately.<br>

        <tr><td>Meal Cost (${x.meals + x.guest} × ${tk(D.rate)})</td><td><b>${tk(x.mealCost)}</b></td></tr>
        ${billsRows}
        <tr style="background:#f1f5f9"><td><b>Total Monthly Expense</b></td><td><b>${tk(exp)}</b></td></tr>

      </table>
    </div>

    ${x.bl.length ? `<div class="rep-sec"><h4>3. Bazar Log (${x.bl.length} days)</h4><table><tr><th>Date</th><th>Items</th><th>Amount</th></tr>${x.bl.map(r => `<tr><td>${fmt(r[0])}</td><td>${esc(r[2]) || '-'}</td><td>${tk(r[1])}</td></tr>`).join('')}</table></div>` : ''}
    ${x.dl.length ? `<div class="rep-sec"><h4>4. Deposit Log</h4><table><tr><th>Date</th><th>Amount</th></tr>${x.dl.map(r => `<tr><td>${fmt(r[0])}</td><td>${tk(r[1])}</td></tr>`).join('')}</table></div>` : ''}

  </div>`;
}

function share(i) {
  const n = NAMES[i], x = D.m[n], exp = x.mealCost + x.share;
  const t = [
    `*${n} - Mess Statement* (${fmt(D.cfg.Start)} to ${D.cfg.End ? fmt(D.cfg.End) : 'Today'})`,
    `Meals: ${x.meals + x.guest} × ${tk(D.rate)} = ${tk(x.mealCost)}`,
    `Fixed Bills Share: ${tk(x.share)}`,
    `Total Expense: ${tk(exp)}`,
    `Deposits: ${tk(x.dep)} | Bazar Spent: ${tk(x.bazar)} (${x.bl.length} days)`,
    x.open ? `Previous Balance: ${x.open > 0 ? '+' : '-'}${tk(Math.abs(x.open))}` : '',
    `*${x.bal >= 0 ? 'Net Receivable' : 'Net Payable'}: ${tk(Math.abs(x.bal))}*`
  ].filter(Boolean).join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Summary copied to clipboard')).catch(() => prompt('Copy this summary:', t));
}

// ---------- Live Notifications & Polling ----------
let ME = {duties: []}, DIS = {}, pollT, lastPend = null, lastSt = null, MIDS = [], RQ = {reqs: [], signups: []};
const seenKey = () => 'mess_seen_' + U;
const getSeen = () => { try { return JSON.parse(localStorage.getItem(seenKey()) || '[]'); } catch (e) { return []; } };
const addSeen = ids => { try { localStorage.setItem(seenKey(), JSON.stringify(getSeen().concat(ids).slice(-100))); } catch (e) {} };
const dayGap = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const stMap = m => { const o = {}; (m.mine || []).forEach(r => o[r[0]] = r[8]); return o; };
const reqText = r => r[3] === 'pay' ? 'Your ' + tk(r[4]) + ' payment request' : r[3] === 'grace' ? 'Your grace period request' : 'Your request ("' + r[7] + '")';

function afterLogin() {
  lastPend = ROLE === 'M' ? ME.pending : null;
  lastSt = ROLE === 'U' ? stMap(ME) : null;
  setBell(); renderAlerts(); showModal(); startPoll();
}
function setBell() {
  if (ROLE !== 'M') return;
  const n = ME.pending || 0;
  $('#bell').style.display = ''; $('#bc').textContent = n; $('#bc').style.display = n ? '' : 'none';
  const t = $('#t_req'); if (t) t.textContent = 'Requests' + (n ? ' (' + n + ')' : '');
  document.title = (n ? '(' + n + ') ' : '') + 'Mess Manager';
}
const newIds = (a, b) => { const old = (a || []).map(x => x[0]); return (b || []).some(x => old.indexOf(x[0]) < 0); };

// Poll every 20 seconds so members immediately see approved/rejected requests & new notices while active in the app
function startPoll() {
  clearInterval(pollT);
  pollT = setInterval(async () => {
    if (document.hidden) return;
    try {
      const m = await runQ('me', U, P, TOK);
      if (ROLE === 'M') {
        if (lastPend !== null && m.pending > lastPend) toast('🔔 New request received');
        lastPend = m.pending;
      } else {
        let shouldShowModal = false;
        const s = stMap(m);
        Object.keys(s).forEach(id => {
          if (lastSt && lastSt[id] === 'Pending' && s[id] !== 'Pending') {
            toast(s[id] === 'Approved' ? '✅ Your request was approved' : '❌ Your request was rejected');
            shouldShowModal = true;
          }
        });
        lastSt = s;
        if (newIds(ME.adv, m.adv)) { toast('💰 Manager requested an advance payment'); shouldShowModal = true; }
        if (newIds(ME.mo, m.mo)) { toast('🔕 New mess closure announced'); shouldShowModal = true; }
        if (newIds(ME.nt, m.nt)) { toast('📢 New notice from Manager'); shouldShowModal = true; }
        ME = m;
        VC['me' + JSON.stringify([U, P, TOK])] = m;
        renderAlerts();
        if (shouldShowModal) showModal();
        if (CUR === 'pay' && !typing()) vPay();
        return;
      }
      ME = m; VC['me' + JSON.stringify([U, P, TOK])] = m; setBell(); renderAlerts();
    } catch (e) {}
  }, 20000);
}

const moTxt = m => {
  const d1 = fmt(m[1]), d2 = fmt(m[3]);
  const per = m[1] === m[3] ? (m[2] === m[4] ? d1 + ' (' + SH[m[2]] + ')' : d1 + ' (All day)') : d1 + ' (' + SH[m[2]] + ') to ' + d2 + ' (' + SH[m[4]] + ')';
  return per + (m[5] ? ' · Reason: ' + m[5] : '');
};

function notices() {
  const n = [], t = ME.today || I.today;
  if (ROLE !== 'U') return n;
  if (ME.blocked) {
    n.push({k: 'blk', lvl: 'red', act: "go('pay')", html: `<b>Account Frozen:</b> You have ${tk(ME.due)} unpaid dues, so meals are paused. Pay now or request a grace period.<span class="bn-sub">বাকি টাকার কারণে আপনার অ্যাকাউন্ট স্থগিত আছে। অনুগ্রহ করে টাকা পরিশোধ করুন অথবা সময় চান।</span>`});
  } else if (ME.due > 0 && ME.graceUntil) {
    n.push({k: 'gr', lvl: dayGap(t, ME.graceUntil) <= 0 ? 'red' : 'warn', act: "go('pay')", html: `<b>Payment Warning:</b> Please pay ${tk(ME.due)} by ${fmt(ME.graceUntil)} to avoid account freeze.<span class="bn-sub">সতর্কতা: ${fmt(ME.graceUntil)}-এর মধ্যে ${tk(ME.due)} পরিশোধ করুন।</span>`});
  }
  (ME.mo || []).forEach(m => n.push({k: 'mo' + m[0], lvl: m[1] <= t ? 'red' : 'warn', once: 1, dis: 1, html: `<b>Mess Closure Notice:</b> ${esc(moTxt(m))}<span class="bn-sub">এই সময়ে মেস বন্ধ থাকবে এবং মিল হিসাব হবে না।</span>`}));
  (ME.nt || []).forEach(x => n.push({k: 'nt' + x[0], lvl: 'info', once: 1, dis: 1, modal: true, html: `<b>📢 Notice from Manager:</b> ${esc(x[1])}`}));
  (ME.adv || []).forEach(a => {
    const g = dayGap(t, a[2]);
    n.push({k: 'adv' + a[0], lvl: g <= 1 ? 'red' : 'warn', act: `payAdv('${a[0]}')`, html: `<b>💰 Advance Payment Request:</b> ${tk(a[1])} due by ${fmt(a[2])}${a[3] ? ' (' + esc(a[3]) + ')' : ''}<span class="bn-sub">ম্যানেজার ${fmt(a[2])}-এর মধ্যে ${tk(a[1])} অগ্রিম চেয়েছেন।</span>`});
  });
  (ME.duties || []).filter(d => d[1] === U).forEach(d => {
    const a = dayGap(t, d[2]), range = fmt(d[2]) + ' to ' + fmt(d[3]);
    let lvl = 'info', txt = `Your upcoming bazar duty: ${range}.`;
    if (a < 0) { lvl = 'red'; txt = `Your bazar duty is running now (${range}).`; }
    else if (a === 0) { lvl = 'red'; txt = `Your bazar duty starts today (${range}).`; }
    else if (a === 1) { lvl = 'red'; txt = `Your bazar duty starts tomorrow (${range}).`; }
    else if (a === 2) { lvl = 'warn'; txt = `Your bazar duty starts in 2 days (${range}).`; }
    n.push({k: 'duty' + d[0], lvl: lvl, html: `<b>🛒 ${txt}</b><span class="bn-sub">আপনার বাজারের পালা: ${range}</span>`, dis: 1});
  });
  const o = {red: 0, warn: 1, ok: 2, info: 3};
  return n.sort((a, b) => o[a.lvl] - o[b.lvl]);
}

function renderAlerts() {
  $('#al').innerHTML = notices().filter(x => !DIS[x.k]).map(x => `<div class="alert ${x.lvl}"><div>${x.html}${x.act ? ` <a onclick="${x.act}">Pay Now</a>` : ''}</div>${x.dis ? `<button class="x" title="Dismiss" onclick="dis('${x.k}')">×</button>` : ''}</div>`).join('');
}
const dis = k => { DIS[k] = 1; renderAlerts(); };

function showModal() {
  const seen = getSeen(); MIDS = [];
  const items = notices().filter(x => (x.modal !== undefined ? x.modal : x.lvl !== 'info') && (!x.once || seen.indexOf(x.k) < 0)).map(x => { if (x.once) MIDS.push(x.k); return {lvl: x.lvl, html: x.html}; });
  let goReq = false;
  if (ROLE === 'U') {
    (ME.mine || []).filter(r => r[8] !== 'Pending' && seen.indexOf(r[0]) < 0).forEach(r => {
      MIDS.push(r[0]); const ok = r[8] === 'Approved';
      items.push({lvl: ok ? 'ok' : 'red', html: `<b>${esc(reqText(r))}</b> was <b>${r[8]}</b>.${r[9] ? '<br>' + esc(r[9]) : ''}`});

}

// ---------- Advance Requests (Button says "Send Request", not "Confirm") ----------
let PRE = null;
const addD = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
function payAdv(id) {
  const a = (ME.adv || []).find(x => x[0] === id); if (!a) return toast('This request is no longer open', 1);
  PRE = {amount: a[1], ref: id, note: 'Advance'}; go('pay');
}
async function vAdv() {
  let l; try { l = await M('adv'); } catch (e) { return err(e); }
  const t = ME.today || I.today, open = l.filter(r => r[6] === 'Open'), paid = l.filter(r => r[6] === 'Paid').slice(0, 10);
  wrap(`<div class="card"><h2>Request Advance Payment</h2><p class="sub">Ask members to pay in advance for bazar or bills.</p>
  <label>Select Members</label>
  <label class="chk"><input type="checkbox" checked onchange="document.querySelectorAll('.am').forEach(c => c.checked = this.checked)"> <b>Select All</b></label>
  ${I.names.map(n => `<label class="chk"><input type="checkbox" class="am" value="${esc(n)}" checked> ${esc(n)}</label>`).join('') || '<div class="empty">No active members</div>'}
  <label>Amount per Member (৳)</label><input id="aa" type="number" inputmode="decimal" min="0" placeholder="e.g. 2000">
  <label>Due Date</label><input id="ad" type="date" value="${addD(t, 7)}">
  <label>Note (Optional)</label><input id="an" placeholder="e.g. Monthly bazar advance">
  <button class="btn" onclick="advReview()">Review Request</button></div>
  <div class="card"><h3>Pending Advance (${open.length})</h3>${open.length ? `<p class="sub">Total Requested: ${tk(open.reduce((a, r) => a + Number(r[3]), 0))}</p>` + open.map(r => { const od = r[4] < t; return `<div class="row" style="cursor:default;flex-wrap:wrap"><div><b>${esc(r[2])}</b><small>${tk(r[3])} · Due ${fmt(r[4])}${r[5] ? ' · ' + esc(r[5]) : ''}</small></div><div class="flex" style="flex:0 0 auto"><span class="badge ${od ? 'neg' : 'warn'}">${od ? 'Overdue' : 'Pending'}</span><button class="btn sm sec" onclick="advAct('advDone','${r[0]}')">Mark Paid</button><button class="btn sm red" onclick="advAct('advDel','${r[0]}')">Cancel</button></div></div>`; }).join('') : '<div class="empty">No pending advance requests</div>'}</div>
  ${paid.length ? `<div class="card"><h3>Recently Paid</h3>${paid.map(r => `<div class="row" style="cursor:default"><div><b>${esc(r[2])}</b><small>${fmt(r[4])}${r[5] ? ' · ' + esc(r[5]) : ''}</small></div><span class="badge pos">Paid</span></div>`).join('')}</div>` : ''}`);
}
function advReview() {
  const names = Array.from(document.querySelectorAll('.am')).filter(c => c.checked).map(c => c.value);
  const d = {members: names, amount: $('#aa').value, due: $('#ad').value, note: $('#an').value.trim()};
  if (!names.length) return toast('Please select at least one member', 1);
  if (!(Number(d.amount) > 0) || !d.due) return toast('Please enter amount and due date', 1);
  wrap(`<div class="card"><h3>Review Advance Request</h3><table><tr><td>Members (${names.length})</td><td><b>${names.map(esc).join(', ')}</b></td></tr><tr><td>Amount Each</td><td><b>${tk(d.amount)}</b></td></tr><tr><td>Total Amount</td><td><b>${tk(Number(d.amount) * names.length)}</b></td></tr><tr><td>Due Date</td><td><b>${fmt(d.due)}</b></td></tr>${d.note ? `<tr><td>Note</td><td><b>${esc(d.note)}</b></td></tr>` : ''}</table>
  <button class="btn" id="advc">Send Request</button><button class="btn sec" onclick="vAdv()">Edit</button></div>`);
  $('#advc').onclick = () => M('advAdd', d).then(n => { toast('Advance request sent to ' + n + ' member(s)'); vAdv(); }).catch(err);
}
const advAct = (a, id) => (a === 'advDone' || confirm('Cancel this advance request?')) && M(a, {id}).then(() => { toast(a === 'advDone' ? 'Marked as paid' : 'Request cancelled'); vAdv(); }).catch(err);

// ---------- Notices & Mess Closure ----------
async function vAnn() {
  let nt, mo; try { [nt, mo] = await Promise.all([M('nt'), M('mo')]); } catch (e) { return err(e); }
  const t = ME.today || I.today, act = nt.filter(r => r[3] >= t), up = mo.filter(r => r[4] >= t).sort((a, b) => a[2] < b[2] ? -1 : 1);
  const shSel = (id, v) => `<select id="${id}"><option value="L" ${v === 'L' ? 'selected' : ''}>${SH.L}</option><option value="D" ${v === 'D' ? 'selected' : ''}>${SH.D}</option></select>`;
  wrap(`<div class="card"><h2>Broadcast Notice</h2><p class="sub">Members see this notice immediately in the app.</p>
  <label>Message</label><textarea id="nt_t" maxlength="300" placeholder="e.g. Cook will be absent tomorrow morning."></textarea>
  <label>Duration</label><select id="nt_d"><option value="1">1 Day (Today)</option><option value="3" selected>3 Days</option><option value="7">7 Days</option><option value="14">14 Days</option></select>
  <button class="btn" onclick="ntSend()">Publish Notice</button>
  ${act.length ? `<h3 style="margin-top:18px">Active Notices</h3>${act.map(r => `<div class="row" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:60%">${esc(r[2])}<small>Until ${fmt(r[3])}</small></div><button class="btn sm red" onclick="ntDel('${r[0]}')">Delete</button></div>`).join('')}` : ''}</div>

  <div class="card"><h2>Announce Mess Closure</h2><p class="sub">Meals during closure are automatically excluded from billing.</p>
  <label>From</label><div class="flex"><input type="date" id="mo_f" value="${t}">${shSel('mo_fs', 'L')}</div>
  <label>To</label><div class="flex"><input type="date" id="mo_t" value="${t}">${shSel('mo_ts', 'L')}</div>
  <label>Reason (Optional)</label><input id="mo_n" maxlength="100" placeholder="e.g. Eid Holidays">
  <button class="btn red" onclick="moAdd()">Announce Closure</button>
  ${up.length ? `<h3 style="margin-top:18px">Scheduled Closures</h3>${up.map(r => `<div class="row" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:60%">${moTxt([r[0], r[2], r[3], r[4], r[5], r[6]])}</div><button class="btn sm sec" onclick="moDel('${r[0]}')">Cancel</button></div>`).join('')}` : ''}</div>`);
}
const ntSend = () => { const d = {text: $('#nt_t').value.trim(), days: $('#nt_d').value}; if (!d.text) return toast('Please write a message', 1); M('ntAdd', d).then(() => { toast('Notice published'); vAnn(); }).catch(err); };
const ntDel = id => confirm('Delete this notice?') && M('ntDel', {id}).then(() => { toast('Notice deleted'); vAnn(); }).catch(err);
const moAdd = () => {
  const d = {from: $('#mo_f').value, fromShift: $('#mo_fs').value, to: $('#mo_t').value, toShift: $('#mo_ts').value, note: $('#mo_n').value.trim()};
  if (!d.from || !d.to) return toast('Please select dates', 1);
  if (d.to < d.from || (d.to === d.from && d.fromShift === 'D' && d.toShift === 'L')) return toast('End must be after start', 1);
  M('moAdd', d).then(() => { toast('Mess closure announced'); vAnn(); }).catch(err);
};
const moDel = id => confirm('Cancel this closure?') && M('moDel', {id}).then(() => { toast('Cancelled'); vAnn(); }).catch(err);

// ---------- Fast View Cache ----------
let VC = {}, CUR = '';
const RO = {init: 1, boot: 1, login: 1, me: 1, report: 1, daily: 1, myOffs: 1};
const VIEWS = {off: () => form('off'), guest: () => form('guest'), baz: () => form('baz'), dep: () => form('dep'), req: vReq, adv: vAdv, ann: vAnn, pay: vPay, duty: vDuty, rep: vRep, day: vDay, mem: vMem, bill: vBill, mess: vMess, ent: vEnt, dir: vDir};
const typing = () => { const e = document.activeElement; return !!(e && /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && $('#v').contains(e)); };
const rc = (fn, ...a) => {
  const k = fn + JSON.stringify(a), hit = VC[k], tab = CUR, get = () => call(fn, a).then(d => (VC[k] = d));
  if (hit === undefined) { load(1, 'Loading...'); return get().finally(() => load(-1)); }
  get().then(d => { if (JSON.stringify(d) !== JSON.stringify(hit) && CUR === tab && !typing() && VIEWS[tab]) VIEWS[tab](); }).catch(() => {});
  return Promise.resolve(hit);
};

start();
</script>
</body></html>
