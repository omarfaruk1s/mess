<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f3f5f4;color:#1b2b24}
header{background:#14705a;color:#fff;padding:12px 14px;font-weight:600}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#fff;position:sticky;top:0}
#tabs button{white-space:nowrap;border:1px solid #14705a;background:#fff;color:#14705a;border-radius:16px;padding:6px 12px}
#tabs button.on{background:#14705a;color:#fff}
.c{background:#fff;border-radius:10px;margin:10px;padding:12px;box-shadow:0 1px 3px #0002}
label{display:block;margin:8px 0 3px;font-size:13px;color:#456}
input,select{width:100%;box-sizing:border-box;padding:9px;font-size:16px;border:1px solid #bbb;border-radius:6px}
button.p{background:#14705a;color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:16px;margin:10px 6px 0 0}
button.g{background:#eee;border:0;border-radius:6px;padding:10px 16px;font-size:16px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px solid #eee;text-align:left}
.pos{color:#0a7a3b;font-weight:700}.neg{color:#c0392b;font-weight:700}.sm{font-size:12px;color:#678}
@media print{#tabs,header,button{display:none}}
</style></head><body>
<header id="h">Mess Hishab</header>
<div id="tabs"></div><div id="v"></div>
<script>
const $ = s => document.querySelector(s);
const API = 'https://script.google.com/macros/s/AKfycbw_7rSc5kXsMjST6UexZniTrtwUeBWr_XBin1j_DrAP4Z6m33zbu_4kTcOoMVgTynVcjQ/exec';
const run = (fn, ...a) => fetch(API + '?fn=' + fn + '&a=' + encodeURIComponent(JSON.stringify(a))).then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.data; });
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f = x => (Math.round(x * 100) / 100).toLocaleString('en-US');
const SH = {L: 'Lunch', D: 'Dinner'};
let U, P, ROLE, I, TAB;

const FORMS = {
  off: ['Meal Off', [['offDate','Meal off shuru (tarikh)','date'],['offShift','Kon bela theke off','shift'],['onDate','Abar meal on (tarikh) - na jani thakle khali rakhun','date?'],['onShift','Kon bela theke on','shift']]],
  guest: ['Guest Meal', [['date','Tarikh','date'],['shift','Bela','shift'],['count','Koyjon guest','number']]],
  baz: ['Bazar Entry', [['date','Tarikh','date'],['amount','Koto taka','number'],['items','Ki ki kena (optional)','text']]],
  dep: ['Deposit Entry (Manager)', [['date','Tarikh','date'],['amount','Koto taka joma','number'],['note','Note (optional)','text']]]
};

function start() {
  run('init').then(d => {
    I = d; $('#h').textContent = d.mess;
    $('#v').innerHTML = `<div class="c"><label>Apnar naam</label><select id="u"><option value="__manager">-- Manager --</option>${d.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
    <label>4-digit PIN</label><input id="p" type="password" inputmode="numeric" maxlength="4"><button class="p" onclick="login()">Login</button></div>`;
  }).catch(e => alert(e.message));
}
function login() {
  U = $('#u').value; P = $('#p').value;
  run('login', U, P).then(r => { ROLE = r; buildTabs(); go(ROLE === 'M' ? 'dep' : 'off'); }).catch(e => alert(e.message));
}
function buildTabs() {
  const t = [['off','Meal Off'],['guest','Guest'],['baz','Bazar'],['rep','Report'],['day','Aj-er Meal']];
  if (ROLE === 'M') t.unshift(['dep','Deposit']), t.push(['mem','Members'],['bill','Bills'],['mess','Mess'],['ent','Entries']);
  $('#tabs').innerHTML = t.map(x => `<button id="t_${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(t) {
  TAB = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.id === 't_' + t));
  ({off: () => form('off'), guest: () => form('guest'), baz: () => form('baz'), dep: () => form('dep'), rep: vRep, day: vDay, mem: vMem, bill: vBill, mess: vMess, ent: vEnt})[t]();
}
const wrap = h => $('#v').innerHTML = h;

// ---------- entry forms: fill -> submit -> review -> confirm ----------
function inp(k, l, t) {
  if (t === 'shift') return `<label>${l}</label><select id="f_${k}"><option value="L">Lunch</option><option value="D">Dinner</option></select>`;
  const ty = t.startsWith('date') ? 'date' : t === 'number' ? 'number' : 'text';
  return `<label>${l}</label><input id="f_${k}" type="${ty}" ${ty === 'date' && t === 'date' ? `value="${I.today}"` : ''} ${ty === 'number' ? 'inputmode="decimal"' : ''}>`;
}
function memSel() { return ROLE === 'M' ? `<label>Member</label><select id="f_member">${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>` : ''; }
async function form(type) {
  const [title, fs] = FORMS[type];
  let extra = '';
  if (type === 'off' && ROLE === 'U') extra = await offList();
  wrap(`<div class="c"><b>${title}</b>${memSel()}${fs.map(x => inp(...x)).join('')}<button class="p" onclick="review('${type}')">Submit</button></div>${extra}`);
}
function review(type) {
  const fs = FORMS[type][1], d = {};
  if (ROLE === 'M') d.member = $('#f_member').value;
  fs.forEach(x => d[x[0]] = $('#f_' + x[0]).value);
  window.PEND = d;
  const rows = (ROLE === 'M' ? [['Member', d.member]] : [['Member', U]]).concat(fs.map(x => [x[1].split(' - ')[0], x[2] === 'shift' ? SH[d[x[0]]] : d[x[0]] || '-']));
  wrap(`<div class="c"><b>Apnar deya tottho - thik ache?</b><table>${rows.map(r => `<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}</table>
  <button class="p" onclick="confirmSave('${type}')">Confirm</button><button class="g" onclick="go('${type}')">Back</button></div>`);
}
function confirmSave(type) {
  run('save', U, P, type, window.PEND).then(() => { alert('Save hoyeche'); go(type); }).catch(e => alert(e.message));
}
async function offList() {
  const l = await run('myOffs', U, P);
  const open = l.filter(r => !r[5]);
  return `<div class="c"><b>Amar Meal Off</b><table>${l.slice(0, 15).map(r => `<tr><td>${r[3]} ${SH[r[4]]}</td><td>${r[5] ? r[5] + ' ' + SH[r[6]] : 'on hoyni'}</td></tr>`).join('') || '<tr><td>Nai</td></tr>'}</table></div>
  ${open.map(r => `<div class="c"><b>${r[3]} ${SH[r[4]]} theke off - abar on korun</b><input type="date" id="r_${r[0]}" value="${I.today}"><select id="s_${r[0]}"><option value="L">Lunch</option><option value="D">Dinner</option></select><button class="p" onclick="ret('${r[0]}')">Meal on korun</button></div>`).join('')}`;
}
function ret(id) {
  if (!confirm('Confirm: ' + $('#r_' + id).value + ' ' + SH[$('#s_' + id).value] + ' theke meal on?')) return;
  run('setReturn', U, P, id, $('#r_' + id).value, $('#s_' + id).value).then(() => go('off')).catch(e => alert(e.message));
}

// ---------- reports ----------
async function vDay() {
  wrap(`<div class="c"><label>Tarikh</label><input type="date" id="dd" value="${I.today}" onchange="loadDay()"><div id="dr"></div></div>`); loadDay();
}
async function loadDay() {
  const d = await run('daily', $('#dd').value);
  $('#dr').innerHTML = !d.ok ? '<p>Mess shuru hoyni</p>' : ['L', 'D'].map(s => `<h4>${SH[s]}: ${d[s].length + d['g' + s.toLowerCase()]} meal</h4><div>${d[s].map(esc).join(', ') || '-'}${d['g' + s.toLowerCase()] ? ' (+ ' + d['g' + s.toLowerCase()] + ' guest)' : ''}</div>`).join('');
}
async function vRep() {
  const d = await run('report', U, P); window.D = d;
  if (!d.ok) return wrap('<div class="c">Mess shuru hoyni</div>');
  wrap(`<div class="c"><b>Month Summary</b><table>
  <tr><td>Shuru</td><td>${d.cfg.Start}</td></tr><tr><td>Sesh</td><td>${d.cfg.End || 'cholche'}</td></tr><tr><td>Mot din</td><td>${d.days}</td></tr>
  <tr><td>Mot bazar</td><td>${f(d.tb)}</td></tr><tr><td>Mot meal</td><td>${d.tm}</td></tr><tr><td>Meal rate</td><td><b>${f(d.rate)}</b></td></tr>
  <tr><td>Mot fixed bill</td><td>${f(d.fixed)}</td></tr><tr><td>Mot deposit</td><td>${f(d.td)}</td></tr></table></div>
  ${Object.keys(d.m).map(card).join('')}<div class="c"><button class="g" onclick="window.print()">Print / PDF</button></div>`);
}
function card(n) {
  const d = window.D, x = d.m[n], b = x.bal >= 0;
  return `<div class="c"><b>${esc(n)}</b><table>
  <tr><td>Meal khaise</td><td>${x.meals}${x.guest ? ' + ' + x.guest + ' guest' : ''}</td></tr>
  <tr><td>Meal rate</td><td>${f(d.rate)}</td></tr><tr><td>Meal-er taka</td><td>${f(x.mealCost)}</td></tr>
  ${d.bills.map(bl => `<tr><td>${esc(bl[0])} vag</td><td>${f(d.cnt ? bl[1] / d.cnt : 0)}</td></tr>`).join('')}
  <tr><td><b>Mot khoroch</b></td><td><b>${f(x.cost)}</b></td></tr>
  <tr><td>Deposit</td><td>${f(x.dep)}</td></tr>
  <tr><td>Bazar korse (${x.bl.length} din)</td><td>${f(x.bazar)}</td></tr>
  <tr><td><b>Mot joma</b></td><td><b>${f(x.paid)}</b></td></tr>
  <tr><td><b>${b ? 'Pabe' : 'Dibe'}</b></td><td class="${b ? 'pos' : 'neg'}">${f(Math.abs(x.bal))}</td></tr></table>
  <div class="sm">Bazar: ${x.bl.map(r => r[0] + ' = ' + f(r[1])).join('; ') || '-'}</div>
  <button class="g" onclick="share('${esc(n)}')">WhatsApp text copy</button></div>`;
}
function share(n) {
  const d = window.D, x = d.m[n];
  const t = `${n} - hishab (${d.cfg.Start} theke ${d.cfg.End || 'ekhon porjonto'})\nMeal: ${x.meals + x.guest} x rate ${f(d.rate)} = ${f(x.mealCost)}\nFixed bill vag: ${f(x.share)}\nMot khoroch: ${f(x.cost)}\nDeposit: ${f(x.dep)}\nBazar: ${f(x.bazar)} (${x.bl.map(r => r[0] + ' ' + f(r[1])).join(', ') || '-'})\nMot joma: ${f(x.paid)}\n${x.bal >= 0 ? 'Pabe' : 'Dibe'}: ${f(Math.abs(x.bal))}`;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('Copy hoyeche')).catch(() => prompt('Copy korun', t));
}

// ---------- manager ----------
const M = (act, d) => run('mgr', U, P, act, d);
async function vMem() {
  const l = await M('lists');
  wrap(`<div class="c"><b>Members</b>${l.members.map((r, i) => `<label>${esc(r[0])}</label><div style="display:flex;gap:6px"><input id="mp${i}" value="${esc(r[1])}" maxlength="4" inputmode="numeric"><select id="ma${i}"><option ${r[2] === 'Yes' ? 'selected' : ''}>Yes</option><option ${r[2] === 'No' ? 'selected' : ''}>No</option></select><button class="p" style="margin:0" onclick="svMem('${esc(r[0])}',${i})">Save</button></div>`).join('')}
  <hr><b>Notun member</b><label>Naam</label><input id="nn"><label>4-digit PIN</label><input id="np" maxlength="4" inputmode="numeric"><button class="p" onclick="addMem()">Add</button>
  <p class="sm">Yes = Active, No = Inactive. Naam pore bodlano jabe na.</p></div>`);
}
const svMem = (n, i) => M('member', {name: n, pin: $('#mp' + i).value, active: $('#ma' + i).value}).then(() => { alert('Saved'); vMem(); }).catch(e => alert(e.message));
const addMem = () => M('member', {name: $('#nn').value.trim(), pin: $('#np').value, active: 'Yes'}).then(() => { alert('Added'); init2(); }).catch(e => alert(e.message));
function init2() { run('init').then(d => { I = d; vMem(); }); }
async function vBill() {
  const l = (await M('lists')).bills; while (l.length < l.length + 0 || l.length < 6) { if (l.length >= 6) break; l.push(['', '']); }
  wrap(`<div class="c"><b>Fixed Bills (Active member-der moddhe soman vag)</b>${l.map((r, i) => `<label>Bill naam / taka</label><div style="display:flex;gap:6px"><input id="bn${i}" value="${esc(r[0])}"><input id="ba${i}" type="number" value="${esc(r[1])}"></div>`).join('')}<button class="p" onclick="svBill(${l.length})">Save</button></div>`);
}
const svBill = n => M('bills', {list: Array.from({length: n}, (_, i) => [$('#bn' + i).value.trim(), $('#ba' + i).value])}).then(() => alert('Saved')).catch(e => alert(e.message));
async function vMess() {
  const c = (await M('lists')).cfg;
  wrap(`<div class="c"><b>Mess</b><p>Shuru: <b>${c.Start || '-'}</b> | Sesh: <b>${c.End || 'cholche'}</b></p>
  <label>Mess shuru-r tarikh</label><input type="date" id="ms" value="${I.today}"><button class="p" onclick="mm('start','ms')">Mess shuru</button>
  <label>Mess sesh-er tarikh (beton paoar din)</label><input type="date" id="me" value="${I.today}"><button class="p" onclick="mm('close','me')">Mess close</button>
  <hr><button class="p" onclick="nm()">Notun mash (archive + reset)</button><button class="g" onclick="M('sheets').then(()=>alert('Sheet update hoyeche'))">Report sheet update</button>
  <label>Manager PIN bodlan</label><input id="mpin" maxlength="4" inputmode="numeric"><button class="p" onclick="cp()">PIN save</button></div>`);
}
const mm = (a, id) => M(a, {date: $('#' + id).value}).then(() => { alert('Done'); vMess(); }).catch(e => alert(e.message));
const cp = () => M('pin', {pin: $('#mpin').value}).then(() => { P = $('#mpin').value; alert('PIN bodlano hoyeche'); }).catch(e => alert(e.message));
const nm = () => confirm('Ei mash-er data archive file-e rakhe notun mash shuru hobe. Nishchit?') && M('newMonth').then(u => { alert('Archive: ' + u); vMess(); }).catch(e => alert(e.message));
async function vEnt() {
  const e = (await M('lists')).ent;
  wrap(Object.keys(e).map(k => `<div class="c"><b>${k}</b><div style="overflow-x:auto"><table>${e[k].map(r => `<tr><td>${r.slice(1).map(esc).join(' | ')}</td><td><button class="g" style="margin:0" onclick="del('${k}','${r[0]}')">Delete</button></td></tr>`).join('') || '<tr><td>Nai</td></tr>'}</table></div></div>`).join(''));
}
const del = (s, id) => confirm('Delete korben?') && M('del', {sheet: s, id: id}).then(vEnt).catch(e => alert(e.message));
start();
</script></body></html>
