<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Manager</title>
<style>
:root{--g:#0f766e;--g2:#115e59;--bg:#f1f5f9;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--r:#dc2626;--ok:#16a34a;--info:#0284c7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--t);-webkit-tap-highlight-color:transparent;line-height:1.5}
.bar{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bar b{font-size:18px;letter-spacing:-.2px}.bar small{opacity:.88;display:block;font-size:12px}
.bar button{background:#ffffff24;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600}
.bar .ic{position:relative;font-size:16px;padding:6px 10px}
#bc{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:10px;font:700 11px/1 system-ui;padding:3px 6px;font-style:normal}

#load{display:none;position:fixed;inset:0;background:#0f172a45;backdrop-filter:blur(3px);z-index:30;align-items:center;justify-content:center}
#load .box{background:#fff;border-radius:18px;padding:20px 26px;text-align:center;box-shadow:0 10px 35px #0003;width:255px}
#load .emo{font-size:40px;display:inline-block;animation:hop .55s ease-in-out infinite alternate}
#load b{display:block;font-size:16px;margin-top:8px}
#load .fun{display:block;color:var(--g);margin-top:4px;font-size:13px;font-weight:600}
#load small{display:block;color:var(--m);margin-top:8px;font-size:12px}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}

#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:10;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{white-space:nowrap;border:1px solid var(--b);background:#f8fafc;color:#334155;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
#tabs button.on{background:var(--g);border-color:var(--g);color:#fff}

.wrap{max-width:620px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0f172a12;border:1px solid #e2e8f099}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
h2{margin:0 0 3px;font-size:18px;font-weight:700}
h3{margin:0 0 10px;font-size:15.5px;font-weight:700}
.sub{color:var(--m);font-size:13px;margin:0 0 10px}
.bn-note{display:block;color:#475569;font-size:12.5px;margin-top:3px;font-weight:400}

.rules-btn{white-space:nowrap;border:1.5px solid #99f6e4;background:#f0fdfa;color:var(--g2);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
.rules-btn:hover{background:#ccfbf1}

.optbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.optbar::-webkit-scrollbar{display:none}
.optbtn{flex:1;min-width:fit-content;white-space:nowrap;border:1.5px solid #cbd5e1;background:#fff;color:#1e293b;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.optbtn.on{background:#f0fdfa;border-color:var(--g);color:var(--g2)}

label{display:block;margin:12px 0 5px;font-size:13px;font-weight:600;color:#334155}
.hint{font-weight:400;color:var(--m);font-size:12px;margin-top:2px}
input,select,textarea{width:100%;padding:10px 12px;font-size:15px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--g)}

.btn{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;margin-top:14px;cursor:pointer}
.btn.sec{background:#e2e8f0;color:#1e293b}
.btn.red{background:var(--r)}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;margin:0}
.link{background:none;border:0;color:var(--g);font-size:14px;margin-top:12px;width:100%;padding:6px;cursor:pointer;font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:11px 12px}
.tile span{font-size:12px;color:var(--m);display:block}
.tile b{display:block;font-size:18.5px;margin-top:2px;color:var(--t)}

.banner{border-radius:12px;padding:14px 16px;margin:12px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner.pos{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.banner.neg{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.banner b{font-size:21px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 6px;border-bottom:1px solid var(--b);text-align:left;vertical-align:middle}
th{color:var(--m);font-weight:600;font-size:12px;background:#f8fafc}
td:last-child,th:last-child{text-align:right}

.row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--b);gap:10px}
.row:last-child{border:0}
.row small{color:var(--m);display:block;font-size:12.5px}

.badge{border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-block}
.badge.pos{background:#dcfce7;color:#166534}
.badge.neg{background:#fee2e2;color:#991b1b}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.gray{background:#f1f5f9;color:#475569}
.badge.info{background:#e0f2fe;color:#075985}

.flex{display:flex;gap:8px;align-items:center}
.flex>*{flex:1}
.empty{text-align:center;color:var(--m);padding:24px 10px;font-size:14px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--r)}

.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13.5px;font-weight:500;line-height:1.45}
.alert.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.alert.info{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}
.alert.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert a{text-decoration:underline;font-weight:700;cursor:pointer}
.alert .x{background:none;border:0;font-size:20px;line-height:1;color:inherit;padding:0 2px;opacity:.75;cursor:pointer;flex:0 0 auto}
.bn-sub{display:block;font-size:12.5px;color:inherit;opacity:.9;margin-top:4px;font-weight:400}

#modal{display:none;position:fixed;inset:0;background:#0f172a8c;z-index:40;align-items:center;justify-content:center;padding:16px}
#mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px #0004}

label.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:8px 0;font-size:14px}
.chk input{width:auto;transform:scale(1.2)}

.call-btn{display:inline-flex;align-items:center;gap:4px;background:var(--g);color:#fff;text-decoration:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}

.rep-sec{margin-top:14px;border:1px solid var(--b);border-radius:10px;overflow:hidden}
.rep-sec h4{margin:0;padding:8px 12px;background:#f8fafc;font-size:13px;color:#334155;border-bottom:1px solid var(--b)}
.rep-sec table td,.rep-sec table th{padding:8px 12px}

.meal-box{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:12px;margin-top:10px}
.meal-box h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid #cbd5e1;background:#f8fafc;color:#1e293b;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip:hover,.chip.on{background:#f0fdfa;border-color:var(--g);color:var(--g2)}

.mem-roster{border:1px solid var(--b);border-radius:12px;overflow:hidden;margin-top:8px}
.mem-roster-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--b);background:#fff;cursor:pointer}
.mem-roster-row:last-child{border-bottom:0}
.mem-roster-row:hover{background:#f8fafc}
.mem-roster-row.sel{background:#f0fdfa;border-left:4px solid var(--g)}
.mem-roster-row small{display:block;color:var(--m);font-size:12px}

.adv-box{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:12px;margin-top:12px}

@media print{#tabs,.bar,button,#toast,#al,#modal,.no-print{display:none!important}.card{box-shadow:none;border:1px solid #cbd5e1}}

.act-chart-card{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0 14px}
.act-chart-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.act-chart-top b{font-size:13.5px;color:#0f172a}
.act-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:#475569}
.act-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.act-bar-row{margin-bottom:10px}
.act-bar-row:last-child{margin-bottom:0}
.act-bar-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:4px}
.act-bar-meta span{color:#64748b;font-size:12px;text-align:right}
.act-track{width:100%;height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.act-fill{height:100%;border-radius:999px;transition:width .25s ease}
.act-fill.running{background:#16a34a}
.act-fill.upcoming{background:#0284c7}
.act-fill.done{background:#94a3b8}

.duty-card{border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.duty-card:last-child{margin-bottom:0}
.duty-card.me{background:#f0fdfa;border-color:#99f6e4}
.duty-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.duty-card-dates{font-size:12.5px;color:#475569;margin-top:4px}
.duty-card-sub{font-size:12px;color:#64748b;margin-top:2px}

@media (max-width:480px){
  .wrap{padding:10px}
  .card{padding:13px;border-radius:12px}
  h2{font-size:16.5px}
  h3{font-size:14.5px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px}
  .tile b{font-size:16.5px}
  .banner{flex-direction:column;align-items:flex-start;padding:12px}
  .banner b{font-size:19px}
  .flex{flex-wrap:wrap}
  .call-btn{padding:6px 10px;font-size:12px}
  .act-bar-meta{flex-direction:column;gap:2px}
  .act-bar-meta span{text-align:left}
  .duty-card-top{flex-direction:column;align-items:flex-start}
  .mem-roster-row{flex-direction:column;align-items:flex-start}
}
</style></head><body>
<div id="load"><div class="box"><span class="emo" id="lemo">🍛</span><b id="lmsg">Loading...</b><span class="fun" id="lfun"></span><small id="lsub"></small></div></div>
<div class="bar">
  <div><b id="title">Mess Manager</b><small id="me"></small></div>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="bell" class="ic" title="Requests" style="display:none" onclick="go('req')">🔔<i id="bc" style="display:none"></i></button>
    <button id="out" style="display:none" onclick="logout()">Log out</button>
  </div>
</div>
<div id="tabs" style="display:none"></div>
<div class="wrap" id="al" style="padding-top:0;padding-bottom:0"></div>
<div class="wrap" id="v"><div class="empty">Loading...</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw_7rSc5kXsMjST6UexZniTrtwUeBWr_XBin1j_DrAP4Z6m33zbu_4kTcOoMVgTynVcjQ/exec';
const $ = s => document.querySelector(s);

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmt = d => { if (!d) return '-'; const p = String(d).split('-'); return p.length < 3 ? d : (+p[2]) + ' ' + MON[+p[1] - 1] + ' ' + p[0]; };
const f = x => (Math.round(x * 100) / 100).toLocaleString('en-US');
const tk = x => '৳' + f(x);
function enTime(t) {
  if (!t || !/^\d{2}:\d{2}$/.test(t)) return t || '-';
  const h = +t.slice(0, 2), m = t.slice(3), h12 = h % 12 || 12;
  return h12 + (m === '00' ? '' : ':' + m) + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function bnTime(t) {
  if (!t || !/^\d{2}:\d{2}$/.test(t)) return t || '-';
  const h = +t.slice(0, 2), m = t.slice(3), h12 = h % 12 || 12;
  const per = h < 4 ? 'রাত' : h < 6 ? 'ভোর' : h < 12 ? 'সকাল' : h < 16 ? 'দুপুর' : h < 18 ? 'বিকেল' : h < 20 ? 'সন্ধ্যা' : 'রাত';
  return per + ' ' + h12 + (m === '00' ? '' : ':' + m) + 'টা';
}
const SH = {L: 'Lunch', D: 'Dinner'};
const STL = {Pending: 'Pending', Approved: 'Approved', Rejected: 'Rejected'};
const hm = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const dayGap = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const addD = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);

// ---------- Loading & Network ----------
let busy = 0, slow, fun, shown = 0;
const FUN = [['🍚', 'Preparing meals...'], ['🛒', 'Checking bazar...'], ['🧮', 'Calculating bills...'], ['🧾', 'Syncing data...']];
const load = (d, msg) => {
  busy += d; const el = $('#load');
  if (busy > 0) {
    if (msg) $('#lmsg').textContent = msg;
    if (shown) return; shown = 1; $('#lsub').textContent = '';
    let k = Math.floor(Math.random() * FUN.length);
    const tick = () => { $('#lemo').textContent = FUN[k][0]; $('#lfun').textContent = FUN[k][1]; k = (k + 1) % FUN.length; };
    tick(); clearInterval(fun); fun = setInterval(tick, 1400); el.style.display = 'flex';
    clearTimeout(slow); slow = setTimeout(() => $('#lsub').textContent = 'Taking a moment, please wait...', 4000);
  } else { busy = 0; shown = 0; clearInterval(fun); clearTimeout(slow); el.style.display = 'none'; }
};
const MSG = {save: 'Saving...', signup: 'Sending request...', login: 'Logging in...', setReturn: 'Saving...', request: 'Sending request...', boot: 'Logging in...'};
const READ_ACTS = ['lists', 'reqs', 'adv', 'mo', 'nt'];
const call = (fn, a) => fetch(API + '?fn=' + fn + '&a=' + encodeURIComponent(JSON.stringify(a))).then(r => r.json())
  .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
  .catch(e => { throw new Error(/fetch|network/i.test(e.message) ? 'No internet connection. Please try again.' : e.message); });
const run = (fn, ...a) => {
  if (!RO[fn] && !(fn === 'mgr' && READ_ACTS.indexOf(a[2]) >= 0)) VC = {};
  load(1, MSG[fn] || (fn === 'mgr' && READ_ACTS.indexOf(a[2]) < 0 ? 'Saving...' : 'Loading...'));
  return call(fn, a).finally(() => load(-1));
};
const runQ = (fn, ...a) => call(fn, a);
const toast = (m, bad) => { const t = $('#toast'); t.textContent = m; t.className = (bad ? 'bad ' : '') + 'show'; clearTimeout(window._t); window._t = setTimeout(() => t.className = bad ? 'bad' : '', 3600); };
const err = e => toast(e.message, 1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const wrap = h => { $('#v').innerHTML = h; window.scrollTo(0, 0); };
const stamp = d => (d.t0 = Date.now(), d);

let U, P, TOK, ROLE, I, NAMES = [], D, LM, ME = {duties: [], nt: [], mo: [], adv: [], mine: []};
let VC = {}, CUR = '', PRE = null, MIDS = [], RQ = {reqs: [], signups: []};
let ENT_MODE = 'dep', DB_MODE = 'duty', SHOW_MY_DETAIL = false, MGR_DETAIL_IDX = null, SEL_MEM_IDX = 0, SELECTED_PAST_IDX = 0;

// ---------- Cycle Archive, Carry-Forward Balances & Reset Helpers ----------
const ARCH_KEY = 'mess_archived_cycles_v1';
const CF_KEY = 'mess_carry_balances_v1';
const EXTRA_CONT_KEY = 'mess_extra_contacts_v1';
const FINAL_SETTLE_KEY = 'mess_final_settlement_v1';

const getArchived = () => { try { return JSON.parse(localStorage.getItem(ARCH_KEY) || '[]'); } catch (e) { return []; } };
const saveArchived = list => { try { localStorage.setItem(ARCH_KEY, JSON.stringify(list.slice(0, 30))); } catch (e) {} };
const getCarryMap = () => { try { return JSON.parse(localStorage.getItem(CF_KEY) || '{}'); } catch (e) { return {}; } };
const saveCarryMap = map => { try { localStorage.setItem(CF_KEY, JSON.stringify(map || {})); } catch (e) {} };
const getExtraContacts = () => { try { return JSON.parse(localStorage.getItem(EXTRA_CONT_KEY) || '[]'); } catch (e) { return []; } };
const saveExtraContacts = list => { try { localStorage.setItem(EXTRA_CONT_KEY, JSON.stringify(list || [])); } catch (e) {} };
const getFinalSettle = () => { try { return JSON.parse(localStorage.getItem(FINAL_SETTLE_KEY) || 'null'); } catch (e) { return null; } };
const saveFinalSettle = obj => { try { localStorage.setItem(FINAL_SETTLE_KEY, JSON.stringify(obj || null)); } catch (e) {} };

function applyCarryForwardToReport(repData) {
  if (!repData || !repData.ok || !repData.m) return repData;
  const cf = getCarryMap();
  const keys = Object.keys(cf);
  if (!keys.length) return repData;
  const clone = JSON.parse(JSON.stringify(repData));
  Object.keys(clone.m).forEach(name => {
    if (cf[name] !== undefined && Number(cf[name]) !== 0) {
      const prevOpen = Number(clone.m[name].open || 0);
      const extra = Number(cf[name]);
      clone.m[name].open = prevOpen + extra;
      clone.m[name].bal = Number(clone.m[name].bal || 0) + extra;
      clone.m[name].due = clone.m[name].bal < 0 ? Math.abs(clone.m[name].bal) : 0;
    }
  });
  return clone;
}

function archiveCurrentCycleSnapshot(repData, closeDateLabel) {
  if (!repData || !repData.ok || !repData.m) return null;
  const membersSnap = {};
  const carryUpdates = getCarryMap();
  Object.keys(repData.m).forEach(n => {
    const x = repData.m[n];
    membersSnap[n] = {
      meals: Number(x.meals || 0),
      guest: Number(x.guest || 0),
      mealCost: Number(x.mealCost || 0),
      share: Number(x.share || 0),
      dep: Number(x.dep || 0),
      bazar: Number(x.bazar || 0),
      bazarDays: (x.bl || []).length,
      open: Number(x.open || 0),
      bal: Number(x.bal || 0)
    };
    carryUpdates[n] = Number(x.bal || 0);
  });
  saveCarryMap(carryUpdates);

  const snap = {
    id: 'CYC_' + Date.now(),
    closedAt: new Date().toISOString().slice(0, 10),
    periodStart: repData.cfg && repData.cfg.Start ? repData.cfg.Start : '',
    periodEnd: closeDateLabel || (repData.cfg && repData.cfg.End ? repData.cfg.End : I.today),
    days: repData.days || 0,
    tb: Number(repData.tb || 0),
    tm: Number(repData.tm || 0),
    rate: Number(repData.rate || 0),
    fixed: Number(repData.fixed || 0),
    td: Number(repData.td || 0),
    cnt: Number(repData.cnt || Object.keys(membersSnap).length),
    members: membersSnap
  };

  const arch = getArchived();
  arch.unshift(snap);
  saveArchived(arch);
  saveFinalSettle(snap);
  SELECTED_PAST_IDX = 0;

  // Erase Bazar Duty notices, general notices, closures & seen flags when Mess Ends
  if (ME) {
    ME.duties = [];
    ME.nt = [];
    ME.mo = [];
    ME.adv = [];
    ME.messEnded = true;
  }
  if (U) {
    try {
      localStorage.removeItem('mess_dis_nt_' + U);
      localStorage.removeItem('mess_seen_' + U);
      localStorage.removeItem('mess_paid_adv_' + U);
    } catch (e) {}
  }
  DIS = {};
  renderAlerts();
  return snap;
}

// ---------- Download Report as CSV for Manager & Members ----------
function downloadSettlementCSV(snap, onlyMember) {
  if (!snap || !snap.members) return toast('No report data available to download', 1);
  const rows = [
    ['Mess Final Settlement Report', `${snap.periodStart} to ${snap.periodEnd}`],
    ['Total Bazar', snap.tb, 'Total Meals', snap.tm, 'Meal Rate', Math.round(snap.rate * 100) / 100, 'Fixed Bills', snap.fixed],
    [],
    ['Member', 'Regular Meals', 'Guest Meals', 'Total Meals', 'Meal Cost', 'Fixed Share', 'Total Expense', 'Deposits', 'Bazar Spent', 'Previous/Carry', 'Final Balance (+ Receivable / - Payable)']
  ];
  const keys = onlyMember && snap.members[onlyMember] ? [onlyMember] : Object.keys(snap.members);
  keys.forEach(name => {
    const m = snap.members[name];
    const totMeals = Number(m.meals || 0) + Number(m.guest || 0);
    const totExp = Number(m.mealCost || 0) + Number(m.share || 0);
    rows.push([
      name,
      Number(m.meals || 0),
      Number(m.guest || 0),
      totMeals,
      Math.round(Number(m.mealCost || 0) * 100) / 100,
      Math.round(Number(m.share || 0) * 100) / 100,
      Math.round(totExp * 100) / 100,
      Math.round(Number(m.dep || 0) * 100) / 100,
      Math.round(Number(m.bazar || 0) * 100) / 100,
      Math.round(Number(m.open || 0) * 100) / 100,
      Math.round(Number(m.bal || 0) * 100) / 100
    ]);
  });
  const csv = '\uFEFF' + rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Mess_Report_${onlyMember || 'All_Members'}_${snap.periodEnd || I.today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Report downloaded!');
}

function downloadCurrentReportCSV() {
  if (!D || !D.ok || !D.m) return toast('No active report to download', 1);
  const snap = {
    periodStart: D.cfg && D.cfg.Start ? D.cfg.Start : '',
    periodEnd: (D.cfg && D.cfg.End) || I.today,
    tb: D.tb, tm: D.tm, rate: D.rate, fixed: D.fixed,
    members: {}
  };
  Object.keys(D.m).forEach(n => {
    const x = D.m[n];
    snap.members[n] = { meals: x.meals, guest: x.guest, mealCost: x.mealCost, share: x.share, dep: x.dep, bazar: x.bazar, open: x.open, bal: x.bal };
  });
  downloadSettlementCSV(snap, ROLE === 'M' ? null : U);
}

// ---------- Activity Board ----------
function dutyStatusInfo(d, today) {
  const start = d[2], end = d[3];
  const totalDays = dayGap(start, end) + 1;
  const daysDone = Number(d[4] || 0);
  if (daysDone > 0 && today >= start) {
    return {
      state: 'done',
      badgeClass: 'pos',
      badgeText: 'Bazar Done ✅',
      detail: `Bazar completed (${daysDone} entry)`
    };
  }
  if (today < start) {
    const left = dayGap(today, start);
    return {
      state: 'upcoming',
      badgeClass: left <= 2 ? 'warn' : 'info',
      badgeText: left === 0 ? 'Starts Today' : left === 1 ? 'Starts Tomorrow' : `In ${left} Days`,
      detail: `Starts in ${left} day(s) · Duration: ${totalDays} day(s)`
    };
  }
  if (today >= start && today <= end) {
    const rem = dayGap(today, end);
    const done = dayGap(start, today) + 1;
    return {
      state: 'running',
      badgeClass: 'pos',
      badgeText: rem === 0 ? 'Last Day Today' : `${rem} Day(s) Left`,
      detail: `Day ${done} of ${totalDays} · ${rem === 0 ? 'Ends today' : rem + ' day(s) bazar remaining'}`
    };
  }
  return {
    state: 'done',
    badgeClass: 'gray',
    badgeText: 'Completed',
    detail: `Completed (${totalDays} day(s))`
  };
}

function dutyProgressPct(d, today, state) {
  const total = Math.max(1, dayGap(d[2], d[3]) + 1);
  if (state === 'done') return 100;
  if (state === 'upcoming') return 12;
  const done = Math.min(total, Math.max(1, dayGap(d[2], today) + 1));
  return Math.round((done / total) * 100);
}

  };

  wrap(`

function share(i) {
  const n = NAMES[i], x = D.m[n], exp = x.mealCost + x.share;
  const t = [
    `*${n} - Mess Statement* (${fmt(D.cfg.Start)} to ${D.cfg.End ? fmt(D.cfg.End) : 'Today'})`,
    `Meals: ${x.meals + x.guest} × ${tk(D.rate)} = ${tk(x.mealCost)}`,
    `Fixed Bills Share: ${tk(x.share)}`,
    `Total Expense: ${tk(exp)}`,
    `Deposits: ${tk(x.dep)} | Bazar Spent: ${tk(x.bazar)} (${x.bl.length} days)`,
    x.open ? `Carry / Previous Balance: ${x.open > 0 ? '+' : '-'}${tk(Math.abs(x.open))}` : '',
    `*${x.bal >= 0 ? 'Net Receivable' : 'Net Payable'}: ${x.bal >= 0 ? '+' : '-'}${tk(Math.abs(x.bal))}*`
  ].filter(Boolean).join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Summary copied to clipboard')).catch(() => prompt('Copy this summary:', t));
}

// ---------- NEW: Manager Dues, Previous Advance & Freeze Notice Section ----------
async function vDuesBoard(bar = '') {
  let rep, l;
  try {
    [rep, l] = await Promise.all([rc('report', U, P, TOK), M('lists')]);
  } catch (e) { return err(e); }
  rep = applyCarryForwardToReport(rep);
  const t = ME.today || I.today;
  const graceRows = (l && l.grace) || [];

  if (!rep || !rep.ok || !rep.m) {
    return wrap(`${bar}<div class="card empty"><h2>Dues & Previous Advance</h2><p>Start a mess cycle first to inspect member dues and advances.</p></div>`);
  }

  const members = Object.keys(rep.m);
  const dueList = [];
  const advList = [];

  members.forEach(name => {
    const x = rep.m[name];
    const gEntry = graceRows.filter(g => g[0] === name).slice(-1)[0];
    const noticeDaysLeft = gEntry && gEntry[2] >= t ? dayGap(t, gEntry[2]) : null;
    if (x.bal < 0 || x.due > 0) {
      dueList.push({
        name,
        dueAmt: Math.abs(x.bal < 0 ? x.bal : x.due),
        prevOpen: x.open,
        blocked: x.blocked,
        graceUntil: gEntry ? gEntry[2] : '',
        noticeDaysLeft
      });
    } else {
      advList.push({
        name,
        advAmt: x.bal,
        prevOpen: x.open
      });
    }
  });

  const duesHtml = dueList.length
    ? dueList.map(item => {
        const freezeInfo = item.blocked
          ? `<span class="badge neg">Account Frozen (মিল বন্ধ)</span>`
          : item.noticeDaysLeft !== null
            ? `<span class="badge warn">Notice: ${item.noticeDaysLeft} day(s) left · Freezes after ${fmt(item.graceUntil)}</span>`
            : `<span class="badge gray">No notice days set (Immediate freeze risk)</span>`;

        return `<div class="row" style="cursor:default;flex-wrap:wrap;align-items:flex-start">
          <div style="flex:1;min-width:210px">
            <b>${esc(item.name)}</b> — <b style="color:#dc2626">Due: −${tk(item.dueAmt)}</b>
            <small>Previous Opening: ${item.prevOpen >= 0 ? '+' : '−'}${tk(Math.abs(item.prevOpen || 0))}</small>
            <div style="margin-top:5px">${freezeInfo}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex:0 0 auto;margin-top:4px">
            <select id="gr_days_${esc(item.name)}" style="width:auto;padding:6px 8px;font-size:12.5px">
              <option value="1">1 Day Notice</option>
              <option value="2">2 Days Notice</option>
              <option value="3" selected>3 Days Notice</option>
              <option value="5">5 Days Notice</option>
              <option value="7">7 Days Notice</option>
              <option value="0">Freeze Now (0d)</option>
            </select>
            <button class="btn sm" onclick="setMemberGraceDays('${esc(item.name)}')">Apply</button>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty">No member has unpaid dues right now 🎉</div>';

  const advHtml = advList.length
    ? advList.map(item => `<div class="row" style="cursor:default">
        <div>
          <b>${esc(item.name)}</b>
          <small>Previous Opening: ${item.prevOpen >= 0 ? '+' : '−'}${tk(Math.abs(item.prevOpen || 0))}</small>
        </div>
        <span class="badge pos">Advance: +${tk(item.advAmt)}</span>
      </div>`).join('')
    : '<div class="empty">No members with positive advance balance</div>';

  wrap(`${bar}
    <div class="card">
      <h2>⚠️ Dues & Freeze Notice Control / বকেয়া ও ফ্রিজ নোটিশ</h2>
      <p class="sub">Members with unpaid dues, notice countdown days, and auto-freeze status.<span class="bn-note">কার কাছে কত টাকা বকেয়া আছে, কয়দিনের নোটিশ দেওয়া হয়েছে এবং কতদিন পর অ্যাকাউন্ট ফ্রিজ হবে তা নির্ধারণ করুন।</span></p>
      ${duesHtml}
    </div>
    <div class="card">
      <h3>✅ Members with Advance Balance / যাদের অ্যাডভান্স জমা আছে</h3>
      <p class="sub">Positive balance (+) available for upcoming meals.<span class="bn-note">যাদের অ্যাকাউন্টে অ্যাডভান্স টাকা জমা আছে।</span></p>
      ${advHtml}
    </div>
  `);
}

function setMemberGraceDays(memberName) {
  const el = document.getElementById('gr_days_' + memberName);

// ---------- Live Notifications, Notices & Auto-Hide After Bazar / Mess End ----------
let DIS = {}, pollT, lastPend = null, lastSt = null;
const seenKey = () => 'mess_seen_' + U;
const disKey = () => 'mess_dis_nt_' + U;
const paidAdvKey = () => 'mess_paid_adv_' + U;
const getSeen = () => { try { return JSON.parse(localStorage.getItem(seenKey()) || '[]'); } catch (e) { return []; } };
const addSeen = ids => { try { localStorage.setItem(seenKey(), JSON.stringify(getSeen().concat(ids).slice(-100))); } catch (e) {} };
const getDisNt = () => { try { return JSON.parse(localStorage.getItem(disKey()) || '[]'); } catch (e) { return []; } };
const addDisNt = id => { try { const a = getDisNt(); if (a.indexOf(id) < 0) { a.push(id); localStorage.setItem(disKey(), JSON.stringify(a.slice(-150))); } } catch (e) {} };
const getPaidAdv = () => { try { return JSON.parse(localStorage.getItem(paidAdvKey()) || '[]'); } catch (e) { return []; } };
const addPaidAdv = id => {
  if (!id) return;
  try {
    const a = getPaidAdv();
    if (a.indexOf(id) < 0) { a.push(id); localStorage.setItem(paidAdvKey(), JSON.stringify(a.slice(-200))); }
  } catch (e) {}
};
const stMap = m => { const o = {}; (m.mine || []).forEach(r => o[r[0]] = r[8]); return o; };
const reqText = r => r[3] === 'pay' ? 'Your ' + tk(r[4]) + ' advance/payment request' : r[3] === 'grace' ? 'Your grace period request' : 'Your request ("' + r[7] + '")';

function syncSettledAdvances(m) {
  if (!m) return;
  const paidIds = new Set(getPaidAdv());
  (m.mine || []).forEach(r => {
    if (r[3] === 'pay' && r[8] === 'Approved' && r[6] && String(r[6]).startsWith('ADV')) {
      paidIds.add(String(r[6]));
    }
  });
  try { localStorage.setItem(paidAdvKey(), JSON.stringify(Array.from(paidIds).slice(-200))); } catch (e) {}
  if (Array.isArray(m.adv)) {
    m.adv = m.adv.filter(a => String(a[5] || '').toLowerCase() !== 'paid' && !paidIds.has(String(a[0])));
  }
}

function afterLogin() {
  syncSettledAdvances(ME);
  lastPend = ROLE === 'M' ? ME.pending : null;
  lastSt = ROLE === 'U' ? stMap(ME) : null;
  setBell(); renderAlerts(); showModal(); startPoll();
}
function setBell() {
  if (ROLE !== 'M') return;
  const n = ME.pending || 0;
  $('#bell').style.display = ''; $('#bc').textContent = n; $('#bc').style.display = n ? '' : 'none';
  const t = $('#t_req'); if (t) t.textContent = 'Requests' + (n ? ' (' + n + ')' : '');
  document.title = (n ? '(' + n + ') ' : '') + 'Mess Manager';
}
const newIds = (a, b) => { const old = (a || []).map(x => x[0]); return (b || []).some(x => old.indexOf(x[0]) < 0); };

function startPoll() {
  clearInterval(pollT);
  pollT = setInterval(async () => {
    if (document.hidden) return;
    try {
      const m = await runQ('me', U, P, TOK);
      syncSettledAdvances(m);
      if (ROLE === 'M') {
        if (lastPend !== null && m.pending > lastPend) toast('🔔 New request received');
        lastPend = m.pending;
      } else {
        let shouldShowModal = false;
        const s = stMap(m);
        Object.keys(s).forEach(id => {
          if (lastSt && lastSt[id] === 'Pending' && s[id] !== 'Pending') {
            toast(s[id] === 'Approved' ? '✅ Your request was approved' : '❌ Your request was rejected');
            shouldShowModal = true;
          }
        });
        lastSt = s;
        if (!m.messEnded) {
          if (newIds(ME.adv, m.adv)) { toast('💰 Manager requested an advance / bazar payment'); shouldShowModal = true; }
          if (newIds(ME.mo, m.mo)) { toast('🔕 New mess closure announced'); shouldShowModal = true; }
          if (newIds(ME.nt, m.nt)) { toast('📢 New notice from Manager'); shouldShowModal = true; }
        }
        ME = m;
        VC['me' + JSON.stringify([U, P, TOK])] = m;
        renderAlerts();
        if (shouldShowModal) showModal();
        if (CUR === 'req' && !typing()) vReq();
        return;
      }
      ME = m; VC['me' + JSON.stringify([U, P, TOK])] = m; setBell(); renderAlerts();
    } catch (e) {}
  }, 20000);
}

const moTxt = m => {
  const d1 = fmt(m[1]), d2 = fmt(m[3]);
  const per = m[1] === m[3] ? (m[2] === m[4] ? d1 + ' (' + SH[m[2]] + ')' : d1 + ' (All day)') : d1 + ' (' + SH[m[2]] + ') to ' + d2 + ' (' + SH[m[4]] + ')';
  return per + (m[5] ? ' · Reason: ' + m[5] : '');
};

function notices() {
  const n = [], t = ME.today || I.today;
  if (ROLE !== 'U') return n;
  // When mess ends, clear all Bazar Duty notices and announcements — keep only money accounts
  if (ME.messEnded || !I.start || I.end) return n;

  const disSaved = getDisNt();
  const paidAdv = getPaidAdv();

  if (ME.blocked) {
    n.push({k: 'blk', lvl: 'red', act: "go('req','pay')", html: `<b>Warning / Account Frozen:</b> You have ${tk(ME.due)} unpaid dues, so meals are paused. Pay advance or request a grace period.<span class="bn-sub">সতর্কতা: বকেয়ার কারণে আপনার মিল বন্ধ আছে। এখনই অ্যাডভান্স দিন অথবা গ্রেস পিরিয়ড চান।</span>`});
  } else if (ME.due > 0 && ME.graceUntil) {
    n.push({k: 'gr', lvl: dayGap(t, ME.graceUntil) <= 0 ? 'red' : 'warn', act: "go('req','pay')", html: `<b>Payment Warning:</b> Please pay ${tk(ME.due)} by ${fmt(ME.graceUntil)} to avoid account freeze.<span class="bn-sub">সতর্কতা: ${fmt(ME.graceUntil)}-এর মধ্যে ${tk(ME.due)} পরিশোধ করুন।</span>`});
  }

  // Only show Bazar Duty Notice if duty is active/upcoming AND bazar is NOT yet completed (daysDone === 0)
  (ME.duties || []).filter(d => d[1] === U && d[3] >= t && Number(d[4] || 0) === 0).forEach(d => {
    const st = dutyStatusInfo(d, t), range = fmt(d[2]) + ' to ' + fmt(d[3]);
    const lvl = st.state === 'running' || dayGap(t, d[2]) <= 1 ? 'red' : 'warn';
    n.push({
      k: 'duty_' + d[0],
      lvl: lvl,
      html: `<b>🛒 Bazar Duty Notice:</b> ${esc(st.detail)} (${range}).<span class="bn-sub">আপনার বাজারের সময়: ${range} (${esc(st.detail)}) — বাজার শেষ হলে নোটিশ অটো চলে যাবে।</span>`
    });
  });

  (ME.nt || []).forEach(x => {
    const nid = 'nt_' + x[0];
    if (disSaved.indexOf(nid) >= 0) return;
    n.push({
      k: nid,
      lvl: 'info',
      once: 1,
      dis: 1,
      persistDis: true,
      modal: true,
      html: `<b>📢 Notice:</b> ${esc(x[1])}`
    });
  });

  (ME.mo || []).forEach(m => {
    const mid = 'mo_' + m[0];
    if (disSaved.indexOf(mid) >= 0) return;
    n.push({
      k: mid,
      lvl: m[1] <= t ? 'red' : 'warn',
      once: 1,
      dis: 1,
      persistDis: true,
      html: `<b>🔕 Mess Closure Notice:</b> ${esc(moTxt(m))}`
    });
  });

  (ME.adv || []).filter(a => String(a[5] || '').toLowerCase() !== 'paid' && paidAdv.indexOf(String(a[0])) < 0).forEach(a => {
    const g = dayGap(t, a[2]);
    n.push({
      k: 'adv_' + a[0],
      lvl: g <= 1 ? 'red' : 'warn',
      act: `payAdv('${a[0]}')`,
      html: `<b>💰 Bazar / Advance Request:</b> ${tk(a[1])} due by ${fmt(a[2])}${a[3] ? ' (' + esc(a[3]) + ')' : ''} — once paid, this notice will disappear.<span class="bn-sub">টাকা শোধ হয়ে গেলে এই নোটিশ আর দেখাবে না।</span>`
    });
  });

  const o = {red: 0, warn: 1, ok: 2, info: 3};
  return n.sort((a, b) => o[a.lvl] - o[b.lvl]);
}

function renderAlerts() {
  const list = notices().filter(x => !DIS[x.k]);

// ---------- Bazar Duty System ----------
function applyDutyPreset(baseDate, spanDays, btnEl) {
  const fEl = $('#df'), tEl = $('#dt');
  if (!fEl || !tEl) return;
  const start = fEl.value || baseDate;
  const end = addD(start, Math.max(0, spanDays - 1));
  tEl.value = end;
  document.querySelectorAll('.duty-chip').forEach(c => c.classList.remove('on'));
  if (btnEl) btnEl.classList.add('on');
  updateDutyHint();
}

function setDutyStartToday(today, spanDays, btnEl) {
  const fEl = $('#df'), tEl = $('#dt');
  if (!fEl || !tEl) return;
  fEl.value = today;
  tEl.value = addD(today, Math.max(0, spanDays - 1));
  document.querySelectorAll('.duty-chip').forEach(c => c.classList.remove('on'));
  if (btnEl) btnEl.classList.add('on');
  updateDutyHint();
}

function updateDutyHint() {
  const fEl = $('#df'), tEl = $('#dt'), mEl = $('#dm'), hEl = $('#duty_preview');
  if (!fEl || !tEl || !hEl) return;
  const fVal = fEl.value, tVal = tEl.value, mVal = mEl ? mEl.value : '';
  if (!fVal || !tVal || tVal < fVal) {
    hEl.innerHTML = `<span style="color:#dc2626">Invalid date range: End date must be on or after start date.</span>`;
    return;
  }
  const days = dayGap(fVal, tVal) + 1;
  const duties = ME.duties || [];
  const clashes = duties.filter(d => !(tVal < d[2] || fVal > d[3]));
  const clashHtml = clashes.length
    ? `<div style="color:#b45309;margin-top:4px;font-weight:600">⚠️ Overlap alert: ${clashes.map(c => `${esc(c[1])} (${fmt(c[2])}–${fmt(c[3])})`).join(', ')} already scheduled in this range.</div>`
    : `<div style="color:#166534;margin-top:4px">✓ No date conflict with existing duties.</div>`;
  hEl.innerHTML = `<b>${esc(mVal)}</b> · <b>${days} day(s)</b> (${fmt(fVal)} → ${fmt(tVal)})${clashHtml}`;
}

function payAdv(id) {
  const a = (ME.adv || []).find(x => x[0] === id); if (!a) return toast('This request is no longer open', 1);
  PRE = {amount: a[1], ref: id, note: a[3] ? `Advance (${a[3]})` : 'Advance'}; go('req', 'pay');
}
async function vAdv(bar = '') {
  let l; try { l = await M('adv'); } catch (e) { return err(e); }
  const paidLocal = getPaidAdv();
  const isSettled = r => String(r[6] || '').toLowerCase() === 'paid' || paidLocal.indexOf(String(r[0])) >= 0;
  const t = ME.today || I.today, open = l.filter(r => !isSettled(r)), paid = l.filter(r => isSettled(r)).slice(0, 10);
  wrap(`${bar}<div class="card"><h2>Request Bazar / Advance Payment</h2><p class="sub">Ask members to pay for bazar or advance. Once paid/marked paid, the notice disappears.<span class="bn-note">বাজার বা অ্যাডভান্সের টাকা শোধ হলে মেম্বারের নোটিশ অটো সরে যাবে।</span></p>
  <label>Select Members</label>
  <label class="chk"><input type="checkbox" checked onchange="document.querySelectorAll('.am').forEach(c => c.checked = this.checked)"> <b>Select All</b></label>
  ${I.names.map(n => `<label class="chk"><input type="checkbox" class="am" value="${esc(n)}" checked> ${esc(n)}</label>`).join('') || '<div class="empty">No active members</div>'}
  <label>Amount per Member (৳)</label><input id="aa" type="number" inputmode="decimal" min="0" placeholder="e.g. 2000">
  <label>Due Date</label><input id="ad" type="date" value="${addD(t, 7)}">
  <label>Note (Optional)</label><input id="an" placeholder="e.g. Bazar money / Monthly advance">
  <button class="btn" onclick="advReview()">Review Request</button></div>
  <div class="card"><h3>Active / Pending Requests (${open.length})</h3>${open.length ? `<p class="sub">Total Requested: ${tk(open.reduce((a, r) => a + Number(r[3]), 0))}</p>` + open.map(r => { const od = r[4] < t; return `<div class="row" style="cursor:default;flex-wrap:wrap"><div><b>${esc(r[2])}</b><small>${tk(r[3])} · Due ${fmt(r[4])}${r[5] ? ' · ' + esc(r[5]) : ''}</small></div><div style="display:flex;gap:6px;align-items:center;flex:0 0 auto"><span class="badge ${od ? 'neg' : 'warn'}">${od ? 'Overdue' : 'Pending'}</span><button class="btn sm" onclick="advAct('advDone','${r[0]}')">Mark Paid</button><button class="btn sm red" onclick="advAct('advDel','${r[0]}')">Cancel</button></div></div>`; }).join('') : '<div class="empty">No pending advance/bazar requests</div>'}</div>
  ${paid.length ? `<div class="card"><h3>Paid / Settled (Notice Removed)</h3>${paid.map(r => `<div class="row" style="cursor:default"><div><b>${esc(r[2])}</b><small>${tk(r[3])} · ${fmt(r[4])}${r[5] ? ' · ' + esc(r[5]) : ''}</small></div><span class="badge pos">Paid</span></div>`).join('')}</div>` : ''}`);
}
function advReview() {
  const names = Array.from(document.querySelectorAll('.am')).filter(c => c.checked).map(c => c.value);
  const d = {members: names, amount: $('#aa').value, due: $('#ad').value, note: $('#an').value.trim()};
  if (!names.length) return toast('Please select at least one member', 1);
  if (!(Number(d.amount) > 0) || !d.due) return toast('Please enter amount and due date', 1);
  wrap(`<div class="card"><h3>Review Advance Request</h3><table><tr><td>Members (${names.length})</td><td><b>${names.map(esc).join(', ')}</b></td></tr><tr><td>Amount Each</td><td><b>${tk(d.amount)}</b></td></tr><tr><td>Total Amount</td><td><b>${tk(Number(d.amount) * names.length)}</b></td></tr><tr><td>Due Date</td><td><b>${fmt(d.due)}</b></td></tr>${d.note ? `<tr><td>Note</td><td><b>${esc(d.note)}</b></td></tr>` : ''}</table>
  <button class="btn" id="advc">Send Request</button><button class="btn sec" onclick="vDB()">Edit</button></div>`);
  $('#advc').onclick = () => M('advAdd', d).then(n => { toast('Advance request sent to ' + n + ' member(s)'); vDB(); }).catch(err);
}
const advAct = (a, id) => {
  if (a !== 'advDone' && !confirm('Cancel this advance request?')) return;
  M(a, {id}).then(() => {
    if (a === 'advDone') addPaidAdv(id);
    toast(a === 'advDone' ? 'Marked as paid — notice hidden' : 'Request cancelled');
    vDB();
  }).catch(err);
};

// ---------- Notices & Mess Closure ----------
function syncCustomNoticeDays() {
  const sel = $('#nt_d'), box = $('#nt_custom_box');
  if (!sel || !box) return;
  box.style.display = sel.value === 'custom' ? 'block' : 'none';
}

async function vAnn(bar = '', mode = 'nt') {
  let nt, mo; try { [nt, mo] = await Promise.all([M('nt'), M('mo')]); } catch (e) { return err(e); }
  const t = ME.today || I.today, act = nt.filter(r => r[3] >= t), up = mo.filter(r => r[4] >= t).sort((a, b) => a[2] < b[2] ? -1 : 1);
  const shSel = (id, v) => `<select id="${id}"><option value="L" ${v === 'L' ? 'selected' : ''}>${SH.L}</option><option value="D" ${v === 'D' ? 'selected' : ''}>${SH.D}</option></select>`;

  const ntCard = `<div class="card"><h2>Publish Notice / নোটিশ প্রকাশ</h2><p class="sub">Set how many days members will see this notice.<span class="bn-note">মেম্বারদের কাছে নোটিশটি কতদিন শো করবে তা সেট করে দিন।</span></p>
  <label>Message / নোটিশের বিবরণ</label><textarea id="nt_t" maxlength="300" placeholder="e.g. Cook will be absent tomorrow morning."></textarea>
  <label>Show Duration (কতদিন শো করবে)</label>
  <select id="nt_d" onchange="syncCustomNoticeDays()">
    <option value="1">1 Day (Today only)</option>
    <option value="2">2 Days</option>
    <option value="3" selected>3 Days</option>
    <option value="5">5 Days</option>
    <option value="7">7 Days</option>
    <option value="14">14 Days</option>
    <option value="30">30 Days</option>
    <option value="custom">Custom Days / নির্দিষ্ট দিন</option>
  </select>
  <div id="nt_custom_box" style="display:none;margin-top:8px">
    <label>Enter Number of Days (দিন সংখ্যা লিখুন)</label>
    <input id="nt_days_num" type="number" min="1" max="365" value="4" placeholder="e.g. 4">
  </div>
  <button class="btn" onclick="ntSend()">Publish Notice</button>
  ${act.length ? `<h3 style="margin-top:18px">Active Notices (${act.length})</h3>${act.map(r => `<div class="row" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:60%">${esc(r[2])}<small>Shows until ${fmt(r[3])}</small></div><button class="btn sm red" onclick="ntDel('${r[0]}')">Delete</button></div>`).join('')}` : ''}</div>`;

  const moCard = `<div class="card"><h2>Announce Mess Closure / মেস বন্ধ ঘোষণা</h2><p class="sub">Meals during closure are automatically excluded from billing.</p>
  <label>From</label><div class="flex"><input type="date" id="mo_f" value="${t}">${shSel('mo_fs', 'L')}</div>
  <label>To</label><div class="flex"><input type="date" id="mo_t" value="${t}">${shSel('mo_ts', 'L')}</div>
  <label>Reason (Optional)</label><input id="mo_n" maxlength="100" placeholder="e.g. Eid Holidays">
  <button class="btn red" onclick="moAdd()">Announce Closure</button>
  ${up.length ? `<h3 style="margin-top:18px">Scheduled Closures</h3>${up.map(r => `<div class="row" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:60%">${moTxt([r[0], r[2], r[3], r[4], r[5], r[6]])}</div><button class="btn sm sec" onclick="moDel('${r[0]}')">Cancel</button></div>`).join('')}` : ''}</div>`;

  wrap(bar + (mode === 'mo' ? moCard : ntCard));
}

const ntSend = () => {
  const text = $('#nt_t').value.trim();
  if (!text) return toast('Please write a message', 1);
  const selVal = $('#nt_d').value;
  const days = selVal === 'custom' ? Number($('#nt_days_num').value) : Number(selVal);
  if (!days || days < 1) return toast('Please enter a valid number of days (1 or more)', 1);
  M('ntAdd', {text, days}).then(() => { toast(`Notice published for ${days} day(s)`); vNC(); }).catch(err);
};
const ntDel = id => confirm('Delete this notice?') && M('ntDel', {id}).then(() => { toast('Notice deleted'); vNC(); }).catch(err);
const moAdd = () => {
  const d = {from: $('#mo_f').value, fromShift: $('#mo_fs').value, to: $('#mo_t').value, toShift: $('#mo_ts').value, note: $('#mo_n').value.trim()};
  if (!d.from || !d.to) return toast('Please select dates', 1);
  if (d.to < d.from || (d.to === d.from && d.fromShift === 'D' && d.toShift === 'L')) return toast('End must be after start', 1);
  M('moAdd', d).then(() => { toast('Mess closure announced'); vNC(); }).catch(err);
};
const moDel = id => confirm('Cancel this closure?') && M('moDel', {id}).then(() => { toast('Cancelled'); vNC(); }).catch(err);

// ---------- Fast View Cache & Views Registry ----------
const RO = {init: 1, boot: 1, login: 1, me: 1, report: 1, daily: 1, myOffs: 1};

const VIEWS = {
  rep: vRep,
  past: vPast,
  act: vAct,
  today: vToday,
  off: () => form('off', '', true, 'off'),
  guest: () => form('guest', '', false, 'guest'),
  baz: () => form('baz', '', false, 'bazar'),
  duty: () => vDuty(''),
  req: () => ROLE === 'M' ? vMgrReq() : vReq(),
  ent: vEnt,
  db: vDB,
  nc: vNC,
  mem: vMem,
  set: vSet,
  dir: vDir
};
const typing = () => { const e = document.activeElement; return !!(e && /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && $('#v').contains(e)); };
const rc = (fn, ...a) => {
  const k = fn + JSON.stringify(a), hit = VC[k], tab = CUR, get = () => call(fn, a).then(d => (VC[k] = d));
  if (hit === undefined) { load(1, 'Loading...'); return get().finally(() => load(-1)); }
  get().then(d => { if (JSON.stringify(d) !== JSON.stringify(hit) && CUR === tab && !typing() && VIEWS[tab]) VIEWS[tab](); }).catch(() => {});
  return Promise.resolve(hit);
};

start();
</script>
</body></html>
