<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Manager</title>
<style>
:root{--g:#0f766e;--g2:#115e59;--bg:#f1f5f9;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--r:#dc2626;--ok:#16a34a;--info:#0284c7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--t);-webkit-tap-highlight-color:transparent;line-height:1.5}
.bar{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bar b{font-size:18px;letter-spacing:-.2px}.bar small{opacity:.88;display:block;font-size:12px}
.bar button{background:#ffffff24;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600}
.bar .ic{position:relative;font-size:16px;padding:6px 10px}
#bc{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:10px;font:700 11px/1 system-ui;padding:3px 6px;font-style:normal}

#load{display:none;position:fixed;inset:0;background:#0f172a45;backdrop-filter:blur(3px);z-index:30;align-items:center;justify-content:center}
#load .box{background:#fff;border-radius:18px;padding:20px 26px;text-align:center;box-shadow:0 10px 35px #0003;width:255px}
#load .emo{font-size:40px;display:inline-block;animation:hop .55s ease-in-out infinite alternate}
#load b{display:block;font-size:16px;margin-top:8px}
#load .fun{display:block;color:var(--g);margin-top:4px;font-size:13px;font-weight:600}
#load small{display:block;color:var(--m);margin-top:8px;font-size:12px}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}

#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:10;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{white-space:nowrap;border:1px solid var(--b);background:#f8fafc;color:#334155;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
#tabs button.on{background:var(--g);border-color:var(--g);color:#fff}

.wrap{max-width:620px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0f172a12;border:1px solid #e2e8f099}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
h2{margin:0 0 3px;font-size:18px;font-weight:700}
h3{margin:0 0 10px;font-size:15.5px;font-weight:700}
.sub{color:var(--m);font-size:13px;margin:0 0 10px}
.bn-note{display:block;color:#475569;font-size:12.5px;margin-top:3px;font-weight:400}

.rules-btn{white-space:nowrap;border:1.5px solid #99f6e4;background:#f0fdfa;color:var(--g2);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
.rules-btn:hover{background:#ccfbf1}

.optbar{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.optbar::-webkit-scrollbar{display:none}
.optbtn{flex:1;min-width:fit-content;white-space:nowrap;border:1.5px solid #cbd5e1;background:#fff;color:#1e293b;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.optbtn.on{background:#f0fdfa;border-color:var(--g);color:var(--g2)}

label{display:block;margin:12px 0 5px;font-size:13px;font-weight:600;color:#334155}
.hint{font-weight:400;color:var(--m);font-size:12px;margin-top:2px}
input,select,textarea{width:100%;padding:10px 12px;font-size:15px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--g)}

.btn{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;margin-top:14px;cursor:pointer}
.btn.sec{background:#e2e8f0;color:#1e293b}
.btn.red{background:var(--r)}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;margin:0}
.link{background:none;border:0;color:var(--g);font-size:14px;margin-top:12px;width:100%;padding:6px;cursor:pointer;font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:11px 12px}
.tile span{font-size:12px;color:var(--m);display:block}
.tile b{display:block;font-size:18.5px;margin-top:2px;color:var(--t)}

.banner{border-radius:12px;padding:14px 16px;margin:12px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner.pos{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.banner.neg{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.banner b{font-size:21px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 6px;border-bottom:1px solid var(--b);text-align:left;vertical-align:middle}
th{color:var(--m);font-weight:600;font-size:12px;background:#f8fafc}
td:last-child,th:last-child{text-align:right}

.row{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--b);gap:10px}
.row:last-child{border:0}
.row small{color:var(--m);display:block;font-size:12.5px}

.badge{border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-block}
.badge.pos{background:#dcfce7;color:#166534}
.badge.neg{background:#fee2e2;color:#991b1b}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.gray{background:#f1f5f9;color:#475569}
.badge.info{background:#e0f2fe;color:#075985}

.flex{display:flex;gap:8px;align-items:center}
.flex>*{flex:1}
.empty{text-align:center;color:var(--m);padding:24px 10px;font-size:14px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50;max-width:92%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--r)}

.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13.5px;font-weight:500;line-height:1.45}
.alert.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.alert.info{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}
.alert.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert a{text-decoration:underline;font-weight:700;cursor:pointer}
.alert .x{background:none;border:0;font-size:20px;line-height:1;color:inherit;padding:0 2px;opacity:.75;cursor:pointer;flex:0 0 auto}
.bn-sub{display:block;font-size:12.5px;color:inherit;opacity:.9;margin-top:4px;font-weight:400}

#modal{display:none;position:fixed;inset:0;background:#0f172a8c;z-index:40;align-items:center;justify-content:center;padding:16px}
#mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px #0004}

label.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:8px 0;font-size:14px}
.chk input{width:auto;transform:scale(1.2)}

.call-btn{display:inline-flex;align-items:center;gap:4px;background:var(--g);color:#fff;text-decoration:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap}

.rep-sec{margin-top:14px;border:1px solid var(--b);border-radius:10px;overflow:hidden}
.rep-sec h4{margin:0;padding:8px 12px;background:#f8fafc;font-size:13px;color:#334155;border-bottom:1px solid var(--b)}
.rep-sec table td,.rep-sec table th{padding:8px 12px}

.meal-box{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:12px;margin-top:10px}
.meal-box h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}

@media print{#tabs,.bar,button,#toast,#al,#modal,.no-print{display:none!important}.card{box-shadow:none;border:1px solid #cbd5e1}}

.nt-tab{margin-left:auto!important;background:#fef3c7!important;border-color:#f59e0b!important;color:#92400e!important;font-weight:700!important}
.nt-tab.on{background:#d97706!important;border-color:#d97706!important;color:#fff!important}

.act-chart-card{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0 14px}
.act-chart-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.act-chart-top b{font-size:13.5px;color:#0f172a}
.act-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:#475569}
.act-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.act-bar-row{margin-bottom:10px}
.act-bar-row:last-child{margin-bottom:0}
.act-bar-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:4px}
.act-bar-meta span{color:#64748b;font-size:12px;text-align:right}
.act-track{width:100%;height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.act-fill{height:100%;border-radius:999px;transition:width .25s ease}
.act-fill.running{background:#16a34a}
.act-fill.upcoming{background:#0284c7}
.act-fill.done{background:#94a3b8}

.duty-card{border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.duty-card:last-child{margin-bottom:0}
.duty-card.me{background:#f0fdfa;border-color:#99f6e4}
.duty-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.duty-card-dates{font-size:12.5px;color:#475569;margin-top:4px}
.duty-card-sub{font-size:12px;color:#64748b;margin-top:2px}

.nt-item{border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nt-item:last-child{margin-bottom:0}
.nt-item.dim{opacity:.58;background:#f8fafc}
.nt-item-body{flex:1;min-width:0;word-break:break-word}
.nt-item-body b{display:block;font-size:14px;color:#0f172a}
.nt-item-body small{display:block;color:#64748b;font-size:12px;margin-top:4px}

@media (max-width:480px){
  .wrap{padding:10px}
  .card{padding:13px;border-radius:12px}
  h2{font-size:16.5px}
  h3{font-size:14.5px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:10px}
  .tile b{font-size:16.5px}
  .banner{flex-direction:column;align-items:flex-start;padding:12px}
  .banner b{font-size:19px}
  .flex{flex-wrap:wrap}
  .call-btn{padding:6px 10px;font-size:12px}
  .act-bar-meta{flex-direction:column;gap:2px}
  .act-bar-meta span{text-align:left}
  .duty-card-top{flex-direction:column;align-items:flex-start}
}
</style></head><body>
<div id="load"><div class="box"><span class="emo" id="lemo">🍛</span><b id="lmsg">Loading...</b><span class="fun" id="lfun"></span><small id="lsub"></small></div></div>
<div class="bar">
  <div><b id="title">Mess Manager</b><small id="me"></small></div>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="bell" class="ic" title="Requests" style="display:none" onclick="go('req')">🔔<i id="bc" style="display:none"></i></button>
    <button id="out" style="display:none" onclick="logout()">Log out</button>
  </div>
</div>
<div id="tabs" style="display:none"></div>
<div class="wrap" id="al" style="padding-top:0;padding-bottom:0"></div>
<div class="wrap" id="v"><div class="empty">Loading...</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw_7rSc5kXsMjST6UexZniTrtwUeBWr_XBin1j_DrAP4Z6m33zbu_4kTcOoMVgTynVcjQ/exec';
const $ = s => document.querySelector(s);

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmt = d => { if (!d) return '-'; const p = String(d).split('-'); return p.length < 3 ? d : (+p[2]) + ' ' + MON[+p[1] - 1] + ' ' + p[0]; };
const f = x => (Math.round(x * 100) / 100).toLocaleString('en-US');
const tk = x => '৳' + f(x);
function enTime(t) {
  if (!t || !/^\d{2}:\d{2}$/.test(t)) return t || '-';
  const h = +t.slice(0, 2), m = t.slice(3), h12 = h % 12 || 12;
  return h12 + (m === '00' ? '' : ':' + m) + ' ' + (h >= 12 ? 'PM' : 'AM');
}
function bnTime(t) {
  if (!t || !/^\d{2}:\d{2}$/.test(t)) return t || '-';
  const h = +t.slice(0, 2), m = t.slice(3), h12 = h % 12 || 12;
  const per = h < 4 ? 'রাত' : h < 6 ? 'ভোর' : h < 12 ? 'সকাল' : h < 16 ? 'দুপুর' : h < 18 ? 'বিকেল' : h < 20 ? 'সন্ধ্যা' : 'রাত';
  return per + ' ' + h12 + (m === '00' ? '' : ':' + m) + 'টা';
}
const SH = {L: 'Lunch', D: 'Dinner'};
const STL = {Pending: 'Pending', Approved: 'Approved', Rejected: 'Rejected'};
const hm = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const dayGap = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
const addD = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);

// ---------- Loading & Network ----------
let busy = 0, slow, fun, shown = 0;
const FUN = [['🍚', 'Preparing meals...'], ['🛒', 'Checking bazar...'], ['🧮', 'Calculating bills...'], ['🧾', 'Syncing data...']];
const load = (d, msg) => {
  busy += d; const el = $('#load');
  if (busy > 0) {
    if (msg) $('#lmsg').textContent = msg;
    if (shown) return; shown = 1; $('#lsub').textContent = '';
    let k = Math.floor(Math.random() * FUN.length);
    const tick = () => { $('#lemo').textContent = FUN[k][0]; $('#lfun').textContent = FUN[k][1]; k = (k + 1) % FUN.length; };
    tick(); clearInterval(fun); fun = setInterval(tick, 1400); el.style.display = 'flex';
    clearTimeout(slow); slow = setTimeout(() => $('#lsub').textContent = 'Taking a moment, please wait...', 4000);
  } else { busy = 0; shown = 0; clearInterval(fun); clearTimeout(slow); el.style.display = 'none'; }
};
const MSG = {save: 'Saving...', signup: 'Sending request...', login: 'Logging in...', setReturn: 'Saving...', request: 'Sending request...', boot: 'Logging in...'};
const READ_ACTS = ['lists', 'reqs', 'adv', 'mo', 'nt'];
const call = (fn, a) => fetch(API + '?fn=' + fn + '&a=' + encodeURIComponent(JSON.stringify(a))).then(r => r.json())
  .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
  .catch(e => { throw new Error(/fetch|network/i.test(e.message) ? 'No internet connection. Please try again.' : e.message); });
const run = (fn, ...a) => {
  if (!RO[fn] && !(fn === 'mgr' && READ_ACTS.indexOf(a[2]) >= 0)) VC = {};
  load(1, MSG[fn] || (fn === 'mgr' && READ_ACTS.indexOf(a[2]) < 0 ? 'Saving...' : 'Loading...'));
  return call(fn, a).finally(() => load(-1));
};
const runQ = (fn, ...a) => call(fn, a);
const toast = (m, bad) => { const t = $('#toast'); t.textContent = m; t.className = (bad ? 'bad ' : '') + 'show'; clearTimeout(window._t); window._t = setTimeout(() => t.className = bad ? 'bad' : '', 3600); };
const err = e => toast(e.message, 1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const wrap = h => { $('#v').innerHTML = h; window.scrollTo(0, 0); };
const stamp = d => (d.t0 = Date.now(), d);

let U, P, TOK, ROLE, I, NAMES = [], D, LM, ME = {duties: [], nt: [], mo: [], adv: [], mine: []};
let VC = {}, CUR = '', PRE = null, MIDS = [], RQ = {reqs: [], signups: []};
let ENT_MODE = 'dep', DB_MODE = 'duty', MS_MODE = 'mem', SHOW_MY_DETAIL = false, MGR_DETAIL_IDX = null;

// ---------- Auth & Session ----------
const SK = 'mess_sess_v3';
try { localStorage.removeItem('mess_session'); } catch (e) {}
const loadSess = () => { try { const s = JSON.parse(sessionStorage.getItem(SK)); return s && s.U && /^\d{4}$/.test(s.P) && s.TOK ? s : null; } catch (e) { return null; } };
const saveSess = () => { try { sessionStorage.setItem(SK, JSON.stringify({U, P, TOK})); } catch (e) {} };
const clearSess = () => { try { sessionStorage.removeItem(SK); } catch (e) {} };
const logout = () => { clearSess(); location.reload(); };

function start() {
  run('init').then(d => {
    I = stamp(d);
    $('#title').textContent = d.mess;
    const s = loadSess();
    if (s) return doLogin(s.U, s.P, s.TOK, true);
    showLogin();
  }).catch(e => wrap(`<div class="card empty">${esc(e.message)}<button class="btn" onclick="start()">Try again</button></div>`));
}

function showLogin() {
  wrap(`<div class="card"><h2>Welcome / স্বাগতম</h2><p class="sub">Log in with your name and 4-digit PIN<span class="bn-note">আপনার নাম এবং ৪ ডিজিটের পিন দিয়ে লগইন করুন।</span></p>
  <label>Select Account / অ্যাকাউন্ট নির্বাচন করুন</label><select id="u"><option value="__manager">Mess Manager</option>${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
  <label>4-Digit PIN / ৪ ডিজিট পিন</label><input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="login()">Log in</button>
  <button class="link" onclick="showSignup()">New member? Create an account (নতুন অ্যাকাউন্ট)</button></div>`);
}

function login() {
  const u = $('#u').value, p = $('#p').value;
  if (!/^\d{4}$/.test(p)) return toast('Please enter your 4-digit PIN', 1);
  run('login', u, p).then(res => doLogin(u, p, res.token, false)).catch(err);
}

function doLogin(u, p, tok, silent) {
  U = u; P = p; TOK = tok;
  return run('boot', U, P, TOK).then(b => {
    ROLE = b.role; TOK = b.token || TOK; I = stamp(b.init); ME = b.me; VC = {};
    SHOW_MY_DETAIL = false; MGR_DETAIL_IDX = null;
    VC['me' + JSON.stringify([U, P, TOK])] = b.me;
    VC['report' + JSON.stringify([U, P, TOK])] = b.rep;
    $('#me').textContent = ROLE === 'M' ? 'Mess Manager' : U;
    $('#out').style.display = '';
    saveSess(); buildTabs(); afterLogin(); go('rep');
  }).catch(e => {
    clearSess();
    if (!silent) return err(e);
    showLogin();
  });
}

function showSignup() {
  wrap(`<div class="card"><h2>Create Account / নতুন অ্যাকাউন্ট</h2><p class="sub">The manager will approve your request before you can log in.<span class="bn-note">আবেদনের পর ম্যানেজার অ্যাপ্রুভ করলে লগইন করতে পারবেন।</span></p>
  <label>Full Name / পুরো নাম</label><input id="sn" placeholder="e.g. Rahim Uddin">
  <label>Mobile Number / মোবাইল নাম্বার<div class="hint">11-digit Bangladeshi number (e.g. 017XXXXXXXX)</div></label><input id="sph" type="tel" inputmode="tel" maxlength="14" placeholder="017XXXXXXXX">
  <label>Choose a 4-Digit PIN / ৪ ডিজিট পিন<div class="hint">You will use this PIN to log in.</div></label><input id="sp" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="signReview()">Continue</button><button class="link" onclick="showLogin()">Back to log in</button></div>`);
}

function signReview() {
  const n = $('#sn').value.trim(), ph = $('#sph').value.trim(), p = $('#sp').value;
  if (n.length < 2) return toast('Please enter your full name', 1);
  if (!/^01[3-9]\d{8}$/.test(ph.replace(/[\s\-+]/g, '').replace(/^88/, ''))) return toast('Please enter a valid 11-digit mobile number', 1);
  if (!/^\d{4}$/.test(p)) return toast('PIN must be 4 digits', 1);
  wrap(`<div class="card"><h3>Review Your Details</h3><table><tr><td>Name</td><td><b>${esc(n)}</b></td></tr><tr><td>Mobile</td><td><b>${esc(ph)}</b></td></tr><tr><td>PIN</td><td><b>${esc(p)}</b></td></tr></table>
  <button class="btn" id="sc">Submit Request</button><button class="btn sec" onclick="showSignup()">Edit</button></div>`);

function go(t, sub) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.id === 't_' + t));

  VIEWS[t]();
}

function ruleBoxContent() {
  const k = I.rules, n = hm(k.now) + Math.floor((Date.now() - I.t0) / 60000);
  let statusEn = '', statusBn = '';
  if (n < hm(k.lunch)) {
    statusEn = "Current status: You can turn off today's Lunch, today's Dinner, or future meals.";
    statusBn = 'বর্তমান অবস্থা: এখন আজকের লাঞ্চ, আজকের ডিনার এবং আগামী দিনের মিল বন্ধ করতে পারবেন।';
  } else if (n < hm(k.dinner)) {
    statusEn = "Current status: Today's Lunch cutoff has passed. You can turn off today's Dinner and future meals.";
    statusBn = 'বর্তমান অবস্থা: আজকের লাঞ্চ বন্ধের সময় শেষ। এখন আজকের ডিনার এবং আগামী দিনের মিল বন্ধ করতে পারবেন।';
  } else if (n < hm(k.nextLunch)) {
    statusEn = "Current status: Today's meals are locked. You can turn off tomorrow's Lunch (before " + enTime(k.nextLunch) + " tonight) and future meals.";
    statusBn = 'বর্তমান অবস্থা: আজকের মিল বন্ধের সময় শেষ। আগামীকালের লাঞ্চ আজ ' + bnTime(k.nextLunch) + '-এর মধ্যে বন্ধ করতে পারবেন।';
  } else {
    statusEn = "Current status: Today's meals and tomorrow's Lunch are locked. You can turn off meals starting from tomorrow's Dinner.";
    statusBn = 'বর্তমান অবস্থা: আজকের মিল এবং আগামীকালের লাঞ্চ বন্ধের সময় শেষ। আগামীকালের ডিনার থেকে বন্ধ করতে পারবেন।';
  }
  return `<div>
    <b>Meal-Off Deadlines & Rules:</b><br>
    • Today's Lunch: before <b>${enTime(k.lunch)}</b><br>
    • Today's Dinner: before <b>${enTime(k.dinner)}</b><br>
    • Tomorrow's Lunch: before <b>${enTime(k.nextLunch)}</b> tonight (cook prepares meals based on night count)<br>
    • Past dates cannot be turned off or turned back on.<br>
    • Duplicate meal-off for the same meal is blocked.<br>
    <b style="display:block;margin-top:6px">${statusEn}</b>
    <span class="bn-sub">নিয়মাবলি: আজকের লাঞ্চ <b>${bnTime(k.lunch)}</b>, আজকের ডিনার <b>${bnTime(k.dinner)}</b> এবং আগামীকালের লাঞ্চ আজ <b>${bnTime(k.nextLunch)}</b>-এর মধ্যে বন্ধ করতে হবে (কারণ বুয়া রাতেই সংখ্যা জেনে রান্না করেন)। গত দিনের মিল বন্ধ বা চালু করা যাবে না। একই মিল দুবার বন্ধ করা যাবে না।<br>${statusBn}</span>
  </div>`;
}

function inp(k, l, t, h) {

  const minAttr = (k === 'offDate' || k === 'onDate') ? `min="${I.today}"` : '';

  return `<label>${l}${hint}</label><input id="f_${k}" type="${ty}" ${t === 'date' ? `value="${I.today}"` : ''} ${minAttr} ${ty === 'number' ? 'inputmode="decimal" min="0"' : ''}>`;
}

function form(type, topHtml = '', showOffExtras = false, ruleKey = '') {
  const [title, sub, fs] = FORMS[type];
  const mem = ROLE === 'M' ? `<label>Member</label><select id="f_member">${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>` : '';
  wrap(`${topHtml}<div id="off_ok_box"></div><div class="card"><div class="p-head"><div><h2>${title}</h2><p class="sub" style="margin:0">${sub}</p></div>${ruleKey ? rulesBtn(ruleKey) : ''}</div>${mem}${fs.map(x => inp(...x)).join('')}<button class="btn" onclick="review('${type}')">Continue</button></div>${showOffExtras ? '<div id="offl"></div>' : ''}`);
  if (showOffExtras && ROLE === 'U') offList();
}

function review(type) {
  const fs = FORMS[type][2], d = {};
  if (ROLE === 'M') d.member = $('#f_member').value;
  fs.forEach(x => d[x[0]] = $('#f_' + x[0]).value);
  const need = fs.filter(x => x[2] === 'date' || x[2] === 'number');
  if (need.some(x => !d[x[0]] || (x[2] === 'number' && !(Number(d[x[0]]) > 0)))) return toast('Please fill in all required fields', 1);
  const val = x => x[2] === 'shift' ? SH[d[x[0]]] : x[2].startsWith('date') ? (d[x[0]] ? fmt(d[x[0]]) : '-') : x[2] === 'number' && x[0] === 'amount' ? tk(d[x[0]]) : (d[x[0]] || '-');
  const rows = [['Member', d.member || U]].concat(fs.filter(x => !(x[0] === 'onShift' && !d.onDate)).map(x => [x[1].split(' / ')[0].replace(/\s*\(.*\)/, ''), val(x)]));
  wrap(`<div class="card"><h3>Please Confirm Details / তথ্য যাচাই করুন</h3><table>${rows.map(r => `<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}</table>
  <button class="btn" id="cf">Confirm</button><button class="btn sec" onclick="VIEWS[CUR]()">Edit</button></div>`);
  $('#cf').onclick = () => run('save', U, P, type, d, TOK).then(res => {
    toast('Saved successfully');
    VIEWS[CUR]();
    if (type === 'off') {
      const cp = (res && res.cookPhone) || (ME.contacts && ME.contacts.cookPhone) || I.cookPhone || '';
      setTimeout(() => {
        const box = $('#off_ok_box');
        if (box) {
          box.innerHTML = `<div class="alert ok" style="margin-bottom:12px"><div>
            <b>✅ Meal Off Confirmed! / মিল সফলভাবে বন্ধ হয়েছে!</b><br>
            Please call the cook to inform immediately.<br>
            <span class="bn-sub">দয়া করে বুয়াকে কল দিয়ে জানিয়ে দিন।</span>
            ${cp ? `<div style="margin-top:8px"><a class="call-btn" href="tel:${esc(cp)}">📞 Call Cook (বুয়া): ${esc(cp)}</a></div>` : '<div class="hint" style="margin-top:4px">(Cook phone number not set by manager yet)</div>'}
          </div></div>`;
        }
      }, 60);
    }

function drawDay(d) {
  if (!$('#dr')) return;
  $('#dr').innerHTML = !d.ok ? '<div class="empty">The mess has not started yet.</div>' : ['L', 'D'].map(s => {
    if (d.cl && d.cl[s]) return `<div class="meal-box"><h4><span>${SH[s]}</span><span class="badge neg">Closed</span></h4><div class="alert red" style="margin:0">Mess is closed for this meal.</div></div>`;
    const g = d['g' + s.toLowerCase()];
    return `<div class="meal-box">
      <h4><span>${SH[s]} (কে কে খাচ্ছেন)</span><span class="badge pos">${d[s].length + g} Meals</span></h4>
      <div>${d[s].map(n => `<span class="badge pos" style="margin:0 6px 6px 0">${esc(n)}</span>`).join('') || '<span class="sub">Nobody</span>'}${g ? `<span class="badge info" style="margin:0 6px 6px 0">+${g} Guest</span>` : ''}</div>
    </div>`;
  }).join('') + (d.fz && d.fz.length ? `<div class="meal-box"><h4><span>Frozen (বকেয়ার কারণে বন্ধ)</span><span class="badge neg">${d.fz.length}</span></h4><div>${d.fz.map(n => `<span class="badge neg" style="margin:0 6px 6px 0">${esc(n)}</span>`).join('')}</div></div>` : '');
}

function loadDay() {
  const el = $('#dd'); if (!el) return;
  const dt = el.value, k = 'daily' + dt, hit = VC[k], ok = () => $('#dr') && $('#dd') && $('#dd').value === dt;
  if (hit) drawDay(hit); else load(1, 'Loading...');
  call('daily', [dt]).then(d => { VC[k] = d; if (!hit) load(-1); if (ok()) drawDay(d); }).catch(e => { if (!hit) load(-1); err(e); });
}

function dutyStatusInfo(d, today) {
  const start = d[2], end = d[3];
  const totalDays = dayGap(start, end) + 1;
  if (today < start) {
    const left = dayGap(today, start);
    return {
      state: 'upcoming',
      badgeClass: left <= 2 ? 'warn' : 'info',
      badgeText: left === 0 ? 'Starts Today' : left === 1 ? 'Starts Tomorrow' : `In ${left} Days`,
      detail: `Starts in ${left} day(s) · Duration: ${totalDays} day(s)`
    };
  }
  if (today >= start && today <= end) {
    const rem = dayGap(today, end);
    const done = dayGap(start, today) + 1;
    return {
      state: 'running',
      badgeClass: 'pos',
      badgeText: rem === 0 ? 'Last Day Today' : `${rem} Day(s) Left`,
      detail: `Day ${done} of ${totalDays} · ${rem === 0 ? 'Ends today' : rem + ' day(s) bazar remaining'}`
    };
  }
  return {
    state: 'done',
    badgeClass: 'gray',
    badgeText: 'Completed',
    detail: `Completed (${totalDays} day(s))`
  };
}

function dutyProgressPct(d, today, state) {
  const total = Math.max(1, dayGap(d[2], d[3]) + 1);
  if (state === 'done') return 100;
  if (state === 'upcoming') return 12;
  const done = Math.min(total, Math.max(1, dayGap(d[2], today) + 1));
  return Math.round((done / total) * 100);
}

async function vAct() {

  const t = ME.today || I.today;
  const duties = (ME.duties || []).slice().sort((a, b) => a[2] < b[2] ? -1 : a[2] > b[2] ? 1 : 0);
  const running = duties.filter(d => t >= d[2] && t <= d[3]);
  const upcoming = duties.filter(d => t < d[2]);
  const completed = duties.filter(d => t > d[3]);

  const maxSpan = duties.reduce((mx, d) => Math.max(mx, dayGap(d[2], d[3]) + 1), 1);
  const chartRows = duties.slice(0, 8).map(d => {
    const st = dutyStatusInfo(d, t);
    const span = dayGap(d[2], d[3]) + 1;
    const widthPct = st.state === 'running'
      ? dutyProgressPct(d, t, st.state)
      : Math.max(18, Math.min(100, Math.round((span / maxSpan) * 100)));
    const barCls = st.state === 'running' ? 'running' : st.state === 'upcoming' ? 'upcoming' : 'done';
    const shortMeta = st.state === 'running'
      ? `${st.badgeText} (${fmt(d[2])}–${fmt(d[3])})`

  }).join('');

  const chartBox = duties.length
    ? `<div class="act-chart-card">

          <b>📊 Bazar Timeline Chart / বাজার চার্ট</b>

        <div><b>${esc(d[1])}${isMe ? ' (You)' : ''}</b><div class="duty-card-dates">📅 ${fmt(d[2])} → ${fmt(d[3])}</div></div>
        <span class="badge ${st.badgeClass}">${st.badgeText}</span>
      </div>
      <div class="duty-card-sub">${esc(st.detail)}</div>

  };

  const runHtml = running.length
    ? running.map(d => cardItem(d, dutyStatusInfo(d, t))).join('')
    : '<div class="empty">No active bazar duty today.</div>';

  const upHtml = upcoming.length
    ? upcoming.map(d => cardItem(d, dutyStatusInfo(d, t))).join('')
    : '<div class="empty">No upcoming bazar dates scheduled.</div>';

  const doneHtml = completed.length
    ? completed.slice().reverse().map(d => cardItem(d, dutyStatusInfo(d, t))).join('')
    : '<div class="empty">No completed bazar duties yet.</div>';

  wrap(`

// ---------- Live Notifications, Notices (Dismissible by Member) & Polling ----------
let DIS = {}, pollT, lastPend = null, lastSt = null;
const seenKey = () => 'mess_seen_' + U;
const disKey = () => 'mess_dis_nt_' + U;
const getSeen = () => { try { return JSON.parse(localStorage.getItem(seenKey()) || '[]'); } catch (e) { return []; } };
const addSeen = ids => { try { localStorage.setItem(seenKey(), JSON.stringify(getSeen().concat(ids).slice(-100))); } catch (e) {} };
const getDisNt = () => { try { return JSON.parse(localStorage.getItem(disKey()) || '[]'); } catch (e) { return []; } };
const addDisNt = id => { try { const a = getDisNt(); if (a.indexOf(id) < 0) { a.push(id); localStorage.setItem(disKey(), JSON.stringify(a.slice(-150))); } } catch (e) {} };
const stMap = m => { const o = {}; (m.mine || []).forEach(r => o[r[0]] = r[8]); return o; };
const reqText = r => r[3] === 'pay' ? 'Your ' + tk(r[4]) + ' payment request' : r[3] === 'grace' ? 'Your grace period request' : 'Your request ("' + r[7] + '")';

function afterLogin() {
  lastPend = ROLE === 'M' ? ME.pending : null;
  lastSt = ROLE === 'U' ? stMap(ME) : null;
  setBell(); renderAlerts(); showModal(); startPoll();
}
function setBell() {
  if (ROLE !== 'M') return;
  const n = ME.pending || 0;
  $('#bell').style.display = ''; $('#bc').textContent = n; $('#bc').style.display = n ? '' : 'none';
  const t = $('#t_req'); if (t) t.textContent = 'Requests' + (n ? ' (' + n + ')' : '');
  document.title = (n ? '(' + n + ') ' : '') + 'Mess Manager';
}
const newIds = (a, b) => { const old = (a || []).map(x => x[0]); return (b || []).some(x => old.indexOf(x[0]) < 0); };

function startPoll() {
  clearInterval(pollT);
  pollT = setInterval(async () => {
    if (document.hidden) return;
    try {
      const m = await runQ('me', U, P, TOK);
      if (ROLE === 'M') {
        if (lastPend !== null && m.pending > lastPend) toast('🔔 New request received');
        lastPend = m.pending;
      } else {
        let shouldShowModal = false;
        const s = stMap(m);
        Object.keys(s).forEach(id => {
          if (lastSt && lastSt[id] === 'Pending' && s[id] !== 'Pending') {
            toast(s[id] === 'Approved' ? '✅ Your request was approved' : '❌ Your request was rejected');
            shouldShowModal = true;
          }
        });
        lastSt = s;
        if (newIds(ME.adv, m.adv)) { toast('💰 Manager requested an advance payment'); shouldShowModal = true; }
        if (newIds(ME.mo, m.mo)) { toast('🔕 New mess closure announced'); shouldShowModal = true; }
        if (newIds(ME.nt, m.nt)) { toast('📢 New notice from Manager'); shouldShowModal = true; }
        ME = m;
        VC['me' + JSON.stringify([U, P, TOK])] = m;
        renderAlerts();
        if (shouldShowModal) showModal();
        if (CUR === 'req' && !typing()) vReq();
        return;
      }
      ME = m; VC['me' + JSON.stringify([U, P, TOK])] = m; setBell(); renderAlerts();
    } catch (e) {}
  }, 20000);
}

const moTxt = m => {
  const d1 = fmt(m[1]), d2 = fmt(m[3]);
  const per = m[1] === m[3] ? (m[2] === m[4] ? d1 + ' (' + SH[m[2]] + ')' : d1 + ' (All day)') : d1 + ' (' + SH[m[2]] + ') to ' + d2 + ' (' + SH[m[4]] + ')';
  return per + (m[5] ? ' · Reason: ' + m[5] : '');
};

function notices() {
  const n = [], t = ME.today || I.today;
  if (ROLE !== 'U') return n;
  const disSaved = getDisNt();

  if (ME.blocked) {
    n.push({k: 'blk', lvl: 'red', act: "go('req','pay')", html: `<b>Warning / Account Frozen:</b> You have ${tk(ME.due)} unpaid dues, so meals are paused. Pay now or request a grace period.<span class="bn-sub">সতর্কতা: বকেয়ার কারণে আপনার মিল বন্ধ আছে। এখনই টাকা দিন অথবা গ্রেস পিরিয়ড চান।</span>`});
  } else if (ME.due > 0 && ME.graceUntil) {
    n.push({k: 'gr', lvl: dayGap(t, ME.graceUntil) <= 0 ? 'red' : 'warn', act: "go('req','pay')", html: `<b>Payment Warning:</b> Please pay ${tk(ME.due)} by ${fmt(ME.graceUntil)} to avoid account freeze.<span class="bn-sub">সতর্কতা: ${fmt(ME.graceUntil)}-এর মধ্যে ${tk(ME.due)} পরিশোধ করুন।</span>`});
  }

  (ME.duties || []).filter(d => d[1] === U && d[3] >= t).forEach(d => {
    const st = dutyStatusInfo(d, t), range = fmt(d[2]) + ' to ' + fmt(d[3]);
    const lvl = st.state === 'running' || dayGap(t, d[2]) <= 1 ? 'red' : 'warn';
    n.push({
      k: 'duty_' + d[0],
      lvl: lvl,
      html: `<b>🛒 Bazar Duty Notice:</b> ${esc(st.detail)} (${range}).<span class="bn-sub">আপনার বাজারের সময়: ${range} (${esc(st.detail)})</span>`
    });
  });

  (ME.nt || []).forEach(x => {
    const nid = 'nt_' + x[0];
    if (disSaved.indexOf(nid) >= 0) return;
    n.push({
      k: nid,
      lvl: 'info',
      once: 1,
      dis: 1,
      persistDis: true,
      modal: true,
      html: `<b>📢 Notice:</b> ${esc(x[1])}`
    });
  });

  (ME.mo || []).forEach(m => {
    const mid = 'mo_' + m[0];
    if (disSaved.indexOf(mid) >= 0) return;
    n.push({
      k: mid,
      lvl: m[1] <= t ? 'red' : 'warn',
      once: 1,
      dis: 1,
      persistDis: true,
      html: `<b>🔕 Mess Closure Notice:</b> ${esc(moTxt(m))}`
    });
  });

  (ME.adv || []).forEach(a => {
    const g = dayGap(t, a[2]);
    n.push({k: 'adv_' + a[0], lvl: g <= 1 ? 'red' : 'warn', act: `payAdv('${a[0]}')`, html: `<b>💰 Advance Request:</b> ${tk(a[1])} due by ${fmt(a[2])}${a[3] ? ' (' + esc(a[3]) + ')' : ''}`});
  });

  const o = {red: 0, warn: 1, ok: 2, info: 3};
  return n.sort((a, b) => o[a.lvl] - o[b.lvl]);
}

function renderAlerts() {
  const list = notices().filter(x => !DIS[x.k]);
  $('#al').innerHTML = list.map(x => `<div class="alert ${x.lvl}">
    <div>${x.html}${x.act ? ` <a onclick="${x.act}">Pay Now</a>` : ''}</div>
    ${x.dis ? `<button class="x" title="Dismiss notice" onclick="dis('${x.k}',${x.persistDis ? 'true' : 'false'})">×</button>` : ''}
  </div>`).join('');
}
function dis(k, persist) {
  DIS[k] = 1;
  if (persist) addDisNt(k);
  renderAlerts();
}

function showModal() {
  const seen = getSeen(); MIDS = [];
  const items = notices().filter(x => (x.modal !== undefined ? x.modal : x.lvl !== 'info') && (!x.once || seen.indexOf(x.k) < 0)).map(x => { if (x.once) MIDS.push(x.k); return {lvl: x.lvl, html: x.html}; });
  let goReq = false;
  if (ROLE === 'U') {
    (ME.mine || []).filter(r => r[8] !== 'Pending' && seen.indexOf(r[0]) < 0).forEach(r => {
      MIDS.push(r[0]); const ok = r[8] === 'Approved';
      items.push({lvl: ok ? 'ok' : 'red', html: `<b>${esc(reqText(r))}</b> was <b>${r[8]}</b>.${r[9] ? '<br>' + esc(r[9]) : ''}`});
    });
  } else if (ME.pending > 0) {
    items.push({lvl: 'warn', html: `You have <b>${ME.pending}</b> pending request(s) waiting for review.`});
    goReq = true;
  }
  if (!items.length) return;
  $('#mbox').innerHTML = `<h3>${ROLE === 'M' ? 'Pending Actions' : 'Important Updates'}</h3>${items.map(x => `<div class="alert ${x.lvl}" style="margin:0 0 10px"><div>${x.html}</div></div>`).join('')}<button class="btn" onclick="closeModal(${goReq})">${goReq ? 'View Requests' : 'OK, Got It'}</button>`;
  $('#modal').style.display = 'flex';
}
function closeModal(goReq) {
  $('#modal').style.display = 'none'; if (MIDS.length) addSeen(MIDS); MIDS = [];
  if (goReq) go('req');
}

// ---------- Member: Requests (Payment, General Request, Grace & History + Stored Notices) ----------
const badgeOf = s => s === 'Approved' ? 'pos' : s === 'Rejected' ? 'neg' : 'warn';
async function vReq() {
  try { ME = await rc('me', U, P, TOK); } catch (e) { return err(e); }
  renderAlerts();
  const others = I.names.filter(n => n !== U), mine = ME.mine || [], pendGrace = mine.some(r => r[3] === 'grace' && r[8] === 'Pending');
  const advs = ME.adv || [];
  const allNotices = (ME.nt || []);
  const disSaved = getDisNt();

  const advCard = advs.length ? `<div class="card"><h3>Advance Requests</h3><p class="sub">The manager requested advance payment.</p>${advs.map(a => `<div class="row" style="cursor:default"><div><b>${tk(a[1])}</b><small>Due by ${fmt(a[2])}${a[3] ? ' · ' + esc(a[3]) : ''}</small></div><button class="btn sm" style="flex:0 0 auto" onclick="payAdv('${a[0]}')">Pay Now</button></div>`).join('')}</div>` : '';

  const noticesBox = `<div class="card">
    <h3>All Notices / সব নোটিশ</h3>
    <p class="sub">All notices remain here; click <b>×</b> to remove a notice from your view.<span class="bn-note">সব নোটিশ এখানে জমা থাকে; চাইলে × চেপে কেটে দিতে পারেন।</span></p>
    ${allNotices.length ? allNotices.map(x => {

        <div><b>${esc(x[1])}</b><small>Until ${fmt(x[2])}${isHidden ? ' · Dismissed from top' : ''}</small></div>
        <button class="btn sm red" onclick="dis('${nid}',true);vReq()">×</button>
      </div>`;
    }).join('') : '<div class="empty">No notices right now</div>'}
  </div>`;

  wrap(`${advCard}
  <div class="card">
    <div class="p-head">
      <div><h2>Submit Payment Info / টাকা জমার তথ্য</h2><p class="sub" style="margin:0">Report money you paid to the manager.<span class="bn-note">টাকা দিলে তথ্য পাঠান; ম্যানেজার অ্যাপ্রুভ করলে হিসাবে যুক্ত হবে।</span></p></div>
      ${rulesBtn('req')}
    </div>
    ${PRE ? '<div class="alert info" style="margin:0 0 8px">Paying requested advance amount.</div>' : ''}
    ${ME.due > 0 ? `<div class="banner neg"><span>Unpaid Due / বকেয়া</span><b>${tk(ME.due)}</b></div>` : ''}
    <label>Amount Paid (৳)</label><input id="pa" type="number" inputmode="decimal" min="0" value="${PRE ? PRE.amount : ME.due > 0 ? ME.due : ''}">
    <label>Payment Date</label><input id="pd" type="date" value="${ME.today}">
    <label>Paid To</label><select id="pt"><option value="Manager">Mess Manager</option>${others.map(n => `<option>${esc(n)}</option>`).join('')}</select>
    <label>Note (Optional)<div class="hint">e.g. bKash, Nagad, Cash</div></label><input id="pn" value="${PRE ? esc(PRE.note) : ''}">
    <button class="btn" onclick="payReview()">Continue</button>
  </div>

  <div class="card">
    <h3>Send Request to Manager / ম্যানেজারকে রিকোয়েস্ট</h3>
    <p class="sub">Send a general request or ask for a grace period.<span class="bn-note">সাধারণ রিকোয়েস্ট বা গ্রেস পিরিয়ডের আবেদন পাঠান।</span></p>
    <label>Your Request</label><textarea id="greq_txt" maxlength="300" placeholder="Write your request clearly..."></textarea>
    <button class="btn sec" onclick="sendGenReq()">Send Request to Manager</button>
    ${ME.blocked ? `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--b)"><b>Account Frozen — Need Grace Period?</b>${pendGrace ? '<div style="margin-top:6px"><span class="badge warn">Grace request pending</span></div>' : '<button class="btn sec" onclick="askGrace()">Request Grace Period</button>'}</div>` : ''}
  </div>

  ${noticesBox}

  <div class="card">

      return `<div class="row" style="cursor:default"><div><b>${title}</b>${r[9] ? `<small style="color:${r[8] === 'Rejected' ? '#dc2626' : '#166534'}">${esc(r[9])}</small>` : ''}</div><span class="badge ${badgeOf(r[8])}">${STL[r[8]]}</span></div>`;

function payReview() {
  const d = {amount: $('#pa').value, date: $('#pd').value, paidTo: $('#pt').value, note: $('#pn').value.trim(), ref: PRE ? PRE.ref : ''};
  if (!(Number(d.amount) > 0) || !d.date) return toast('Please enter amount and date', 1);
  wrap(`<div class="card"><h3>Review Payment</h3><table><tr><td>Amount</td><td><b>${tk(d.amount)}</b></td></tr><tr><td>Date</td><td><b>${fmt(d.date)}</b></td></tr><tr><td>Paid To</td><td><b>${esc(d.paidTo)}</b></td></tr>${d.note ? `<tr><td>Note</td><td><b>${esc(d.note)}</b></td></tr>` : ''}</table>
  <button class="btn" id="pc">Confirm & Send</button><button class="btn sec" onclick="vReq()">Edit</button></div>`);
  $('#pc').onclick = () => run('request', U, P, 'pay', d, TOK).then(() => { PRE = null; toast('Payment request sent'); vReq(); }).catch(err);
}
const sendGenReq = () => {
  const note = $('#greq_txt').value.trim();
  if (!note) return toast('Please write your request first', 1);
  run('request', U, P, 'general', {note}, TOK).then(() => { toast('Request sent to manager'); vReq(); }).catch(err);
};
const askGrace = () => run('request', U, P, 'grace', {}, TOK).then(() => { toast('Grace request sent'); vReq(); }).catch(err);

// ---------- Manager: Requests (With Mandatory Rejection Reason) ----------
async function vMgrReq() {
  try { RQ = await M('reqs'); } catch (e) { return err(e); }
  const pend = RQ.reqs.filter(x => x[8] === 'Pending'), done = RQ.reqs.filter(x => x[8] !== 'Pending').slice(0, 15);
  ME.pending = pend.length + RQ.signups.length; lastPend = ME.pending; setBell();
  const none = !pend.length && !RQ.signups.length;
  wrap(`<div class="card"><h2>Requests / রিকোয়েস্ট ও অ্যাপ্রুভাল</h2><p class="sub">Approve or reject member requests. A reason is required when rejecting.<span class="bn-note">বাতিল করলে অবশ্যই কারণ লিখতে হবে।</span></p>${none ? '<div class="empty">No pending requests 🎉</div>' : ''}</div>
  ${RQ.signups.length ? `<div class="card"><h3>New Member Signups (${RQ.signups.length})</h3>${RQ.signups.map((s, i) => `<div class="row" style="cursor:default"><div><b>${esc(s.name)}</b><small>${esc(s.phone || 'No phone')}</small></div><div class="flex" style="flex:0 0 auto"><button class="btn sm" onclick="rqSign(${i},'approve')">Approve</button><button class="btn sm red" onclick="rqSign(${i},'reject')">Reject</button></div></div>`).join('')}</div>` : ''}
  ${pend.map(r => {
    if (r[3] === 'pay') {
      return `<div class="card"><div class="flex" style="justify-content:space-between"><h3 style="margin:0;flex:1">💰 Payment from ${esc(r[2])}</h3><span class="badge warn" style="flex:0 0 auto">Pending</span></div>
        <table style="margin-top:8px"><tr><td>Amount</td><td><b>${tk(r[4])}</b></td></tr><tr><td>Paid To</td><td>${esc(r[6] || '-')}</td></tr><tr><td>Date</td><td>${fmt(r[5])}</td></tr>${r[7] ? `<tr><td>Note</td><td>${esc(r[7])}</td></tr>` : ''}</table>
        <label>Amount to Approve (৳)</label><input id="ra_${r[0]}" type="number" inputmode="decimal" value="${esc(r[4])}">
        <div class="flex" style="margin-top:12px"><button class="btn" style="margin:0" onclick="rqPay('${r[0]}',true)">Approve</button><button class="btn red" style="margin:0" onclick="rqPay('${r[0]}',false)">Reject</button></div></div>`;
    } else if (r[3] === 'grace') {
      return `<div class="card"><div class="flex" style="justify-content:space-between"><h3 style="margin:0;flex:1">⏳ Grace Request from ${esc(r[2])}</h3><span class="badge warn" style="flex:0 0 auto">Pending</span></div>
        <p class="sub" style="margin-top:6px">Frozen due to unpaid dues. Sent: ${esc(r[1])}</p>
        <div class="flex"><button class="btn" style="margin:0" onclick="rqGrace('${r[0]}',1)">Allow 1 Day</button><button class="btn" style="margin:0" onclick="rqGrace('${r[0]}',2)">Allow 2 Days</button></div>
        <button class="btn red" onclick="rqGrace('${r[0]}',0)">Reject</button></div>`;
    } else {
      return `<div class="card"><div class="flex" style="justify-content:space-between"><h3 style="margin:0;flex:1">📩 Request from ${esc(r[2])}</h3><span class="badge warn" style="flex:0 0 auto">Pending</span></div>
        <p style="margin:8px 0;font-weight:500">${esc(r[7])}</p>
        <label>Reply / Note (Optional)</label><input id="rr_${r[0]}" placeholder="e.g. Noted, will adjust">
        <div class="flex" style="margin-top:12px"><button class="btn" style="margin:0" onclick="rqGen('${r[0]}',true)">Approve</button><button class="btn red" style="margin:0" onclick="rqGen('${r[0]}',false)">Reject</button></div></div>`;
    }
  }).join('')}
  ${done.length ? `<div class="card"><h3>Recent Decisions</h3>${done.map(r => `<div class="row" style="cursor:default"><div><b>${esc(r[2])}</b> · ${r[3] === 'pay' ? 'Payment ' + tk(r[4]) : r[3] === 'grace' ? 'Grace Request' : esc(r[7])}<small>${esc(r[9] || '')}</small></div><span class="badge ${badgeOf(r[8])}">${STL[r[8]]}</span></div>`).join('')}</div>` : ''}`);
}

const rqSign = (i, a) => M(a, {name: RQ.signups[i].name}).then(async () => { toast(a === 'approve' ? 'Member approved' : 'Signup rejected'); I = stamp(await run('init')); vMgrReq(); }).catch(err);
const rqPay = (id, ok) => {
  let reason = '';
  if (!ok) {
    reason = prompt('Enter reason for rejecting this payment request (বাতিল করার কারণ লিখুন):');
    if (reason === null) return;
    if (!reason.trim()) return toast('Rejection reason is required', 1);
  }
  M('decide', {id, ok, amount: ok ? $('#ra_' + id).value : 0, reason}).then(() => { toast(ok ? 'Payment approved' : 'Request rejected'); vMgrReq(); }).catch(err);
};
const rqGrace = (id, n) => {
  let reason = '';
  if (!n) {
    reason = prompt('Enter reason for rejecting this grace request (বাতিল করার কারণ লিখুন):');
    if (reason === null) return;
    if (!reason.trim()) return toast('Rejection reason is required', 1);
  }
  M('decide', {id, ok: n > 0, days: n, reason}).then(() => { toast(n ? n + ' day(s) grace granted' : 'Request rejected'); vMgrReq(); }).catch(err);
};
const rqGen = (id, ok) => {
  let reason = '';
  if (!ok) {
    reason = prompt('Enter reason for rejecting this request (বাতিল করার কারণ লিখুন):');
    if (reason === null) return;
    if (!reason.trim()) return toast('Rejection reason is required', 1);
  }
  M('decide', {id, ok, reply: ok ? $('#rr_' + id).value.trim() : '', reason}).then(() => { toast(ok ? 'Request approved' : 'Request rejected'); vMgrReq(); }).catch(err);
};

// ---------- Bazar Duty ----------
async function vDuty(bar = '') {
  try { ME = await rc('me', U, P, TOK); } catch (e) { return err(e); }
  renderAlerts();
  const t = ME.today || I.today, l = ME.duties || [];
  wrap(`${bar}${ROLE === 'M' ? `<div class="card"><div class="p-head"><div><h3>Assign Bazar Duty / বাজার ডিউটি দিন</h3><p class="sub" style="margin:0">Assign bazar duty dates to members.</p></div>${rulesBtn('duty')}</div>
  <label>Member</label><select id="dm">${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
  <div class="flex"><div><label>From</label><input type="date" id="df" value="${t}"></div><div><label>To</label><input type="date" id="dt" value="${t}"></div></div>
  <button class="btn" onclick="dutyAdd()">Add to Schedule</button></div>` : ''}
  <div class="card"><div class="p-head"><div><h2>Bazar Duty Schedule / বাজারের শিডিউল</h2><p class="sub" style="margin:0">Assigned bazar periods and remaining days.<span class="bn-note">নির্ধারিত বাজারের তারিখ ও বাকি দিন দেখুন।</span></p></div>${ROLE !== 'M' ? rulesBtn('duty') : ''}</div>${l.length ? l.map(d => { const st = dutyStatusInfo(d, t), me = d[1] === U; return `<div class="row" style="cursor:default${me ? ';background:#f0fdfa;border-radius:10px;padding:11px 8px' : ''}"><div><b>${esc(d[1])}${me ? ' (You)' : ''}</b><small>${fmt(d[2])} to ${fmt(d[3])} · ${esc(st.detail)}</small></div><div style="display:flex;gap:6px;align-items:center;flex:0 0 auto"><span class="badge ${st.badgeClass}">${st.badgeText}</span>${ROLE === 'M' ? `<button class="btn sm red" onclick="dutyDel('${d[0]}')">Remove</button>` : ''}</div></div>`; }).join('') : '<div class="empty">No bazar duties scheduled</div>'}</div>`);
}
const dutyAdd = () => { const d = {member: $('#dm').value, from: $('#df').value, to: $('#dt').value}; if (!d.from || !d.to || d.to < d.from) return toast('Please enter valid dates', 1); M('dutyAdd', d).then(() => { toast('Duty added'); VIEWS[CUR](); }).catch(err); };
const dutyDel = id => confirm('Remove this duty?') && M('dutyDel', {id}).then(() => { toast('Removed'); VIEWS[CUR](); }).catch(err);

// ---------- Advance Requests ----------
function payAdv(id) {
  const a = (ME.adv || []).find(x => x[0] === id); if (!a) return toast('This request is no longer open', 1);
  PRE = {amount: a[1], ref: id, note: 'Advance'}; go('req', 'pay');
}
async function vAdv(bar = '') {
  let l; try { l = await M('adv'); } catch (e) { return err(e); }
  const t = ME.today || I.today, open = l.filter(r => r[6] === 'Open'), paid = l.filter(r => r[6] === 'Paid').slice(0, 10);
  wrap(`${bar}<div class="card"><h2>Request Advance Payment</h2><p class="sub">Ask members to pay in advance for bazar or bills.</p>
  <label>Select Members</label>
  <label class="chk"><input type="checkbox" checked onchange="document.querySelectorAll('.am').forEach(c => c.checked = this.checked)"> <b>Select All</b></label>
  ${I.names.map(n => `<label class="chk"><input type="checkbox" class="am" value="${esc(n)}" checked> ${esc(n)}</label>`).join('') || '<div class="empty">No active members</div>'}
  <label>Amount per Member (৳)</label><input id="aa" type="number" inputmode="decimal" min="0" placeholder="e.g. 2000">
  <label>Due Date</label><input id="ad" type="date" value="${addD(t, 7)}">
  <label>Note (Optional)</label><input id="an" placeholder="e.g. Monthly bazar advance">
  <button class="btn" onclick="advReview()">Review Request</button></div>
  <div class="card"><h3>Pending Advance (${open.length})</h3>${open.length ? `<p class="sub">Total Requested: ${tk(open.reduce((a, r) => a + Number(r[3]), 0))}</p>` + open.map(r => { const od = r[4] < t; return `<div class="row" style="cursor:default;flex-wrap:wrap"><div><b>${esc(r[2])}</b><small>${tk(r[3])} · Due ${fmt(r[4])}${r[5] ? ' · ' + esc(r[5]) : ''}</small></div><div style="display:flex;gap:6px;align-items:center;flex:0 0 auto"><span class="badge ${od ? 'neg' : 'warn'}">${od ? 'Overdue' : 'Pending'}</span><button class="btn sm sec" onclick="advAct('advDone','${r[0]}')">Mark Paid</button><button class="btn sm red" onclick="advAct('advDel','${r[0]}')">Cancel</button></div></div>`; }).join('') : '<div class="empty">No pending advance requests</div>'}</div>
  ${paid.length ? `<div class="card"><h3>Recently Paid</h3>${paid.map(r => `<div class="row" style="cursor:default"><div><b>${esc(r[2])}</b><small>${fmt(r[4])}${r[5] ? ' · ' + esc(r[5]) : ''}</small></div><span class="badge pos">Paid</span></div>`).join('')}</div>` : ''}`);
}
function advReview() {
  const names = Array.from(document.querySelectorAll('.am')).filter(c => c.checked).map(c => c.value);
  const d = {members: names, amount: $('#aa').value, due: $('#ad').value, note: $('#an').value.trim()};
  if (!names.length) return toast('Please select at least one member', 1);
  if (!(Number(d.amount) > 0) || !d.due) return toast('Please enter amount and due date', 1);
  wrap(`<div class="card"><h3>Review Advance Request</h3><table><tr><td>Members (${names.length})</td><td><b>${names.map(esc).join(', ')}</b></td></tr><tr><td>Amount Each</td><td><b>${tk(d.amount)}</b></td></tr><tr><td>Total Amount</td><td><b>${tk(Number(d.amount) * names.length)}</b></td></tr><tr><td>Due Date</td><td><b>${fmt(d.due)}</b></td></tr>${d.note ? `<tr><td>Note</td><td><b>${esc(d.note)}</b></td></tr>` : ''}</table>
  <button class="btn" id="advc">Send Request</button><button class="btn sec" onclick="vDB()">Edit</button></div>`);
  $('#advc').onclick = () => M('advAdd', d).then(n => { toast('Advance request sent to ' + n + ' member(s)'); vDB(); }).catch(err);
}
const advAct = (a, id) => (a === 'advDone' || confirm('Cancel this advance request?')) && M(a, {id}).then(() => { toast(a === 'advDone' ? 'Marked as paid' : 'Request cancelled'); vDB(); }).catch(err);

// ---------- Notices & Mess Closure ----------
async function vAnn(bar = '', mode = 'nt') {
  let nt, mo; try { [nt, mo] = await Promise.all([M('nt'), M('mo')]); } catch (e) { return err(e); }
  const t = ME.today || I.today, act = nt.filter(r => r[3] >= t), up = mo.filter(r => r[4] >= t).sort((a, b) => a[2] < b[2] ? -1 : 1);
  const shSel = (id, v) => `<select id="${id}"><option value="L" ${v === 'L' ? 'selected' : ''}>${SH.L}</option><option value="D" ${v === 'D' ? 'selected' : ''}>${SH.D}</option></select>`;

  const ntCard = `<div class="card"><h2>Publish Notice / নোটিশ প্রকাশ</h2><p class="sub">All notices remain saved for members and can be dismissed by members anytime.<span class="bn-note">সব নোটিশ জমা থাকে এবং মেম্বার চাইলে নিজের ভিউ থেকে কাটতে পারে।</span></p>
  <label>Message</label><textarea id="nt_t" maxlength="300" placeholder="e.g. Cook will be absent tomorrow morning."></textarea>
  <label>Duration</label><select id="nt_d"><option value="1">1 Day (Today)</option><option value="3" selected>3 Days</option><option value="7">7 Days</option><option value="14">14 Days</option></select>
  <button class="btn" onclick="ntSend()">Publish Notice</button>
  ${act.length ? `<h3 style="margin-top:18px">Active Notices (${act.length})</h3>${act.map(r => `<div class="row" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:60%">${esc(r[2])}<small>Until ${fmt(r[3])}</small></div><button class="btn sm red" onclick="ntDel('${r[0]}')">Delete</button></div>`).join('')}` : ''}</div>`;

  const moCard = `<div class="card"><h2>Announce Mess Closure / মেস বন্ধ ঘোষণা</h2><p class="sub">Meals during closure are automatically excluded from billing.</p>
  <label>From</label><div class="flex"><input type="date" id="mo_f" value="${t}">${shSel('mo_fs', 'L')}</div>
  <label>To</label><div class="flex"><input type="date" id="mo_t" value="${t}">${shSel('mo_ts', 'L')}</div>
  <label>Reason (Optional)</label><input id="mo_n" maxlength="100" placeholder="e.g. Eid Holidays">
  <button class="btn red" onclick="moAdd()">Announce Closure</button>
  ${up.length ? `<h3 style="margin-top:18px">Scheduled Closures</h3>${up.map(r => `<div class="row" style="cursor:default;flex-wrap:wrap"><div style="flex:1;min-width:60%">${moTxt([r[0], r[2], r[3], r[4], r[5], r[6]])}</div><button class="btn sm sec" onclick="moDel('${r[0]}')">Cancel</button></div>`).join('')}` : ''}</div>`;

  wrap(bar + (mode === 'mo' ? moCard : ntCard));
}
const ntSend = () => { const d = {text: $('#nt_t').value.trim(), days: $('#nt_d').value}; if (!d.text) return toast('Please write a message', 1); M('ntAdd', d).then(() => { toast('Notice published'); vNC(); }).catch(err); };
const ntDel = id => confirm('Delete this notice?') && M('ntDel', {id}).then(() => { toast('Notice deleted'); vNC(); }).catch(err);
const moAdd = () => {
  const d = {from: $('#mo_f').value, fromShift: $('#mo_fs').value, to: $('#mo_t').value, toShift: $('#mo_ts').value, note: $('#mo_n').value.trim()};
  if (!d.from || !d.to) return toast('Please select dates', 1);
  if (d.to < d.from || (d.to === d.from && d.fromShift === 'D' && d.toShift === 'L')) return toast('End must be after start', 1);
  M('moAdd', d).then(() => { toast('Mess closure announced'); vNC(); }).catch(err);
};
const moDel = id => confirm('Cancel this closure?') && M('moDel', {id}).then(() => { toast('Cancelled'); vNC(); }).catch(err);

// ---------- Fast View Cache & Views Registry ----------
const RO = {init: 1, boot: 1, login: 1, me: 1, report: 1, daily: 1, myOffs: 1};

// ---------- Corner Tab: All Notice ----------
async function vAllNotice() {
  try { ME = await rc('me', U, P, TOK); } catch (e) { return err(e); }
  renderAlerts();
  const t = ME.today || I.today;
  const allNt = ME.nt || [];
  const allMo = ME.mo || [];
  const disSaved = getDisNt();

  const ntHtml = allNt.length
    ? allNt.map(x => {
        const nid = 'nt_' + x[0];
        const isHidden = disSaved.indexOf(nid) >= 0;
        return `<div class="nt-item ${isHidden ? 'dim' : ''}">
          <div class="nt-item-body">
            <b>📢 ${esc(x[1])}</b>
            <small>Valid until ${fmt(x[2])}${isHidden ? ' · Hidden from top banner' : ''}</small>
          </div>
          <button class="btn sm red" title="Remove notice" onclick="dis('${nid}',true);vAllNotice()">×</button>
        </div>`;
      }).join('')
    : '<div class="empty">No notices available right now.</div>';

  const moHtml = allMo.length
    ? allMo.map(m => {
        const mid = 'mo_' + m[0];
        const isHidden = disSaved.indexOf(mid) >= 0;
        return `<div class="nt-item ${isHidden ? 'dim' : ''}">
          <div class="nt-item-body">
            <b>🔕 Mess Closure</b>
            <small>${esc(moTxt(m))}${isHidden ? ' · Hidden from top banner' : ''}</small>
          </div>
          <button class="btn sm red" title="Remove notice" onclick="dis('${mid}',true);vAllNotice()">×</button>
        </div>`;
      }).join('')
    : '<div class="empty">No mess closure notices.</div>';

  const dutyNt = (ME.duties || []).filter(d => d[1] === U && d[3] >= t).map(d => {
    const st = dutyStatusInfo(d, t);
    return `<div class="nt-item">
      <div class="nt-item-body">
        <b>🛒 Your Bazar Duty (${fmt(d[2])} → ${fmt(d[3])})</b>
        <small>${esc(st.detail)}</small>
      </div>
      <span class="badge ${st.badgeClass}">${st.badgeText}</span>
    </div>`;
  }).join('');

  wrap(`
    <div class="card">
      <div class="p-head">
        <div>
          <h2>All Notice / সব নোটিশ</h2>
          <p class="sub" style="margin:0">Every notice stays saved here. Tap <b>×</b> to remove any notice.<span class="bn-note">সব নোটিশ এখানে জমা থাকে; চাইলে × চেপে কেটে দিতে পারেন।</span></p>
        </div>
        ${ROLE === 'M' ? `<button class="btn sm" onclick="go('nc')">+ Publish</button>` : ''}
      </div>
      <h3>📢 Manager Notices (${allNt.length})</h3>
      ${ntHtml}
    </div>
    ${dutyNt ? `<div class="card"><h3>🛒 Bazar Duty Reminders</h3>${dutyNt}</div>` : ''}
    <div class="card">
      <h3>🔕 Mess Closure Notices (${allMo.length})</h3>
      ${moHtml}
    </div>
  `);
}

const VIEWS = {
  rep: vRep,
  act: vAct,
  today: vToday,
  off: () => form('off', '', true, 'off'),
  guest: () => form('guest', '', false, 'guest'),
  baz: () => form('baz', '', false, 'bazar'),
  duty: () => vDuty(''),
  req: () => ROLE === 'M' ? vMgrReq() : vReq(),
  ent: vEnt,
  db: vDB,
  nc: vNC,
  ms: vMS,
  dir: vDir,
  allnt: vAllNotice
};
const typing = () => { const e = document.activeElement; return !!(e && /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && $('#v').contains(e)); };
const rc = (fn, ...a) => {
  const k = fn + JSON.stringify(a), hit = VC[k], tab = CUR, get = () => call(fn, a).then(d => (VC[k] = d));
  if (hit === undefined) { load(1, 'Loading...'); return get().finally(() => load(-1)); }
  get().then(d => { if (JSON.stringify(d) !== JSON.stringify(hit) && CUR === tab && !typing() && VIEWS[tab]) VIEWS[tab](); }).catch(() => {});
  return Promise.resolve(hit);
};

start();
</script>
</body></html>
