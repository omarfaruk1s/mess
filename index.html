<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মেস ম্যানেজার</title>
<style>
:root{--g:#0f766e;--g2:#115e59;--bg:#eef3f2;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--r:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Nirmala UI",sans-serif;background:var(--bg);color:var(--t);-webkit-tap-highlight-color:transparent;line-height:1.5}
.bar{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bar b{font-size:18px}.bar small{opacity:.85;display:block;font-size:12px}
.bar button{background:#ffffff26;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px}
#load{display:none;position:fixed;inset:0;background:#0f172a40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;align-items:center;justify-content:center}
#load .box{background:#fff;border-radius:20px;padding:22px 28px 20px;text-align:center;box-shadow:0 10px 40px #0003;width:260px;animation:pop .2s ease-out}
#load .emo{font-size:46px;line-height:1;display:inline-block;animation:hop .55s ease-in-out infinite alternate}
#load .sh{width:34px;height:6px;border-radius:50%;background:#0f172a1f;margin:6px auto 12px;animation:shd .55s ease-in-out infinite alternate}
#load b{display:block;font-size:17px}
#load .fun{display:block;color:var(--g);margin-top:4px;font-size:13px;font-weight:600;min-height:20px}
#load .tr{height:4px;border-radius:4px;background:#ccfbf1;margin:14px 0 0;overflow:hidden}
#load .tr i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--g),#5eead4);animation:sl 1s ease-in-out infinite}
#load small{display:block;color:var(--m);margin-top:10px;font-size:12px;min-height:16px}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes shd{from{transform:scaleX(1);opacity:1}to{transform:scaleX(.6);opacity:.5}}
@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
#tabs button{white-space:nowrap;border:1px solid var(--b);background:#f8fafc;color:#334155;border-radius:20px;padding:8px 14px;font-size:14px}
#tabs button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0f172a14}
h2{margin:0 0 4px;font-size:19px}h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--m);font-size:13px;margin:0 0 8px}
label{display:block;margin:12px 0 5px;font-size:13px;font-weight:600;color:#334155}
.hint{font-weight:400;color:var(--m);font-size:12px;margin-top:3px}
input,select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--g)}
.btn{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;margin-top:16px;font-family:inherit}
.btn.sec{background:#e2e8f0;color:#1e293b}.btn.red{background:var(--r)}.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0}
.link{background:none;border:0;color:var(--g);font-size:14px;margin-top:14px;width:100%;padding:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#f1f5f9;border-radius:12px;padding:12px}.tile span{font-size:12px;color:var(--m)}.tile b{display:block;font-size:20px;margin-top:2px}
.banner{border-radius:12px;padding:14px;margin:12px 0;font-weight:600}
.banner.pos{background:#dcfce7;color:#166534}.banner.neg{background:#fee2e2;color:#991b1b}.banner b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{color:var(--m);font-weight:600;font-size:12px}td:last-child,th:last-child{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--b);cursor:pointer;gap:8px}
.row:last-child{border:0}.row small{color:var(--m);display:block}
.badge{border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.pos{background:#dcfce7;color:#166534}.badge.neg{background:#fee2e2;color:#991b1b}
.flex{display:flex;gap:8px;align-items:center}.flex>*{flex:1}
.empty{text-align:center;color:var(--m);padding:26px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:40;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--r)}
.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;font-weight:600;line-height:1.5}
.alert.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}.alert.info{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}.alert.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert a{text-decoration:underline;font-weight:700;cursor:pointer}.alert .x{background:none;border:0;font-size:22px;line-height:1;color:inherit;padding:0 2px;opacity:.7}
.badge.warn{background:#fef3c7;color:#92400e}.badge.gray{background:#f1f5f9;color:#475569}
#modal{display:none;position:fixed;inset:0;background:#0f172a8c;z-index:30;align-items:center;justify-content:center;padding:16px}
#mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px #0004}
.bar .ic{position:relative;font-size:16px;padding:6px 10px}#bc{position:absolute;top:-7px;right:-7px;background:#dc2626;color:#fff;border-radius:10px;font:700 11px/1 system-ui;padding:3px 6px;font-style:normal}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:8px 0;font-size:15px}.chk input{width:auto;transform:scale(1.25)}
.bn{display:block;font-size:.82em;font-weight:400;opacity:.85;line-height:1.35;margin-top:2px;text-transform:none;font-style:normal;letter-spacing:0}
button .bn{font-size:.76em;opacity:.92}#tabs .bn{font-size:10px}.badge .bn{font-size:10px}.alert .bn{font-weight:500}
@media print{#tabs,.bar,button,#toast,#al,#modal{display:none!important}}
</style></head><body>
<div id="load"><div class="box"><span class="emo" id="lemo">🍛</span><div class="sh"></div><b id="lmsg">লোড হচ্ছে...</b><span class="fun" id="lfun"></span><div class="tr"><i></i></div><small id="lsub"></small></div></div>
<div class="bar"><div><b id="title">মেস ম্যানেজার</b><small id="me"></small></div><div style="display:flex;gap:8px;align-items:center"><button id="bell" class="ic" title="অনুরোধ" style="display:none" onclick="go('req')">🔔<i id="bc" style="display:none"></i></button><button id="out" style="display:none" onclick="logout()">লগ আউট</button></div></div>
<div id="tabs" style="display:none"></div>
<div class="wrap" id="al" style="padding-top:0;padding-bottom:0"></div>
<div class="wrap" id="v"><div class="empty">লোড হচ্ছে...</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw_7rSc5kXsMjST6UexZniTrtwUeBWr_XBin1j_DrAP4Z6m33zbu_4kTcOoMVgTynVcjQ/exec';
const $ = s => document.querySelector(s);

// ---------- বাংলা সংখ্যা, তারিখ, সময় ----------
const bn = s => String(s);
const MON = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
const fmt = d => { if (!d) return '-'; const p = String(d).split('-'); return p.length < 3 ? d : bn(+p[2]) + ' ' + MON[+p[1] - 1] + ' ' + bn(p[0]); };
const f = x => bn((Math.round(x * 100) / 100).toLocaleString('en-US'));
const tk = x => '৳' + f(x);
function bnTime(t) {
  const h = +t.slice(0, 2), m = t.slice(3), h12 = h % 12 || 12;
  const per = h < 4 ? 'রাত' : h < 6 ? 'ভোর' : h < 12 ? 'সকাল' : h < 16 ? 'দুপুর' : h < 18 ? 'বিকেল' : h < 20 ? 'সন্ধ্যা' : 'রাত';
  return per + ' ' + bn(h12) + (m === '00' ? '' : ':' + bn(m)) + 'টা';
}
const SH = {L: 'লাঞ্চ', D: 'ডিনার'};
const STL = {Pending: 'অপেক্ষায়', Approved: 'অনুমোদিত', Rejected: 'বাতিল'};

// ---------- লোডিং ----------
let busy = 0, slow, fun, shown = 0;
const FUN = [['🍚', 'ভাত রান্না হচ্ছে...'], ['🛒', 'বাজার করা হচ্ছে...'], ['🧮', 'মিল গোনা হচ্ছে...'], ['🐟', 'মাছ ভাজা হচ্ছে...'], ['🥘', 'তরকারি নাড়া হচ্ছে...'], ['🧾', 'বিল মেলানো হচ্ছে...']];
const load = (d, msg) => {
  busy += d; const el = $('#load');
  if (busy > 0) {
    if (msg) $('#lmsg').textContent = msg;
    if (shown) return; shown = 1; $('#lsub').textContent = '';
    let k = Math.floor(Math.random() * FUN.length);
    const tick = () => { $('#lemo').textContent = FUN[k][0]; $('#lfun').textContent = FUN[k][1]; k = (k + 1) % FUN.length; };
    tick(); clearInterval(fun); fun = setInterval(tick, 1500); el.style.display = 'flex';
    clearTimeout(slow); slow = setTimeout(() => $('#lsub').textContent = 'একটু সময় লাগছে, অনুগ্রহ করে অপেক্ষা করুন...', 4000);
  } else { busy = 0; shown = 0; clearInterval(fun); clearTimeout(slow); el.style.display = 'none'; }
};
const MSG = {save: 'সংরক্ষণ হচ্ছে...', signup: 'অনুরোধ পাঠানো হচ্ছে...', login: 'লগইন হচ্ছে...', setReturn: 'সংরক্ষণ হচ্ছে...', request: 'অনুরোধ পাঠানো হচ্ছে...', boot: 'লগইন হচ্ছে...'};
const READ_ACTS = ['lists', 'reqs', 'adv', 'mo', 'nt'];
const call = (fn, a) => fetch(API + '?fn=' + fn + '&a=' + encodeURIComponent(JSON.stringify(a))).then(r => r.json())
  .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
  .catch(e => { throw new Error(/fetch|network/i.test(e.message) ? 'ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না। অনুগ্রহ করে আবার চেষ্টা করুন।' : e.message); });
const run = (fn, ...a) => { if (!RO[fn] && !(fn === 'mgr' && READ_ACTS.indexOf(a[2]) >= 0)) VC = {}; load(1, MSG[fn] || (fn === 'mgr' && READ_ACTS.indexOf(a[2]) < 0 ? 'সংরক্ষণ হচ্ছে...' : 'লোড হচ্ছে...')); return call(fn, a).finally(() => load(-1)); };
const runQ = (fn, ...a) => call(fn, a);
const toast = (m, bad) => { const t = $('#toast'); t.textContent = m; t.className = (bad ? 'bad ' : '') + 'show'; clearTimeout(window._t); window._t = setTimeout(() => t.className = bad ? 'bad' : '', 3600); };
const err = e => toast(e.message, 1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const wrap = h => { $('#v').innerHTML = h; window.scrollTo(0, 0); };
const stamp = d => (d.t0 = Date.now(), d);
let U, P, ROLE, I, NAMES = [], D, LM;

// ---------- শুরু / লগইন / অ্যাকাউন্ট খোলা ----------
function start() {
  run('init').then(d => { I = stamp(d); $('#title').textContent = d.mess; const s = loadSess(); if (s) return doLogin(s.U, s.P, true); showLogin(); })
    .catch(e => wrap(`<div class="card empty">${esc(e.message)}<button class="btn" onclick="start()">আবার চেষ্টা করুন</button></div>`));
}
function showLogin() {
  wrap(`<div class="card"><h2>স্বাগতম</h2><p class="sub">চালিয়ে যেতে লগইন করুন</p>
  <label>আপনার নাম</label><select id="u"><option value="__manager">ম্যানেজার</option>${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
  <label>৪ সংখ্যার পিন</label><input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="login()">লগইন</button>
  <button class="link" onclick="showSignup()">নতুন সদস্য? অ্যাকাউন্ট খুলুন</button></div>`);
}
const SK = 'mess_session';
const loadSess = () => { try { const s = JSON.parse(localStorage.getItem(SK)); return s && s.U && /^\d{4}$/.test(s.P) ? s : null; } catch (e) { return null; } };
const saveSess = () => { try { localStorage.setItem(SK, JSON.stringify({U, P})); } catch (e) {} };
const clearSess = () => { try { localStorage.removeItem(SK); } catch (e) {} };
const logout = () => { clearSess(); location.reload(); };
function login() {
  const u = $('#u').value, p = $('#p').value;
  if (!/^\d{4}$/.test(p)) return toast('অনুগ্রহ করে আপনার ৪ সংখ্যার পিন দিন', 1);
  doLogin(u, p);
}
function doLogin(u, p, silent) {
  U = u; P = p;
  return run('boot', U, P).then(b => {
    ROLE = b.role; I = stamp(b.init); ME = b.me; VC = {};
    VC['me' + JSON.stringify([U, P])] = b.me; VC['report' + JSON.stringify([U, P])] = b.rep;
    $('#me').textContent = ROLE === 'M' ? 'ম্যানেজার' : U; $('#out').style.display = '';
    saveSess(); buildTabs(); afterLogin(); go('rep');
  }).catch(e => {
    if (!silent) return err(e);
    if (/ইন্টারনেট/.test(e.message)) return wrap(`<div class="card empty">${esc(e.message)}<button class="btn" onclick="start()">আবার চেষ্টা করুন</button></div>`);
    clearSess(); showLogin();
  });
}

function showSignup() {
  wrap(`<div class="card"><h2>অ্যাকাউন্ট খুলুন</h2><p class="sub">ম্যানেজার আপনার অনুরোধ অনুমোদন করবেন।</p>
  <label>পূর্ণ নাম</label><input id="sn" placeholder="যেমন: রহিম উদ্দিন">
  <label>নিজের জন্য ৪ সংখ্যার পিন বেছে নিন<div class="hint">এই পিন দিয়ে আপনি লগইন করবেন। যেমন: 4821</div></label><input id="sp" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="signReview()">এগিয়ে যান</button><button class="link" onclick="showLogin()">লগইনে ফিরে যান</button></div>`);
}
function signReview() {
  const n = $('#sn').value.trim(), p = $('#sp').value;
  if (n.length < 2) return toast('অনুগ্রহ করে আপনার নাম লিখুন', 1);
  if (!/^\d{4}$/.test(p)) return toast('পিন ৪ সংখ্যার হতে হবে', 1);
  wrap(`<div class="card"><h3>অনুগ্রহ করে তথ্যগুলো দেখে নিন</h3><table><tr><td>নাম</td><td><b>${esc(n)}</b></td></tr><tr><td>পিন</td><td><b>${esc(p)}</b></td></tr></table>
  <button class="btn" id="sc">নিশ্চিত করে অনুরোধ পাঠান</button><button class="btn sec" onclick="showSignup()">সম্পাদনা</button></div>`);
  $('#sc').onclick = () => run('signup', n, p).then(() => wrap(`<div class="card empty"><h2>অনুরোধ পাঠানো হয়েছে ✅</h2><p>অনুগ্রহ করে ম্যানেজারের অনুমোদনের জন্য অপেক্ষা করুন। অনুমোদনের পর নাম ও পিন দিয়ে লগইন করুন।</p><button class="btn" onclick="start()">লগইনে ফিরে যান</button></div>`)).catch(err);
}

// ---------- নেভিগেশন ----------
function buildTabs() {
  const t = [['rep', 'রিপোর্ট'], ['day', 'আজকের মিল'], ['off', 'মিল বন্ধ'], ['guest', 'গেস্ট মিল'], ['baz', 'বাজার'], ['duty', 'বাজারের পালা']];
  if (ROLE === 'M') t.splice(1, 0, ['req', 'অনুরোধ'], ['adv', 'অগ্রিম'], ['ann', 'ঘোষণা'], ['dep', 'জমা']), t.push(['mem', 'সদস্য'], ['bill', 'বিল'], ['mess', 'মেস'], ['ent', 'এন্ট্রি']); else t.splice(5, 0, ['pay', 'পেমেন্ট']);
  $('#tabs').style.display = ''; $('#tabs').innerHTML = t.map(x => `<button id="t_${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.id === 't_' + t));
  CUR = t; if (t !== 'pay') PRE = null; VIEWS[t]();
}

// ---------- এন্ট্রি ফর্ম ----------
const FORMS = {
  off: ['মিল বন্ধ', 'বাইরে থাকলে মিল বন্ধ রাখুন। আজ ও আগামী দিনের মিল বন্ধ করা যাবে।', [
    ['offDate', 'মিল বন্ধ শুরুর তারিখ', 'date'], ['offShift', 'কোন বেলা থেকে', 'shift'],
    ['onDate', 'আবার মিল চালুর তারিখ', 'date?', 'ফিরে আসার তারিখ জানা না থাকলে খালি রাখুন, পরে দিতে পারবেন।'], ['onShift', 'কোন বেলা থেকে', 'shift']]],
  guest: ['গেস্ট মিল', 'আপনার অতিথি খেলে এখানে লিখুন।', [
    ['date', 'তারিখ', 'date'], ['shift', 'কোন বেলা', 'shift'], ['count', 'অতিথির সংখ্যা', 'number', 'যেমন: ২']]],
  baz: ['বাজারের খরচ', 'আপনি যে বাজার করেছেন তার খরচ এখানে লিখুন।', [

let VC = {}, CUR = '';
const RO = {init: 1, boot: 1, login: 1, me: 1, report: 1, daily: 1, myOffs: 1};
const VIEWS = {off: () => form('off'), guest: () => form('guest'), baz: () => form('baz'), dep: () => form('dep'), req: vReq, adv: vAdv, ann: vAnn, pay: vPay, duty: vDuty, rep: vRep, day: vDay, mem: vMem, bill: vBill, mess: vMess, ent: vEnt};
const typing = () => { const e = document.activeElement; return !!(e && /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && $('#v').contains(e)); };
const rc = (fn, ...a) => {
  const k = fn + JSON.stringify(a), hit = VC[k], tab = CUR, get = () => call(fn, a).then(d => (VC[k] = d));
  if (hit === undefined) { load(1, 'লোড হচ্ছে...'); return get().finally(() => load(-1)); }
  get().then(d => { if (JSON.stringify(d) !== JSON.stringify(hit) && CUR === tab && !typing() && VIEWS[tab]) VIEWS[tab](); }).catch(() => {});
  return Promise.resolve(hit);
};

start();

    // rules

    [/^সব সক্রিয় সদস্য সমান ভাগে দেবেন।/, () => 'Shared equally among all active members.'],
    [/^এই পিন দিয়ে আপনি লগইন করবেন।/, () => 'You will log in with this PIN.'],
    [/^আপনার (.+) পেমেন্টের অনুরোধ অনুমোদিত হয়েছে।(?: (.+)।)?$/, m => 'Your ' + X(m[1]) + ' payment request was approved.' + tail(m[2], ' ')], [/^আপনার (.+) পেমেন্টের অনুরোধ অনুমোদিত হয়নি।$/, m => 'Your ' + X(m[1]) + ' payment request was not approved.'],
    [/^আপনার সময় চাওয়ার অনুরোধ অনুমোদিত হয়েছে।(?: (.+)।)?$/, m => 'Your grace period request was approved.' + tail(m[1], ' ')], [/^আপনার সময় চাওয়ার অনুরোধ অনুমোদিত হয়নি।$/, () => 'Your grace period request was not approved.'],

    [/^আপনার বাজারের পালা চলছে \((.+)\)। এখনো কোনো বাজার লেখা হয়নি।$/, m => 'Your bazar duty is running (' + X(m[1]) + '). No bazar has been recorded yet.'],
    [/^মেস বন্ধ থাকবে: (.+?)।\nসবাই এই বিষয়ে নোটিফিকেশন পাবেন। আপনি কি নিশ্চিত\?$/s, m => 'The mess will be closed: ' + X(m[1]) + '.\nEveryone will get a notification. Are you sure?']
  ];
  const tr = s => {
    if (/^যেমন/.test(s)) return null;                       // examples stay in Bangla
    if (E[s]) return E[s];
    for (const [re, f] of R) { const m = s.match(re); if (m) return f(m); }
    return null;
  };
  const seen = new WeakSet(), B = /[\u0980-\u09F2\u09F4-\u09FF]/;
  function proc(t) {
    if (seen.has(t)) return; seen.add(t);
    const p = t.parentNode; if (!p || !p.closest || p.closest('.bn,script,style,textarea')) return;
    const s = t.nodeValue.replace(/\s+/g, ' ').trim(); if (!s || !B.test(s)) return;
    let en = tr(s);
    if (en && s === 'সদস্য') en = p.closest('#tabs') ? 'Members' : 'Member';
    if (!en) return;
    if (p.tagName === 'OPTION') { t.nodeValue = en + ' · ' + s; return; }
    t.nodeValue = en + ' ';
    const sm = document.createElement('small'); sm.className = 'bn'; sm.textContent = s; t.after(sm);
  }
  function attrs(root) {
    const els = Array.from(root.querySelectorAll ? root.querySelectorAll('[placeholder]') : []); if (root.matches && root.matches('[placeholder]')) els.push(root);
    els.forEach(el => { if (el.dataset.pb) return; el.dataset.pb = 1; const v = el.getAttribute('placeholder'), e = B.test(v) ? tr(v) : null; if (e) el.setAttribute('placeholder', e + ' · ' + v); });
  }
  function walk(root) {
    if (!root) return;
    if (root.nodeType === 3) return proc(root);
    if (root.nodeType !== 1 || (root.closest && root.closest('.bn'))) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), l = []; let n;

    l.forEach(proc); attrs(root);
  }

  obs.observe(document.body, {childList: true, subtree: true});
  walk(document.body); obs.takeRecords();
  const oc = window.confirm.bind(window), op = window.prompt.bind(window);
  window.confirm = m => { const e = tr(String(m)); return oc(e ? e + '\n\n' + m : m); };
  window.prompt = (m, v) => { const e = tr(String(m)); return op(e ? e + '\n' + m : m, v); };
  window.__tr = tr;
})();
