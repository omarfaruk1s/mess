<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Manager</title>
<style>
:root{--g:#0f766e;--g2:#115e59;--bg:#eef3f2;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--r:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Nirmala UI",sans-serif;background:var(--bg);color:var(--t);-webkit-tap-highlight-color:transparent;line-height:1.5}
.bar{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bar b{font-size:18px}.bar small{opacity:.85;display:block;font-size:12px}
.bar button{background:#ffffff26;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:13px}
#load{display:none;position:fixed;inset:0;background:#0f172a40;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;align-items:center;justify-content:center}
#load .box{background:#fff;border-radius:20px;padding:22px 28px 20px;text-align:center;box-shadow:0 10px 40px #0003;width:260px;animation:pop .2s ease-out}
#load .emo{font-size:46px;line-height:1;display:inline-block;animation:hop .55s ease-in-out infinite alternate}
#load .sh{width:34px;height:6px;border-radius:50%;background:#0f172a1f;margin:6px auto 12px;animation:shd .55s ease-in-out infinite alternate}
#load b{display:block;font-size:17px}
#load .fun{display:block;color:var(--g);margin-top:4px;font-size:13px;font-weight:600;min-height:20px}
#load .tr{height:4px;border-radius:4px;background:#ccfbf1;margin:14px 0 0;overflow:hidden}
#load .tr i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,var(--g),#5eead4);animation:sl 1s ease-in-out infinite}
#load small{display:block;color:var(--m);margin-top:10px;font-size:12px;min-height:16px}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes shd{from{transform:scaleX(1);opacity:1}to{transform:scaleX(.6);opacity:.5}}
@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
#tabs button{white-space:nowrap;border:1px solid var(--b);background:#f8fafc;color:#334155;border-radius:20px;padding:8px 14px;font-size:14px}
#tabs button.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0f172a14}
h2{margin:0 0 4px;font-size:19px}h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--m);font-size:13px;margin:0 0 8px}
label{display:block;margin:12px 0 5px;font-size:13px;font-weight:600;color:#334155}
.hint{font-weight:400;color:var(--m);font-size:12px;margin-top:3px}
input,select,textarea{width:100%;padding:11px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-family:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #5eead4;border-color:var(--g)}
.btn{width:100%;background:var(--g);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;margin-top:16px;font-family:inherit}
.btn.sec{background:#e2e8f0;color:#1e293b}.btn.red{background:var(--r)}.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0}
.link{background:none;border:0;color:var(--g);font-size:14px;margin-top:14px;width:100%;padding:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#f1f5f9;border-radius:12px;padding:12px}.tile span{font-size:12px;color:var(--m)}.tile b{display:block;font-size:20px;margin-top:2px}
.banner{border-radius:12px;padding:14px;margin:12px 0;font-weight:600}
.banner.pos{background:#dcfce7;color:#166534}.banner.neg{background:#fee2e2;color:#991b1b}.banner b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{color:var(--m);font-weight:600;font-size:12px}td:last-child,th:last-child{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--b);cursor:pointer;gap:8px}
.row:last-child{border:0}.row small{color:var(--m);display:block}
.badge{border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.pos{background:#dcfce7;color:#166534}.badge.neg{background:#fee2e2;color:#991b1b}
.flex{display:flex;gap:8px;align-items:center}.flex>*{flex:1}
.empty{text-align:center;color:var(--m);padding:26px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:40;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--r)}
.alert{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;font-weight:600;line-height:1.5}
.alert.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}.alert.info{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}.alert.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.alert a{text-decoration:underline;font-weight:700;cursor:pointer}.alert .x{background:none;border:0;font-size:22px;line-height:1;color:inherit;padding:0 2px;opacity:.7}
.badge.warn{background:#fef3c7;color:#92400e}.badge.gray{background:#f1f5f9;color:#475569}
#modal{display:none;position:fixed;inset:0;background:#0f172a8c;z-index:30;align-items:center;justify-content:center;padding:16px}
#mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow:auto;box-shadow:0 10px 40px #0004}
.bar .ic{position:relative;font-size:16px;padding:6px 10px}#bc{position:absolute;top:-7px;right:-7px;background:#dc2626;color:#fff;border-radius:10px;font:700 11px/1 system-ui;padding:3px 6px;font-style:normal}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:8px 0;font-size:15px}.chk input{width:auto;transform:scale(1.25)}
.bn-sub{display:block;font-size:12px;font-weight:400;color:#64748b;margin-top:2px}
body:not(.bilingual-rep) .bn-sub{display:none}
@media print{#tabs,.bar,button,#toast,#al,#modal{display:none!important}}
</style></head><body>
<div id="load"><div class="box"><span class="emo" id="lemo">🍛</span><div class="sh"></div><b id="lmsg">Loading...</b><span class="fun" id="lfun"></span><div class="tr"><i></i></div><small id="lsub"></small></div></div>
<div class="bar"><div><b id="title">Mess Manager</b><small id="me"></small></div><div style="display:flex;gap:8px;align-items:center"><button id="bell" class="ic" title="Requests" style="display:none" onclick="go('req')">🔔<i id="bc" style="display:none"></i></button><button id="out" style="display:none" onclick="logout()">Log out</button></div></div>
<div id="tabs" style="display:none"></div>
<div class="wrap" id="al" style="padding-top:0;padding-bottom:0"></div>
<div class="wrap" id="v"><div class="empty">Loading...</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw_7rSc5kXsMjST6UexZniTrtwUeBWr_XBin1j_DrAP4Z6m33zbu_4kTcOoMVgTynVcjQ/exec';
const $ = s => document.querySelector(s);

const MON_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_BN = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
const fmt = d => {
  if (!d) return '-';
  const p = String(d).split('-');
  if (p.length < 3) return d;
  return `${+p[2]} ${MON_EN[+p[1] - 1] || p[1]} ${p[0]}`;
};
const fmtBi = d => {
  if (!d) return '-';
  const p = String(d).split('-');
  if (p.length < 3) return d;
  const en = `${+p[2]} ${MON_EN[+p[1] - 1] || p[1]} ${p[0]}`;
  const bn = `${+p[2]} ${MON_BN[+p[1] - 1] || p[1]} ${p[0]}`;
  return `${en} <span class="bn-sub">(${bn})</span>`;
};
const f = x => (Math.round(Number(x || 0) * 100) / 100).toLocaleString('en-US');
const tk = x => '৳' + f(x);
function enTime(t) {
  const h = +String(t || '00:00').slice(0, 2), m = String(t || '00:00').slice(3), h12 = h % 12 || 12;
  const ampm = h >= 12 ? 'PM' : 'AM';
  return `${h12}${m === '00' ? '' : ':' + m} ${ampm}`;
}
const SH = {L: 'Lunch', D: 'Dinner'};
const STL = {Pending: 'Pending', Approved: 'Approved', Rejected: 'Rejected'};

let busy = 0, slow, fun, shown = 0;
const FUN = [
  ['🍚', 'Cooking the rice...'],
  ['🛒', 'Going to the bazar...'],
  ['🧮', 'Counting the meals...'],
  ['🐟', 'Frying the fish...'],
  ['🥘', 'Stirring the curry...'],
  ['🧾', 'Matching the bills...']
];
const load = (d, msg) => {
  busy += d;
  const el = $('#load');
  if (busy > 0) {
    if (msg) $('#lmsg').textContent = msg;
    if (shown) return;
    shown = 1;
    $('#lsub').textContent = '';
    let k = Math.floor(Math.random() * FUN.length);
    const tick = () => {
      $('#lemo').textContent = FUN[k][0];
      $('#lfun').textContent = FUN[k][1];
      k = (k + 1) % FUN.length;
    };
    tick();
    clearInterval(fun);
    fun = setInterval(tick, 1500);
    el.style.display = 'flex';
    clearTimeout(slow);
    slow = setTimeout(() => $('#lsub').textContent = 'This is taking a little time. Please wait...', 4000);
  } else {
    busy = 0;
    shown = 0;
    clearInterval(fun);
    clearTimeout(slow);
    el.style.display = 'none';
  }
};
const MSG = {
  save: 'Saving...',
  signup: 'Sending request...',
  login: 'Logging in...',
  setReturn: 'Saving...',
  request: 'Sending request...',
  boot: 'Logging in...'
};
const READ_ACTS = ['lists', 'reqs', 'adv', 'mo', 'nt'];
const call = (fn, a) => fetch(API + '?fn=' + fn + '&a=' + encodeURIComponent(JSON.stringify(a)))
  .then(r => r.json())
  .then(j => { if (!j.ok) throw new Error(j.error); return j.data; })
  .catch(e => {
    throw new Error(/fetch|network/i.test(e.message) ? 'No internet connection. Please try again.' : e.message);
  });
const run = (fn, ...a) => {
  if (!RO[fn] && !(fn === 'mgr' && READ_ACTS.indexOf(a[2]) >= 0)) VC = {};
  load(1, MSG[fn] || (fn === 'mgr' && READ_ACTS.indexOf(a[2]) < 0 ? 'Saving...' : 'Loading...'));
  return call(fn, a).finally(() => load(-1));
};
const runQ = (fn, ...a) => call(fn, a);
const toast = (m, bad) => {
  const t = $('#toast');
  t.textContent = m;
  t.className = (bad ? 'bad ' : '') + 'show';
  clearTimeout(window._t);
  window._t = setTimeout(() => t.className = bad ? 'bad' : '', 3600);
};
const err = e => toast(e.message, 1);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const wrap = h => { $('#v').innerHTML = h; window.scrollTo(0, 0); };
const stamp = d => (d.t0 = Date.now(), d);
let U, P, ROLE, I, NAMES = [], D, LM;

function start() {
  run('init').then(d => {
    I = stamp(d);
    $('#title').textContent = d.mess || 'Mess Manager';
    const s = loadSess();
    if (s) return doLogin(s.U, s.P, true);
    showLogin();
  }).catch(e => wrap(`<div class="card empty">${esc(e.message)}<button class="btn" onclick="start()">Try again</button></div>`));
}
function showLogin() {
  wrap(`<div class="card"><h2>Welcome</h2><p class="sub">Log in to continue</p>
  <label>Your name</label><select id="u"><option value="__manager">Manager</option>${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>
  <label>4-digit PIN</label><input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="login()">Log in</button>
  <button class="link" onclick="showSignup()">New member? Create an account</button></div>`);
}
const SK = 'mess_session';
const loadSess = () => { try { const s = JSON.parse(localStorage.getItem(SK)); return s && s.U && /^\d{4}$/.test(s.P) ? s : null; } catch (e) { return null; } };
const saveSess = () => { try { localStorage.setItem(SK, JSON.stringify({U, P})); } catch (e) {} };
const clearSess = () => { try { localStorage.removeItem(SK); } catch (e) {} };
const logout = () => { clearSess(); location.reload(); };
function login() {
  const u = $('#u').value, p = $('#p').value;
  if (!/^\d{4}$/.test(p)) return toast('Please enter your 4-digit PIN', 1);
  doLogin(u, p);
}
function doLogin(u, p, silent) {
  U = u; P = p;
  return run('boot', U, P).then(b => {
    ROLE = b.role; I = stamp(b.init); ME = b.me; VC = {};
    VC['me' + JSON.stringify([U, P])] = b.me;
    VC['report' + JSON.stringify([U, P])] = b.rep;
    $('#me').textContent = ROLE === 'M' ? 'Manager' : U;
    $('#out').style.display = '';
    saveSess();
    buildTabs();
    afterLogin();
    go('rep');
  }).catch(e => {
    if (!silent) return err(e);
    if (/internet/i.test(e.message)) return wrap(`<div class="card empty">${esc(e.message)}<button class="btn" onclick="start()">Try again</button></div>`);
    clearSess();
    showLogin();
  });
}

function showSignup() {
  wrap(`<div class="card"><h2>Create account</h2><p class="sub">The manager will approve your request.</p>
  <label>Full name</label><input id="sn" placeholder="e.g. Rahim Uddin">
  <label>Choose a 4-digit PIN for yourself<div class="hint">You will log in with this PIN. Example: 4821</div></label><input id="sp" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <button class="btn" onclick="signReview()">Continue</button><button class="link" onclick="showLogin()">Back to log in</button></div>`);
}
function signReview() {
  const n = $('#sn').value.trim(), p = $('#sp').value;
  if (n.length < 2) return toast('Please enter your name', 1);
  if (!/^\d{4}$/.test(p)) return toast('PIN must be 4 digits', 1);
  wrap(`<div class="card"><h3>Please check your details</h3><table><tr><td>Name</td><td><b>${esc(n)}</b></td></tr><tr><td>PIN</td><td><b>${esc(p)}</b></td></tr></table>
  <button class="btn" id="sc">Confirm and send request</button><button class="btn sec" onclick="showSignup()">Edit</button></div>`);
  $('#sc').onclick = () => run('signup', n, p).then(() => wrap(`<div class="card empty"><h2>Request sent ✅</h2><p>Please wait for the manager to approve you. After approval, log in with your name and PIN.</p><button class="btn" onclick="start()">Back to log in</button></div>`)).catch(err);
}

function buildTabs() {
  const t = [['rep', 'Report'], ['day', "Today's Meals"], ['off', 'Meal Off'], ['guest', 'Guest Meal'], ['baz', 'Bazar'], ['duty', 'Bazar Duty']];
  if (ROLE === 'M') t.splice(1, 0, ['req', 'Requests'], ['adv', 'Advance'], ['ann', 'Announcements'], ['dep', 'Deposit']), t.push(['mem', 'Members'], ['bill', 'Bills'], ['mess', 'Mess'], ['ent', 'Entries']);
  else t.splice(5, 0, ['pay', 'Payments']);
  $('#tabs').style.display = '';
  $('#tabs').innerHTML = t.map(x => `<button id="t_${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.id === 't_' + t));
  document.body.classList.toggle('bilingual-rep', t === 'rep');
  CUR = t;
  if (t !== 'pay') PRE = null;
  VIEWS[t]();
}

const FORMS = {
  off: ['Meal Off', 'Stop your meals while you are away. You can stop meals for today and future days.', [
    ['offDate', 'Meal off from (date)', 'date'],
    ['offShift', 'Starting from', 'shift'],
    ['onDate', 'Meal on again from (date)', 'date?', 'Leave empty if you do not know your return date. You can add it later.'],
    ['onShift', 'Starting from', 'shift']
  ]],
  guest: ['Guest Meal', 'Add guest meals eaten by your guests.', [
    ['date', 'Date', 'date'],
    ['shift', 'Meal', 'shift'],
    ['count', 'Number of guests', 'number', 'e.g. 2']
  ]],
  baz: ['Bazar Expense', 'Record the bazar you bought.', [
    ['date', 'Date', 'date'],
    ['amount', 'Amount (৳)', 'number', 'e.g. 500'],
    ['items', 'Items bought (optional)', 'text', 'e.g. Rice, lentils, fish']
  ]],
  dep: ['Deposit Entry', 'Record money deposited by a member.', [
    ['date', 'Date', 'date'],
    ['amount', 'Amount (৳)', 'number', 'e.g. 3000'],
    ['note', 'Note (optional)', 'text']
  ]]
};
function inp(k, l, t, h) {
  const ty = t.startsWith('date') ? 'date' : t === 'number' ? 'number' : 'text';
  const hint = h ? `<div class="hint">${h}</div>` : '';
  if (t === 'shift') return `<label>${l}</label><select id="f_${k}"><option value="L">${SH.L}</option><option value="D">${SH.D}</option></select>`;
  return `<label>${l}${hint}</label><input id="f_${k}" type="${ty}" ${t === 'date' ? `value="${I.today}"` : ''} ${ty === 'number' ? 'inputmode="decimal" min="0"' : ''}>`;
}
const hm = t => +String(t || '00:00').slice(0, 2) * 60 + +String(t || '00:00').slice(3, 5);
function ruleBox() {
  const k = I.rules, n = hm(k.now) + Math.floor((Date.now() - I.t0) / 60000);
  const st = n < hm(k.lunch)
    ? "You can stop both lunch and dinner for today."
    : n < hm(k.dinner)
      ? "The time to stop today's lunch is over. You can stop today's dinner and future meals."
      : "The time to stop today's meals is over. You can stop meals from tomorrow.";
  return `<div class="alert info" style="margin:0 0 4px"><div>Rule: today's lunch can be stopped until ${enTime(k.lunch)} and today's dinner until ${enTime(k.dinner)}. Food is wasted once cooking is done. Meals that have already been eaten cannot be stopped.<br><span style="font-weight:500">${st}</span></div></div>`;
}
async function form(type) {
  const [title, sub, fs] = FORMS[type];
  const mem = ROLE === 'M' ? `<label>Member</label><select id="f_member">${I.names.map(n => `<option>${esc(n)}</option>`).join('')}</select>` : '';
  wrap(`<div class="card"><h2>${title}</h2><p class="sub">${sub}</p>${type === 'off' && ROLE === 'U' ? ruleBox() : ''}${mem}${fs.map(x => inp(...x)).join('')}<button class="btn" onclick="review('${type}')">Continue</button></div><div id="offl"></div>`);
  if (type === 'off' && ROLE === 'U') offList();
}
function review(type) {
  const fs = FORMS[type][2], d = {};
  if (ROLE === 'M') d.member = $('#f_member').value;
  fs.forEach(x => d[x[0]] = $('#f_' + x[0]).value);
  const need = fs.filter(x => x[2] === 'date' || x[2] === 'number');
  if (need.some(x => !d[x[0]] || (x[2] === 'number' && !(Number(d[x[0]]) > 0)))) return toast('Please fill in all required fields', 1);
  const val = x => x[2] === 'shift' ? SH[d[x[0]]] : x[2].startsWith('date') ? (d[x[0]] ? fmt(d[x[0]]) : '-') : x[2] === 'number' && x[0] === 'amount' ? tk(d[x[0]]) : (d[x[0]] || '-');
  const rows = [['Member', d.member || U]].concat(fs.filter(x => !(x[0] === 'onShift' && !d.onDate)).map(x => [x[1].replace(/\s*\(.*\)/, ''), val(x)]));
  wrap(`<div class="card"><h3>Please check your details</h3><table>${rows.map(r => `<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}</table>
  <button class="btn" id="cf">Confirm</button><button class="btn sec" onclick="go('${type}')">Edit</button></div>`);
  $('#cf').onclick = () => run('save', U, P, type, d).then(() => { toast('Saved successfully'); go(type); }).catch(err);
}
function offHtml(l) {
  const open = l.filter(r => !r[5]);
  return `<div class="card"><h3>My meal-off list</h3>${l.length ? `<table><tr><th>Off from</th><th>On again</th></tr>${l.slice(0, 12).map(r => `<tr><td>${fmt(r[3])} · ${SH[r[4]]}</td><td>${r[5] ? fmt(r[5]) + ' · ' + SH[r[6]] : 'Not set yet'}</td></tr>`).join('')}</table>` : '<div class="empty">No entries yet</div>'}</div>

};
function notices() {

  });
  (ME.duties || []).filter(d => d[1] === U).forEach(d => {
    const a = dayGap(t, d[2]), range = fmt(d[2]) + ' to ' + fmt(d[3]);

const moDel = id => confirm('Cancel this mess closure?') && mgrCall('moDel', {id: id}).then(() => { toast('Announcement cancelled'); vAnn(); }).catch(err);

let VC = {}, CUR = '';
const RO = {init: 1, boot: 1, login: 1, me: 1, report: 1, daily: 1, myOffs: 1};
const VIEWS = {off: () => form('off'), guest: () => form('guest'), baz: () => form('baz'), dep: () => form('dep'), req: vReq, adv: vAdv, ann: vAnn, pay: vPay, duty: vDuty, rep: vRep, day: vDay, mem: vMem, bill: vBill, mess: vMess, ent: vEnt};
const typing = () => { const e = document.activeElement; return !!(e && /^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName) && $('#v').contains(e)); };
const rc = (fn, ...a) => {
  const k = fn + JSON.stringify(a), hit = VC[k], tab = CUR, get = () => call(fn, a).then(d => (VC[k] = d));
  if (hit === undefined) { load(1, 'Loading...'); return get().finally(() => load(-1)); }
  get().then(d => { if (JSON.stringify(d) !== JSON.stringify(hit) && CUR === tab && !typing() && VIEWS[tab]) VIEWS[tab](); }).catch(() => {});
  return Promise.resolve(hit);
};

start();
